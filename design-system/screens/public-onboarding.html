<!-- @dsCard group="Screens" name="Public Onboarding" subtitle="Warm canvas — vintage enrollment intake" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../ppbf.css">
<style>
  .sheet { max-width: 980px; margin: 0 auto; padding: var(--s7) var(--s6) var(--s8); }

  .head { max-width: 62ch; margin-bottom: var(--s7); }
  .head h1 { margin: var(--s3) 0 0; }
  .head p { margin: var(--s4) 0 0; }

  /* Golden-section layout: the card is the major, the photo mount the minor */
  .layout { display: grid; grid-template-columns: var(--split-major) var(--split-minor);
            gap: var(--s6); align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .card-head { margin: 0 0 var(--s5); }

  .enroll-form { display: flex; flex-direction: column; gap: var(--s5); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5); }
  @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

  /* Simple checkbox approach — matches Guardian Portal's .consent-row/.consent-check */
  .consent-row { display: flex; align-items: flex-start; gap: var(--s3); margin: var(--s5) 0; cursor: pointer; }
  .consent-check { width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px;
                    accent-color: var(--brass-600); border: 2px solid var(--brass-600);
                    border-radius: var(--r-sm); cursor: pointer; }

  .form-foot { display: flex; align-items: center; justify-content: space-between;
               flex-wrap: wrap; gap: var(--s4); }
  .form-foot p { margin: 0; max-width: 30ch; }

  /* Decorative side column */
  .side { display: flex; flex-direction: column; align-items: center;
          padding-top: var(--s5); text-align: center; }

  /* Photo corner mount — an empty portrait rectangle awaiting a print,
     brass corner clips only, bone-family fill. Purely decorative; appears
     once on the page. */
  .photo-mount {
    position: relative; width: var(--s8); height: 144px;
    background-color: var(--paper-2);
    border: 2px solid var(--brass-600);
    border-radius: var(--r-sm);
    box-shadow: inset 0 2px 8px rgba(0,0,0,.16), 0 4px 10px rgba(0,0,0,.22);
  }
  .corner-clip {
    position: absolute; width: var(--s5); height: var(--s5);
    background-image: linear-gradient(135deg, var(--brass-300), var(--brass-700));
    box-shadow: 0 1px 2px rgba(0,0,0,.35);
    clip-path: polygon(0 0, 100% 0, 0 100%);
  }
  .corner-clip--tl { top: calc(var(--s1) * -1); left: calc(var(--s1) * -1); }
  .corner-clip--tr { top: calc(var(--s1) * -1); right: calc(var(--s1) * -1); rotate: 90deg; }
  .corner-clip--br { bottom: calc(var(--s1) * -1); right: calc(var(--s1) * -1); rotate: 180deg; }
  .corner-clip--bl { bottom: calc(var(--s1) * -1); left: calc(var(--s1) * -1); rotate: 270deg; }

  .side .t-label { margin-top: var(--s4); }
  .side .t-muted { margin-top: var(--s2); max-width: 24ch; }
</style>

<body class="ppbf room--office">
<div class="sheet">

  <header class="head">
    <div class="t-eyebrow">New Member Enrollment</div>
    <h1 class="t-painted" style="font-size: var(--t-2xl)">Join The Gym</h1>
    <p class="t-body">
      Every fighter started with a first day. Fill out the card below and a coach
      will call to schedule your first session.
    </p>
  </header>

  <div class="layout">

    <!-- ENROLLMENT CARD -->
    <div class="frame">
      <span class="rivet rivet--tl"></span><span class="rivet rivet--tr"></span>
      <span class="rivet rivet--bl"></span><span class="rivet rivet--br"></span>
      <div class="frame-in mat-paper" style="padding: var(--s6)">
        <h2 class="t-command card-head" style="font-size: var(--t-lg)">Enrollment Application</h2>

        <form class="enroll-form" onsubmit="event.preventDefault();">
          <div class="field">
            <label class="t-label" for="fullName">Applicant Full Name</label>
            <input class="input" type="text" id="fullName" name="fullName" placeholder="First and last name" required>
          </div>

          <div class="form-row">
            <div class="field">
              <label class="t-label" for="dob">Date of Birth</label>
              <input class="input" type="date" id="dob" name="dob" required>
            </div>
            <div class="field">
              <label class="t-label" for="program">Program Interest</label>
              <select class="select" id="program" name="program" required>
                <option value="" disabled selected>Choose a program…</option>
                <option>Youth</option>
                <option>Adaptive / Disabled</option>
                <option>Deconditioned</option>
                <option>Beginner</option>
                <option>Recreational</option>
                <option>Competitive</option>
                <option>Elite / Pro</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="field">
              <label class="t-label" for="ecName">Emergency Contact Name</label>
              <input class="input" type="text" id="ecName" name="ecName" placeholder="Full name" required>
            </div>
            <div class="field">
              <label class="t-label" for="ecPhone">Emergency Contact Phone</label>
              <input class="input" type="tel" id="ecPhone" name="ecPhone" placeholder="(000) 000-0000" required>
            </div>
          </div>

          <label class="consent-row">
            <input class="consent-check" type="checkbox" name="consent" required>
            <span class="t-body">
              I consent to enrollment in PPBF programming for the applicant named above,
              and I have read and accept the Foundation's waiver and code of conduct.
            </span>
          </label>

          <div class="form-foot">
            <p class="t-muted">A coach will follow up within two business days.</p>
            <button class="btn" type="submit">Submit Application</button>
          </div>
        </form>
      </div>
    </div>

    <!-- PHOTO CORNER MOUNT -->
    <aside class="side">
      <div class="photo-mount">
        <span class="corner-clip corner-clip--tl"></span>
        <span class="corner-clip corner-clip--tr"></span>
        <span class="corner-clip corner-clip--bl"></span>
        <span class="corner-clip corner-clip--br"></span>
      </div>
      <div class="t-label">Photo On File</div>
      <p class="t-muted">Bring a snapshot for the wall on your first day.</p>
    </aside>

  </div>
</div>
</body>
