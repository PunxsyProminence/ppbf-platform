name: import-shadow-research

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database environment
        required: true
        type: choice
        options:
          - staging
          - production
      confirm_target:
        description: Retype the target exactly
        required: true
        type: string
      mode:
        description: Validate files only, or apply the idempotent import
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      tables:
        description: >-
          all writes sources, documents, chunks, the capability map and requirements.
          capability_map_only writes just the capability map -- use it to backfill feeder_tracks on a
          baseline that is ALREADY APPROVED, because a full import would set approval_state from the
          seed file and fail closed on the review-pair constraint.
        required: true
        default: all
        type: choice
        options:
          - all
          - capability_map_only
      confirm_import:
        description: For apply mode, type IMPORT RESEARCH exactly
        required: false
        type: string
      scope:
        description: >-
          Which slice of the corpus to import. platform_baseline is everything except PPBF's own
          house documents and always lands in the reserved platform organization. ppbf_policy is
          those house documents, for one gym. whole_corpus is the pre-split behaviour: everything
          into one organization.
        required: true
        default: platform_baseline
        type: choice
        options:
          - platform_baseline
          - ppbf_policy
          - whole_corpus
      organization_id:
        description: >-
          Owning organization. Ignored for platform_baseline, which is forced to the reserved
          platform organization. Otherwise leave blank to resolve it from the target app's own
          ppbf-pilot-default-org-id secret; set it only to import for some other organization
          deliberately.
        required: false
        type: string
      seed_account_id:
        description: Existing privileged account_id recorded as the importer
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: import-shadow-research-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  import:
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # RESOURCE_GROUP is deliberately NOT set here. The staging literal used
      # to sit at job level for BOTH targets, so a production dispatch looked
      # up app-ppbf-production inside the staging-named resource group -- which
      # only worked by accident of where that app happens to live today. It is
      # resolved per target by the step below: staging keeps its literal, and
      # production requires secrets.AZURE_PRODUCTION_RESOURCE_GROUP with no
      # staging fallback, mirroring deploy-production.yml.
      CONTAINER_APP_NAME: ${{ inputs.target == 'production' && 'app-ppbf-production' || 'app-ppbf-staging' }}
      # PPBF_ORG_ID is deliberately NOT set here -- it is resolved in a step below, because a
      # value that may come from a secret must be written to $GITHUB_ENV at run time. Declaring it
      # here as well would give one name two sources, which is exactly the bug #273 fixed in the
      # sibling workflow.
      SEED_ACCOUNT_ID: ${{ inputs.seed_account_id }}
    steps:
      - name: Confirm Explicit Target And Apply Intent
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          MODE: ${{ inputs.mode }}
          CONFIRM_IMPORT: ${{ inputs.confirm_import }}
        run: |
          set -euo pipefail
          test "$TARGET" = "$CONFIRM_TARGET"
          if [ "$MODE" = "apply" ]; then
            test "$CONFIRM_IMPORT" = "IMPORT RESEARCH"
          fi

      # A wrong-resource-group lookup that happens to resolve is worse than one
      # that refuses (deploy-production.yml records the same reasoning for its
      # own RESOURCE_GROUP), so an unset secret stops the run here -- before
      # the Azure login, and long before anything touches a database.
      - name: Resolve Target Resource Group
        env:
          TARGET: ${{ inputs.target }}
          PRODUCTION_RESOURCE_GROUP: ${{ secrets.AZURE_PRODUCTION_RESOURCE_GROUP }}
        run: |
          if [ "$TARGET" = "production" ]; then
            if [ -z "$PRODUCTION_RESOURCE_GROUP" ]; then
              echo "::error::secrets.AZURE_PRODUCTION_RESOURCE_GROUP is empty or unset. Refusing to fall back to the staging resource group for a production operation."
              exit 1
            fi
            echo "RESOURCE_GROUP=$PRODUCTION_RESOURCE_GROUP" >> "$GITHUB_ENV"
          else
            echo "RESOURCE_GROUP=rg-ppbf-enterprise-staging" >> "$GITHUB_ENV"
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      # NOT conditional on mode, deliberately. It was `if: inputs.mode == 'apply'`
      # until Resolve Owning Organization below started calling
      # `az containerapp secret show` whenever organization_id is blank -- which
      # is the normal case now, and which dry-run reaches too. Skipping login in
      # dry-run left that az call unauthenticated, so `set -euo pipefail` failed
      # the step: the feature's own headline path, in the mode an operator uses
      # first, was broken.
      - name: Authenticate via Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Must precede every step that reads PPBF_ORG_ID: $GITHUB_ENV only reaches LATER steps, so
      # reordering this leaves the YAML valid and hands the importer an empty organization -- a
      # failure nobody would guess from the dispatch form. seedWorkflowContract.test.ts asserts the
      # ordering for that reason.
      - name: Resolve Owning Organization
        env:
          SUPPLIED: ${{ inputs.organization_id }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          # The platform baseline has exactly one legal home. Importing 1,194 sources into a gym's
          # own organization would hand that gym a corpus every other gym reads as its private
          # evidence, and the mistake is one wrong dropdown away -- so the scope decides the
          # organization here rather than trusting the operator to pair them correctly. A supplied
          # value that disagrees is refused rather than ignored: silently overriding an explicit
          # input teaches an operator that the field does something it does not.
          if [ "$SCOPE" = "platform_baseline" ]; then
            if [ -n "$SUPPLIED" ] && [ "$SUPPLIED" != "__platform__" ]; then
              echo "::error::scope platform_baseline imports only into __platform__; clear organization_id or set it to __platform__."
              exit 1
            fi
            echo "PPBF_ORG_ID=__platform__" >> "$GITHUB_ENV"
            echo "ORG_SOURCE=reserved platform organization (forced by scope)" >> "$GITHUB_ENV"
            echo "Owning organization forced to the reserved platform organization by scope."
            exit 0
          fi
          if [ -n "$SUPPLIED" ]; then
            ORG="$SUPPLIED"
            SOURCE="operator input"
          else
            ORG="$(az containerapp secret show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --secret-name ppbf-pilot-default-org-id \
              --query value -o tsv)"
            SOURCE="$CONTAINER_APP_NAME default org secret"
          fi
          if [ -z "$ORG" ]; then
            echo "::error::Could not resolve an owning organization. Supply organization_id explicitly."
            exit 1
          fi
          # Masked because the app treats it as a secret. The importer prints counts and never the
          # organization, so nothing downstream leaks it either.
          echo "::add-mask::$ORG"
          echo "PPBF_ORG_ID=$ORG" >> "$GITHUB_ENV"
          echo "ORG_SOURCE=$SOURCE" >> "$GITHUB_ENV"
          echo "Owning organization resolved from $SOURCE."

      - name: Resolve Declared Database Target
        if: inputs.mode == 'apply'
        env:
          OVERRIDE_HOST: ${{ vars.PPBF_EXPECTED_POSTGRES_HOSTNAME }}
          OVERRIDE_DB: ${{ vars.PPBF_EXPECTED_POSTGRES_DATABASE }}
        run: |
          set -euo pipefail
          CONN="$(az containerapp secret show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-postgres-connection-string \
            --query value -o tsv)"
          test -n "$CONN"
          echo "::add-mask::$CONN"
          echo "AZURE_POSTGRES_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"

          DERIVED="$(CONN="$CONN" node -e '
            const u = new URL(process.env.CONN);
            const host = u.hostname.toLowerCase();
            const db = decodeURIComponent(u.pathname.replace(/^\/+/, ""));
            if (!host || !db) process.exit(2);
            process.stdout.write(host + "\n" + db);
          ')"
          HOST="$(printf '%s' "$DERIVED" | sed -n 1p)"
          DB="$(printf '%s' "$DERIVED" | sed -n 2p)"
          echo "PPBF_EXPECTED_POSTGRES_HOSTNAME=${OVERRIDE_HOST:-$HOST}" >> "$GITHUB_ENV"
          echo "PPBF_EXPECTED_POSTGRES_DATABASE=${OVERRIDE_DB:-$DB}" >> "$GITHUB_ENV"

      # whole_corpus maps to an UNSET variable, not to the string 'whole_corpus': the importer
      # treats unset as "no split", and would refuse an unknown scope name.
      - name: Resolve Corpus Scope
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" != "whole_corpus" ]; then
            echo "PPBF_RESEARCH_SEED_SCOPE=$SCOPE" >> "$GITHUB_ENV"
          fi
          echo "Corpus scope: $SCOPE"

      - name: Validate Research Package
        if: inputs.mode == 'dry-run'
        working-directory: apps/web
        # `shell: bash` for pipefail. This is the VALIDATION GATE an operator
        # reads before dispatching mode: apply, so a green step on a failed
        # validation is the worst possible direction to fail. The apply arm
        # below already sets `set -euo pipefail` for the same reason.
        shell: bash
        run: npm run seed:shadow:research:dry 2>&1 | tee -a /tmp/tool-output.txt

      - name: Import Research Package
        if: inputs.mode == 'apply'
        working-directory: apps/web
        env:
          TABLES: ${{ inputs.tables }}
        run: |
          set -euo pipefail
          if [ "$TABLES" = "capability_map_only" ]; then
            npm run seed:shadow:research -- --apply --capability-map-only 2>&1 | tee -a /tmp/tool-output.txt
          else
            npm run seed:shadow:research -- --apply 2>&1 | tee -a /tmp/tool-output.txt
          fi

      - name: Record Human Review Boundary
        # Matches the equivalent step in every sibling workflow. The run whose
        # boundary statement matters most is the one that failed part way.
        if: always()
        run: |
          {
            echo '### SHADOW research intake'
            echo ''
            echo "- target: \`${{ inputs.target }}\`"
            echo "- mode: \`${{ inputs.mode }}\`"
            echo "- scope: \`${{ inputs.scope }}\`"
            echo "- tables: \`${{ inputs.tables }}\`"
            # Prints the SOURCE, never the value: the organization is masked and may have come
            # from a secret, and a run summary is not a place to undo that.
            echo "- organization resolved from: \`$ORG_SOURCE\`"
            echo '- evidence approval: `pending_review`'
            echo '- embeddings: not generated by this workflow'
            echo ''
            echo 'Imported evidence remains unavailable to SHADOW retrieval until a qualified reviewer approves it and the existing embedding backfill completes.'
          } >> "$GITHUB_STEP_SUMMARY"
