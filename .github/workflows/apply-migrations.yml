# ─────────────────────────────────────────────────────────────────────
# Database migrations -- manual only.
#
# Until this existed, applying a migration meant running `npm run pilot:apply-*`
# from someone's laptop with a production connection string in their shell. That
# is the step the deploy workflows depend on and cannot verify: both of them ask
# the operator to attest `migrations_complete`, and deploying code before its
# schema fails every request that touches the new column.
#
# This runs the same runner scripts, using the same Azure OIDC identity the
# deploy workflows already hold, and reads the connection string from the
# Container App secret rather than a laptop. No new credential is introduced --
# an operator who could dispatch a deploy could already reach these resources.
#
# SAFETY PROPERTIES
#   * workflow_dispatch only. Nothing here runs on push, and there is no
#     schedule -- a migration is never applied as a side effect of merging.
#   * `confirm_target` must exactly equal the chosen target, so dispatching
#     against production is a deliberate act rather than a wrong dropdown.
#   * `environment:` is the target name, so if a GitHub environment protection
#     rule (required reviewers) is configured for production, it gates this too.
#     deploy-production.yml declares `environment: production` as well, so a
#     single protection rule on that environment gates schema changes and the
#     code deploy alike -- neither half is ungated.
#   * Every runner is idempotent -- the SQL is `... if not exists` throughout,
#     the first-login-pin runner wraps its statements in a single explicit
#     transaction that rolls back as a unit, and the shadow-runtime runner takes
#     a Postgres advisory lock so two concurrent dispatches cannot interleave.
#     Re-running a migration that already applied is a no-op, which is why `all`
#     is a safe default rather than a dangerous one.
#
# WHAT `all` DOES NOT INCLUDE
#   The base schema (`pilot:apply-schema`) is deliberately its own option. It is
#   idempotent too, but it is the whole schema rather than an increment, and
#   applying it belongs to standing up a new environment -- not to a routine
#   deploy. Choosing it should be a separate decision.
# ─────────────────────────────────────────────────────────────────────

name: apply-migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which environment's database to migrate
        required: true
        type: choice
        options:
          - staging
          - production
      confirm_target:
        description: Retype the target exactly ("staging" or "production") to confirm
        required: true
        type: string
      migration:
        description: Which migration to apply ("all" runs every increment in dependency order)
        required: true
        default: all
        type: choice
        options:
          - all
          - multiorg
          - magic-link
          - session-expiry
          - first-login-pin
          - audit-event-vocabulary
          - shadow-runtime
          - research-triage-view
          - shadow-evidence
          - shadow-decision-loop
          - medical-clearance-expiry
          - onboarding
          - board-role
          - shadow-chunk-embedding
          - shadow-formula-foundation
          - shadow-job-lease
          - shadow-filter-reason
          - public-interest
          - scheduler-tables
          - scheduler-race
          - announcements
          - volunteer-program
          - video-sessions
          - film-study-proposals
          - progression
          - base-schema-new-environment-only
          - compliance
          - list-check
          - publications
          - publication-retraction
          - announcement-placements
          - parent-hub-placement
          - compliance-rule-seeds
          - board-seats
          - drills
          - rabbit-holes
          - feedback
          - rate-limit
          - gear
          - gear-vendors
          - achievements
          - profile-identity
          - goal-category-progress
          - attendance-parent-method
          - safety-gate-matrix
          - safety-escalations
          - coach-coverage
          - training-holds
          - data-retention-deletion
          - guardian-media-consent
          - drill-versioning
          - dead-schema-removal
          - drill-library-v3
          - drill-vocabulary-widening
          - activity-log
          - assessment-protocols
          - clearance-register
          - sparring-exposure
          - safety-flags
          - floor-hours-ledger
          - local-findings
          - workout-templates-v2
          - source-citation-checks
          - retraction-surveillance
          - multidiscipline
          - session-scripts
          - session-run-state
          - transfer-claims
          - competence-cohorts
          - method-naming
          - platform-library-scope
          - grant-obligations
          - shadow-research-submissions
          - wrestling-league
          - external-competition
          - payments
          - program-memberships
          - training-attempts
          - intervention-protocols
          - intervention-executions
          - intervention-evidence
          - sparring-attempt-contexts
          - athlete-check-ins
          - competition-results
          - program-phases
          - floor-groups
          - behavior-standards
          - capability-feeder-tracks
          - emergency-contact-note
          - research-requirement-subject
          - readiness-provenance
          - attendance-precedence
          - one-percent-club

permissions:
  id-token: write
  contents: read

concurrency:
  # Two migrations against one database at the same time is never intended.
  # The shadow-runtime runner's advisory lock would serialize its own SQL, but
  # nothing coordinates across different runners, so serialize per target here.
  group: apply-migrations-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  apply:
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESOURCE_GROUP: rg-ppbf-enterprise-staging
      CONTAINER_APP_NAME: ${{ inputs.target == 'production' && 'app-ppbf-production' || 'app-ppbf-staging' }}
    steps:
      - name: Confirm The Operator Named The Intended Target
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm_target }}
        run: |
          if [ "$TARGET" != "$CONFIRM" ]; then
            echo "::error::confirm_target ('$CONFIRM') does not match target ('$TARGET'). Refusing to migrate."
            exit 1
          fi
          echo "Migrating the **$TARGET** database ($CONTAINER_APP_NAME)." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      - name: Authenticate via Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Masked before it is written anywhere. It is scoped to this job, and the
      # job does nothing after the migration step.
      #
      # Four of the runners (shadow-runtime, public-interest, scheduler-tables,
      # scheduler-race) additionally require PPBF_EXPECTED_POSTGRES_HOSTNAME and
      # PPBF_EXPECTED_POSTGRES_DATABASE -- a guard that aborts if the connection
      # string does not point where the operator expected. It exists for the
      # laptop path, where a human might paste the wrong connection string.
      #
      # Here the connection string is fetched from a target-NAMED app
      # (app-ppbf-staging / app-ppbf-production), so that fetch is already the
      # strong target guard -- you cannot ask Azure for staging's app and get
      # production's secret. The expected values are therefore derived from the
      # fetched string by default, which turns the runner's own check into a
      # consistency assertion rather than an independent one. An operator who
      # wants the independent check sets repo variables
      # PPBF_EXPECTED_POSTGRES_HOSTNAME / PPBF_EXPECTED_POSTGRES_DATABASE, and
      # those are preferred when present.
      - name: Resolve Database Connection
        env:
          OVERRIDE_HOST: ${{ vars.PPBF_EXPECTED_POSTGRES_HOSTNAME }}
          OVERRIDE_DB: ${{ vars.PPBF_EXPECTED_POSTGRES_DATABASE }}
        run: |
          CONN="$(az containerapp secret show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-postgres-connection-string \
            --query value -o tsv)"
          test -n "$CONN"
          echo "::add-mask::$CONN"
          echo "AZURE_POSTGRES_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"

          # Parse exactly as the runner does (URL, lowercased host, decoded
          # path) so a derived value can never disagree with the runner's own
          # parse of the same string.
          DERIVED="$(CONN="$CONN" node -e '
            const u = new URL(process.env.CONN);
            const host = u.hostname.toLowerCase();
            const db = decodeURIComponent(u.pathname.replace(/^\/+/, ""));
            if (!host || !db) { process.exit(2); }
            process.stdout.write(host + "\n" + db);
          ')"
          HOST="$(printf '%s' "$DERIVED" | sed -n 1p)"
          DB="$(printf '%s' "$DERIVED" | sed -n 2p)"
          test -n "$HOST"
          test -n "$DB"

          EXPECTED_HOST="${OVERRIDE_HOST:-$HOST}"
          EXPECTED_DB="${OVERRIDE_DB:-$DB}"
          echo "PPBF_EXPECTED_POSTGRES_HOSTNAME=$EXPECTED_HOST" >> "$GITHUB_ENV"
          echo "PPBF_EXPECTED_POSTGRES_DATABASE=$EXPECTED_DB" >> "$GITHUB_ENV"
          echo "Target host: $EXPECTED_HOST / db: $EXPECTED_DB (override in effect: ${OVERRIDE_HOST:+yes}${OVERRIDE_HOST:-no})."

      - name: Apply Migration
        env:
          MIGRATION: ${{ inputs.migration }}
        run: |
          set -euo pipefail
          cd apps/web

          run_one() {
            echo "::group::npm run pilot:apply-$1"
            npm run "pilot:apply-$1"
            echo "::endgroup::"
          }

          case "$MIGRATION" in
            base-schema-new-environment-only)
              run_one schema
              ;;
            all)
              # Dependency order, matching the sequence these were introduced in.
              # Each is idempotent, so re-running an already-applied migration is
              # a no-op and the set can be applied wholesale without tracking
              # which environment is at which revision.
              # gear-vendors follows gear: it alters pilot.gear_products, which
              # the gear migration creates.
              for m in multiorg magic-link onboarding session-expiry first-login-pin audit-event-vocabulary shadow-runtime research-triage-view shadow-evidence shadow-decision-loop medical-clearance-expiry public-interest scheduler-tables scheduler-race announcements volunteer-program video-sessions film-study-proposals progression compliance publications publication-retraction announcement-placements parent-hub-placement compliance-rule-seeds board-seats board-role shadow-chunk-embedding shadow-formula-foundation shadow-job-lease shadow-filter-reason drills rabbit-holes feedback rate-limit gear gear-vendors achievements profile-identity goal-category-progress attendance-parent-method safety-gate-matrix safety-escalations coach-coverage training-holds data-retention-deletion guardian-media-consent drill-versioning dead-schema-removal drill-library-v3 drill-vocabulary-widening activity-log assessment-protocols clearance-register sparring-exposure safety-flags floor-hours-ledger local-findings workout-templates-v2 source-citation-checks retraction-surveillance multidiscipline session-scripts session-run-state transfer-claims competence-cohorts method-naming platform-library-scope capability-feeder-tracks grant-obligations shadow-research-submissions wrestling-league external-competition payments program-memberships training-attempts intervention-protocols intervention-executions intervention-evidence sparring-attempt-contexts athlete-check-ins competition-results program-phases floor-groups behavior-standards emergency-contact-note research-requirement-subject readiness-provenance attendance-precedence one-percent-club; do
                run_one "$m"
              done
              ;;
            list-check)
              # Guards the hazard above: this list is hand-maintained, so a new
              # pilot:apply-* script is silently excluded from `all` until
              # someone remembers to add it. audit-event-vocabulary was already
              # missing when this workflow first shipped. Dispatch this after
              # adding a migration -- it touches no database.
              missing=0
              for s in $(node -e "const p=require('./package.json');Object.keys(p.scripts).filter(k=>k.startsWith('pilot:apply-')).forEach(k=>console.log(k.replace('pilot:apply-','')))"); do
                case " multiorg magic-link onboarding session-expiry first-login-pin audit-event-vocabulary shadow-runtime research-triage-view shadow-evidence shadow-decision-loop medical-clearance-expiry public-interest scheduler-tables scheduler-race announcements volunteer-program video-sessions film-study-proposals progression compliance publications publication-retraction announcement-placements parent-hub-placement compliance-rule-seeds board-seats board-role shadow-chunk-embedding shadow-formula-foundation shadow-job-lease shadow-filter-reason drills rabbit-holes feedback rate-limit gear gear-vendors achievements profile-identity goal-category-progress attendance-parent-method safety-gate-matrix safety-escalations coach-coverage training-holds data-retention-deletion guardian-media-consent drill-versioning dead-schema-removal drill-library-v3 drill-vocabulary-widening activity-log assessment-protocols clearance-register sparring-exposure safety-flags floor-hours-ledger local-findings workout-templates-v2 source-citation-checks retraction-surveillance multidiscipline session-scripts session-run-state transfer-claims competence-cohorts method-naming platform-library-scope capability-feeder-tracks grant-obligations shadow-research-submissions wrestling-league external-competition payments program-memberships training-attempts intervention-protocols intervention-executions intervention-evidence sparring-attempt-contexts athlete-check-ins competition-results program-phases floor-groups behavior-standards emergency-contact-note research-requirement-subject readiness-provenance attendance-precedence one-percent-club schema " in
                  *" $s "*) ;;
                  *) echo "::error::pilot:apply-$s is not covered by the 'all' list in this workflow."; missing=1 ;;
                esac
              done
              test "$missing" -eq 0
              echo "Every pilot:apply-* script is covered by 'all'."
              ;;
            *)
              run_one "$MIGRATION"
              ;;
          esac

      - name: Record What Ran
        if: always()
        env:
          MIGRATION: ${{ inputs.migration }}
          TARGET: ${{ inputs.target }}
        run: |
          {
            echo ''
            echo "### Migration result"
            echo ''
            echo "- target: \`$TARGET\`"
            echo "- migration: \`$MIGRATION\`"
            echo "- outcome: \`${{ job.status }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo ''
            if [ "${{ job.status }}" = "success" ]; then
              echo "Safe to attest \`migrations_complete\` for **$TARGET** for the migrations listed above."
            else
              echo "**Do not** attest \`migrations_complete\` -- this run did not succeed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
