# ─────────────────────────────────────────────────────────────────────────
# Reference-data seeding -- manual only, one loader per dispatch or all of them.
#
# Before this existed, the only way to load the drill library, the discipline
# list or the competence ladder into a real environment was to point
# AZURE_POSTGRES_CONNECTION_STRING at it from a laptop and run an npm script.
# That put a production connection string on a developer's machine to do
# something the pipeline should have been doing, and it bypassed every guard
# the deploy path has -- environment protection, OIDC, and the declared-target
# check the runners already implement.
#
# This mirrors import-shadow-research.yml exactly: the connection string is
# read from the Container App's own secret at run time, masked, and never
# leaves the runner.
#
# ORDER MATTERS. Every loader below requires its migration to have been applied
# first via apply-migrations.yml. seed:drill-library additionally requires the
# drill-vocabulary-widening migration -- without it, 228 scale-level rows and
# 63 stop-rule rows are rejected and the whole seeding transaction aborts.
#
# `dataset: all` exists because one-per-dispatch made a full pass six gated
# runs -- three dry-run, three apply -- and on a protected environment that is
# six approval clicks for one deploy. Worse, firing them together does not
# work: the concurrency group holds a single pending run, so a third dispatch
# CANCELS the second, and a cancelled run is easy to read as a finished one.
# `all` runs the loaders in the required order inside one gated run.
#
# session-scripts joined the choices once its two content-less Friday-sparring
# blocks were given real what_to_* text; it needs only its own migration
# (`npm run pilot:apply-session-scripts`, which runs
# scripts/pilot-apply-session-scripts-migration.mjs) -- its blocks reference
# no drills -- so it runs
# after the original three.
#
# ONE LOADER IS DELIBERATELY ABSENT from the choices below, because it fails
# whole against the shipped schema and there is nothing to be gained by making
# it one click away:
#   * transfer-claims -- all 173 rows reference a drill-id generation that
#     resolves against nothing shipped, violating pilot_transfer_drill_fk.
# Add it here when the underlying data is fixed, not before.
# ─────────────────────────────────────────────────────────────────────────

name: seed-reference-data

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database environment
        required: true
        type: choice
        options:
          - staging
          - production
      confirm_target:
        description: Retype the target exactly ("staging" or "production") to confirm
        required: true
        type: string
      dataset:
        description: Which reference dataset to load ("all" runs every loader in dependency order)
        required: true
        type: choice
        options:
          - all
          - drill-library
          - disciplines
          - competence-cohorts
          - session-scripts
      mode:
        description: Rehearse inside a rolled-back transaction, or write for real
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirm_seed:
        description: For apply mode, type SEED REFERENCE DATA exactly
        required: false
        type: string
      organization_id:
        description: >-
          organization_id that will own the rows. Leave BLANK to use the target
          app's own default org secret, which is what you want in almost every
          case. Only set it to seed a different organization on purpose.
        required: false
        type: string
      seed_account_id:
        description: Existing privileged account_id recorded as the seeder (drill-library and session-scripts)
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: seed-reference-data-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  seed:
    # Same environment name as the target, so a protection rule on `production`
    # gates this exactly as it gates apply-migrations and deploy-production.
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # RESOURCE_GROUP is deliberately NOT set here. The staging literal used
      # to sit at job level for BOTH targets, so a production dispatch looked
      # up app-ppbf-production inside the staging-named resource group. It is
      # resolved per target by the step below: staging keeps its literal, and
      # production requires secrets.AZURE_PRODUCTION_RESOURCE_GROUP with no
      # staging fallback, mirroring deploy-production.yml.
      CONTAINER_APP_NAME: ${{ inputs.target == 'production' && 'app-ppbf-production' || 'app-ppbf-staging' }}
      # PPBF_SEED_ACCOUNT_ID is the loader's actual contract name -- see
      # seed-drill-library.mjs. It is deliberately NOT named after the
      # {{SEED_ACCOUNT_ID}} placeholder in the CSVs: that placeholder is the token
      # substituted into the seed text, not the variable carrying the value.
      #
      # PPBF_SEED_ORG_ID is NOT set here. It is resolved in a step below, because
      # when the operator leaves organization_id blank the value has to be read
      # from the target app's own secret at run time. Setting it at job level too
      # would leave two sources for one name.
      PPBF_SEED_ACCOUNT_ID: ${{ inputs.seed_account_id }}
    steps:
      - name: Confirm Explicit Target And Apply Intent
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          MODE: ${{ inputs.mode }}
          CONFIRM_SEED: ${{ inputs.confirm_seed }}
          DATASET: ${{ inputs.dataset }}
          SEED_ACCOUNT: ${{ inputs.seed_account_id }}
        run: |
          set -euo pipefail
          test "$TARGET" = "$CONFIRM_TARGET"
          if [ "$MODE" = "apply" ]; then
            test "$CONFIRM_SEED" = "SEED REFERENCE DATA"
          fi
          # seed-drill-library.mjs and seed-session-scripts.mjs stamp a seeder
          # onto every row they write and fail without one. Catching that here
          # costs a second instead of an aborted transaction against a real
          # database.
          if [ "$DATASET" = "drill-library" ] || [ "$DATASET" = "session-scripts" ] || [ "$DATASET" = "all" ]; then
            test -n "$SEED_ACCOUNT"
          fi

      # A wrong-resource-group lookup that happens to resolve is worse than one
      # that refuses (deploy-production.yml records the same reasoning for its
      # own RESOURCE_GROUP), so an unset secret stops the run here -- before
      # the Azure login, and long before anything touches a database.
      - name: Resolve Target Resource Group
        env:
          TARGET: ${{ inputs.target }}
          PRODUCTION_RESOURCE_GROUP: ${{ secrets.AZURE_PRODUCTION_RESOURCE_GROUP }}
        run: |
          if [ "$TARGET" = "production" ]; then
            if [ -z "$PRODUCTION_RESOURCE_GROUP" ]; then
              echo "::error::secrets.AZURE_PRODUCTION_RESOURCE_GROUP is empty or unset. Refusing to fall back to the staging resource group for a production operation."
              exit 1
            fi
            echo "RESOURCE_GROUP=$PRODUCTION_RESOURCE_GROUP" >> "$GITHUB_ENV"
          else
            echo "RESOURCE_GROUP=rg-ppbf-enterprise-staging" >> "$GITHUB_ENV"
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      - name: Authenticate via Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Declared Database Target
        env:
          OVERRIDE_HOST: ${{ vars.PPBF_EXPECTED_POSTGRES_HOSTNAME }}
          OVERRIDE_DB: ${{ vars.PPBF_EXPECTED_POSTGRES_DATABASE }}
        run: |
          set -euo pipefail
          CONN="$(az containerapp secret show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-postgres-connection-string \
            --query value -o tsv)"
          test -n "$CONN"
          echo "::add-mask::$CONN"
          echo "AZURE_POSTGRES_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"

          DERIVED="$(CONN="$CONN" node -e '
            const u = new URL(process.env.CONN);
            const host = u.hostname.toLowerCase();
            const db = decodeURIComponent(u.pathname.replace(/^\/+/, ""));
            if (!host || !db) process.exit(2);
            process.stdout.write(host + "\n" + db);
          ')"
          HOST="$(printf '%s' "$DERIVED" | sed -n 1p)"
          DB="$(printf '%s' "$DERIVED" | sed -n 2p)"
          echo "PPBF_EXPECTED_POSTGRES_HOSTNAME=${OVERRIDE_HOST:-$HOST}" >> "$GITHUB_ENV"
          echo "PPBF_EXPECTED_POSTGRES_DATABASE=${OVERRIDE_DB:-$DB}" >> "$GITHUB_ENV"

      # The organization that will own every seeded row. Asking an operator to
      # type this was the wrong shape: the value is a secret they cannot see
      # from here, so the only way to supply it was to copy it out of Azure by
      # hand, and a typo seeds a real database under an organization that does
      # not exist. The app already knows its own default org -- it reads this
      # exact secret to answer requests, and the staging E2E gate resolves it
      # the same way -- so the pipeline reads it too, and the operator supplies
      # nothing unless they mean to override it.
      - name: Resolve Owning Organization
        env:
          SUPPLIED: ${{ inputs.organization_id }}
        run: |
          set -euo pipefail
          if [ -n "$SUPPLIED" ]; then
            ORG="$SUPPLIED"
            SOURCE="operator input"
          else
            ORG="$(az containerapp secret show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --secret-name ppbf-pilot-default-org-id \
              --query value -o tsv)"
            SOURCE="$CONTAINER_APP_NAME default org secret"
          fi
          if [ -z "$ORG" ]; then
            echo "::error::Could not resolve an owning organization. Supply organization_id explicitly."
            exit 1
          fi
          # Masked because the app treats it as a secret; the loaders print
          # counts, never the org, so nothing downstream leaks it either.
          echo "::add-mask::$ORG"
          echo "PPBF_SEED_ORG_ID=$ORG" >> "$GITHUB_ENV"
          echo "ORG_SOURCE=$SOURCE" >> "$GITHUB_ENV"
          echo "Owning organization resolved from $SOURCE."

      # --dry-run still performs every insert for real inside a transaction and
      # then rolls back, so it proves the data actually fits the live schema
      # rather than only that the files parse.
      # The steps are ordered drill-library -> disciplines -> competence-cohorts
      # -> session-scripts, which is the order the runbook requires, so `all`
      # cannot run them wrong (session-scripts depends on nothing before it and
      # runs last).
      # Each loader still opens its own transaction, so `all` is a chain of
      # independent commits and not one giant one -- a later failure leaves the
      # earlier datasets loaded, and every loader is idempotent, so the fix is
      # to re-run rather than to unpick anything.
      - name: Seed Drill Library
        if: inputs.dataset == 'drill-library' || inputs.dataset == 'all'
        working-directory: apps/web
        run: npm run seed:drill-library ${{ inputs.mode == 'dry-run' && '-- --dry-run' || '' }}

      - name: Seed Disciplines
        if: inputs.dataset == 'disciplines' || inputs.dataset == 'all'
        working-directory: apps/web
        run: npm run seed:disciplines ${{ inputs.mode == 'dry-run' && '-- --dry-run' || '' }}

      - name: Seed Competence Cohorts
        if: inputs.dataset == 'competence-cohorts' || inputs.dataset == 'all'
        working-directory: apps/web
        run: npm run seed:competence-cohorts ${{ inputs.mode == 'dry-run' && '-- --dry-run' || '' }}

      - name: Seed Session Scripts
        if: inputs.dataset == 'session-scripts' || inputs.dataset == 'all'
        working-directory: apps/web
        run: npm run seed:session-scripts ${{ inputs.mode == 'dry-run' && '-- --dry-run' || '' }}

      - name: Record What Ran
        run: |
          {
            echo "### Reference data seeding"
            echo ""
            echo "- target: \`${{ inputs.target }}\`"
            echo "- dataset: \`${{ inputs.dataset }}\`"
            echo "- mode: \`${{ inputs.mode }}\`"
            # Never the value itself -- it is masked, and printing it here would
            # put a secret in a summary anyone with repo read access can see.
            echo "- owning organization: resolved from \`$ORG_SOURCE\`"
            echo ""
            if [ "${{ inputs.mode }}" = "dry-run" ]; then
              echo "Rehearsed and rolled back. Nothing was written."
            else
              echo "Written. The loaders are idempotent -- re-running adds no duplicates."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
