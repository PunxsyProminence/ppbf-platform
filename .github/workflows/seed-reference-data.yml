# ─────────────────────────────────────────────────────────────────────────
# Reference-data seeding -- manual only. R1 route 3: files handed over,
# validated, committed by PR, then loaded HERE (Jason 2026-09-29: "for seeding
# it will be 3").
#
# Before this existed, the only way to load the drill library, the discipline
# list or the competence ladder into a real environment was to point
# AZURE_POSTGRES_CONNECTION_STRING at it from a laptop and run an npm script.
# That put a production connection string on a developer's machine to do
# something the pipeline should have been doing, and it bypassed every guard
# the deploy path has -- environment protection, OIDC, and the declared-target
# check the runners already implement. The connection string is read from the
# Container App's own secret at run time, masked, and never leaves the runner
# (the import-shadow-research.yml shape).
#
# ONE LOADER. Every dataset goes through the content-import core
# (apps/web/src/server/pilot/contentImport/, CLI scripts/pilot-content-import.ts)
# -- the same plan and apply the in-app upload screen (/admin/content-import,
# #1031) calls. The
# seven per-dataset seed-*.mjs loaders it replaced are gone (IMP-10); they were
# insert-only, so a revised row was skipped without a word, which R2 ("new
# stuff gets added if there is nothing to update") rules out. Now a changed item
# gets a new version, the old one kept; a new item is inserted; an unchanged
# item is skipped. docs/CONTENT_PACKAGE_CONTRACT.md says what each file may
# carry.
#
# TWO JOBS, AND THE ORDER IS THE POINT.
#   validate  no environment, no secrets, no Azure: confirms the form, then
#             checks the COMMITTED files this dispatch would load with the
#             same validator every PR is held to (content:validate --dataset).
#             A dispatch runs on whatever branch was picked, not only main, so
#             this is not a repeat of the PR guard. A package that would be
#             refused fails here, before anyone is asked to approve a
#             production run and before any credential exists.
#   seed      needs validate. Resolves the target, logs in, then plans and
#             applies.
#
# ONE TRANSACTION. `dataset: all` is one CLI call: it plans every dataset
# (printed before anything is written), then applies all of them in ONE
# transaction -- disciplines before the drills, scripts and cohorts that name
# them, drills before the templates that name them (apply order is
# specs/index.ts). Any failure leaves nothing. The old `all` was a chain of
# independent commits, so a failure half way left the earlier datasets loaded.
#
# DRY RUN STILL APPLIES. mode=dry-run performs every insert, update, history
# and audit row for real inside that transaction and then ROLLS BACK, so it
# proves the data fits the live schema (CHECKs, foreign keys, triggers), not
# only that the files parse or that a plan can be drawn up.
#
# THE SEEDER. Every dataset needs seed_account_id: the load runs AS that
# account and every row records it and its role. For gym content it must be an
# organization_admin (or admin) of the target gym with an ACTIVE membership
# there -- ppbf@punxsyprominence.org for punxsy_prominence -- never the
# platform_owner Admin@ account. The core refuses anything else
# (contentImport/actor.ts); this form only makes the input impossible to skip.
#
# ONE DATASET REMAINS ABSENT from the choices below:
#
#   * transfer-claims -- all 173 committed rows point at 61 drill ids that are
#     not in the library, so its file does not validate
#     (contentPackageContract.test.ts pins exactly those 173), and the core has
#     no loader for it yet. seedWorkflowContract.test.ts fails the day its file
#     validates, so adding it here is a decision rather than something noticed
#     by accident.
#
# universal-stop-rules is loadable but has no committed file yet; `all` picks
# it up the day one lands, and seedWorkflowContract.test.ts then asks for it to
# become a choice.
# ─────────────────────────────────────────────────────────────────────────

name: seed-reference-data

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database environment
        required: true
        type: choice
        options:
          - staging
          - production
      confirm_target:
        description: Retype the target exactly ("staging" or "production") to confirm
        required: true
        type: string
      dataset:
        description: >-
          Which reference dataset to load. "all" plans every dataset, then
          applies them in one transaction.
        required: true
        type: choice
        options:
          - all
          - disciplines
          - competence-levels
          - cohort-definitions
          - drill-library
          - workout-templates
          - session-scripts
      mode:
        description: Rehearse inside a rolled-back transaction, or write for real
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirm_seed:
        description: For apply mode, type SEED REFERENCE DATA exactly
        required: false
        type: string
      organization_id:
        description: >-
          organization_id that will own the rows. For gym content pass
          punxsy_prominence (OD-2026-09-28-007). ppbf-default-org is the
          platform root organization, not the gym.
        required: true
        type: string
      seed_account_id:
        description: >-
          Existing account_id the load runs as, for EVERY dataset. For gym
          content an organization_admin of punxsy_prominence with an active
          membership there (ppbf@punxsyprominence.org), never the
          platform_owner Admin@ account -- the loader refuses anything else.
          Case-sensitive; read it with check-database seed-identity. Every row
          written records this account and its role.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seed-reference-data-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate:
    # NO `environment:` and no secrets, on purpose: this job cannot read a
    # connection string or log in to Azure, so nothing it runs can touch a
    # database. It also needs no approval, so a refused package costs no
    # reviewer's click on a protected environment.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Confirm Explicit Target And Apply Intent
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          MODE: ${{ inputs.mode }}
          CONFIRM_SEED: ${{ inputs.confirm_seed }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
          SEED_ACCOUNT: ${{ inputs.seed_account_id }}
        run: |
          set -euo pipefail
          test "$TARGET" = "$CONFIRM_TARGET"
          if [ "$MODE" = "apply" ]; then
            test "$CONFIRM_SEED" = "SEED REFERENCE DATA"
          fi
          # Every dataset, not a list of them: the content-import core runs
          # every load as an account it has checked, and records it on every
          # row it writes. A blank value is refused here rather than by the
          # core, after the approval and the login.
          if [ -z "${SEED_ACCOUNT//[[:space:]]/}" ]; then
            echo "::error::seed_account_id is required for every dataset. For gym content use an organization_admin of the gym (ppbf@punxsyprominence.org), never the platform owner."
            exit 1
          fi
          # No fallback to the app's default-org secret: that fallback is how
          # the policy shelf came to sit under ppbf-default-org instead of the
          # gym (OD-2026-09-28-007; import-shadow-research.yml refuses it too).
          if [ -z "${ORGANIZATION_ID//[[:space:]]/}" ]; then
            echo "::error::organization_id is required. For gym content pass punxsy_prominence (OD-2026-09-28-007)."
            exit 1
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      # The committed files this dispatch would load, through the validator
      # every PR is held to (contentPackageContract.test.ts). Offline: no
      # database, no secrets. The seed job below does not start unless this
      # passes.
      - name: Validate Package
        working-directory: apps/web
        env:
          DATASET: ${{ inputs.dataset }}
        run: npm run --silent content:validate -- --dataset "$DATASET"

  seed:
    needs: validate
    # Same environment name as the target, so a protection rule on `production`
    # gates this exactly as it gates apply-migrations and deploy-production.
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      # RESOURCE_GROUP is deliberately NOT set here. The staging literal used
      # to sit at job level for BOTH targets, so a production dispatch looked
      # up app-ppbf-production inside the staging-named resource group. It is
      # resolved per target by the step below: staging keeps its literal, and
      # production requires secrets.AZURE_PRODUCTION_RESOURCE_GROUP with no
      # staging fallback, mirroring deploy-production.yml.
      CONTAINER_APP_NAME: ${{ inputs.target == 'production' && 'app-ppbf-production' || 'app-ppbf-staging' }}
      # The account the load runs as (contentImport/cli.ts readDatabaseEnv).
      # Deliberately NOT named after the {{SEED_ACCOUNT_ID}} placeholder in
      # the CSVs: that placeholder is the token in the seed text, not the
      # variable carrying the value.
      #
      # PPBF_SEED_ORG_ID is NOT set here; Resolve Owning Organization writes it
      # to $GITHUB_ENV, masked.
      PPBF_SEED_ACCOUNT_ID: ${{ inputs.seed_account_id }}
    steps:
      # A wrong-resource-group lookup that happens to resolve is worse than one
      # that refuses (deploy-production.yml records the same reasoning for its
      # own RESOURCE_GROUP), so an unset secret stops the run here -- before
      # the Azure login, and long before anything touches a database.
      - name: Resolve Target Resource Group
        env:
          TARGET: ${{ inputs.target }}
          PRODUCTION_RESOURCE_GROUP: ${{ secrets.AZURE_PRODUCTION_RESOURCE_GROUP }}
        run: |
          if [ "$TARGET" = "production" ]; then
            if [ -z "$PRODUCTION_RESOURCE_GROUP" ]; then
              echo "::error::secrets.AZURE_PRODUCTION_RESOURCE_GROUP is empty or unset. Refusing to fall back to the staging resource group for a production operation."
              exit 1
            fi
            echo "RESOURCE_GROUP=$PRODUCTION_RESOURCE_GROUP" >> "$GITHUB_ENV"
          else
            echo "RESOURCE_GROUP=rg-ppbf-enterprise-staging" >> "$GITHUB_ENV"
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      - name: Authenticate via Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Declared Database Target
        env:
          OVERRIDE_HOST: ${{ vars.PPBF_EXPECTED_POSTGRES_HOSTNAME }}
          OVERRIDE_DB: ${{ vars.PPBF_EXPECTED_POSTGRES_DATABASE }}
        run: |
          set -euo pipefail
          CONN="$(az containerapp secret show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-postgres-connection-string \
            --query value -o tsv)"
          test -n "$CONN"
          echo "::add-mask::$CONN"
          echo "AZURE_POSTGRES_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"

          DERIVED="$(CONN="$CONN" node -e '
            const u = new URL(process.env.CONN);
            const host = u.hostname.toLowerCase();
            const db = decodeURIComponent(u.pathname.replace(/^\/+/, ""));
            if (!host || !db) process.exit(2);
            process.stdout.write(host + "\n" + db);
          ')"
          HOST="$(printf '%s' "$DERIVED" | sed -n 1p)"
          DB="$(printf '%s' "$DERIVED" | sed -n 2p)"
          echo "PPBF_EXPECTED_POSTGRES_HOSTNAME=${OVERRIDE_HOST:-$HOST}" >> "$GITHUB_ENV"
          echo "PPBF_EXPECTED_POSTGRES_DATABASE=${OVERRIDE_DB:-$DB}" >> "$GITHUB_ENV"

      # The organization that will own every row: the operator's explicit
      # input, required and checked non-blank by the validate job. There is
      # no fallback to the app's default-org secret any more (see the validate
      # job).
      - name: Resolve Owning Organization
        env:
          SUPPLIED: ${{ inputs.organization_id }}
        run: |
          set -euo pipefail
          ORG="$(printf '%s' "$SUPPLIED" | tr -d '[:space:]')"
          test -n "$ORG"
          # Masked: the summary below must never carry it, and the CLI's own
          # lines that name it stay in the masked log.
          echo "::add-mask::$ORG"
          echo "PPBF_SEED_ORG_ID=$ORG" >> "$GITHUB_ENV"
          echo "ORG_SOURCE=operator input" >> "$GITHUB_ENV"
          echo "Owning organization resolved from operator input."

      # ONE step, ONE CLI call, ONE transaction -- for a single dataset and for
      # `all` alike. The CLI prints the plan (per dataset: new, new version,
      # unchanged, absent, reject) BEFORE it writes, then applies inside one
      # BEGIN .. COMMIT; with --dry-run it applies and ROLLS BACK. It asserts the
      # connection string names the declared target before connecting
      # (lib/postgres-write-target.mjs) and checks the seed account in the
      # database before reading anything else (contentImport/actor.ts).
      - name: Load Reference Data
        working-directory: apps/web
        env:
          DATASET: ${{ inputs.dataset }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          DRY_RUN=""
          if [ "$MODE" = "dry-run" ]; then
            DRY_RUN="--dry-run"
          fi
          npm run --silent content:apply -- $DRY_RUN --dataset "$DATASET" 2>&1 | tee "$RUNNER_TEMP/content-import.log"

      - name: Record What Ran
        # Always, so a refused or failed load still leaves its plan counts in
        # the summary -- that is precisely the run someone needs to read.
        if: always()
        env:
          TARGET: ${{ inputs.target }}
          DATASET: ${{ inputs.dataset }}
          MODE: ${{ inputs.mode }}
        run: |
          LOG="$RUNNER_TEMP/content-import.log"
          {
            echo "### Reference data seeding"
            echo ""
            echo "- target: \`$TARGET\`"
            echo "- dataset: \`$DATASET\`"
            echo "- mode: \`$MODE\`"
            # Never the value itself -- it is masked, and printing it here would
            # put it in a summary anyone with repo read access can see.
            echo "- owning organization: resolved from \`${ORG_SOURCE:-nothing (the run stopped first)}\`"
            echo ""
            if [ -f "$LOG" ]; then
              # Counts and verdicts only, never a free-text line: the plan's
              # header and a refusal's message can name the organization.
              echo "Plan, per dataset (new, new version, unchanged, absent, reject):"
              echo ""
              echo '```'
              grep -E '^  [a-z-]+: [0-9]+ new, [0-9]+ new version, [0-9]+ unchanged, [0-9]+ absent, [0-9]+ reject$' "$LOG" || echo "(no plan was printed)"
              grep -E '^(BLOCKING|WARNINGS): [0-9]+$' "$LOG" || true
              grep -oE '^RESULT: [A-Z ]+' "$LOG" || echo "RESULT: none (the load did not finish)"
              echo '```'
              echo ""
              if [ "$MODE" = "dry-run" ]; then
                echo "A dry run applies inside one transaction and rolls back. Nothing was written."
              else
                echo "Applied in one transaction, or not at all. Re-running with the same files writes nothing: unchanged items are skipped."
              fi
            else
              echo "The load step did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
