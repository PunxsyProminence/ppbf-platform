name: cleanup-audit-test-records

# Reports the audit test records left in a gym (pilot blocker B6), by explicit
# markers only: classes and TVs whose name starts 'ZZ-AUDIT' or 'AUDIT TEST'
# followed by a break, the Audit Test Gyms, "hiit fit", and every other marked
# text in the pilot schema. Jason ruled "2A", remove them (OD-2026-10-11-009
# item 2); App Overwatch's GO, QR and QS answers are on #2227.
#
# mode dry-run (the default) only reports; kinds, when given, are bound into
# its fingerprint. mode apply (B6-3) acts only on the plan that was reviewed: it
# needs kinds, confirm_delete set to the phrase, and expected_fingerprint set
# to the plan_fingerprint of a dry run of the same scope and the same kinds; the
# script locks the planned rows, recomputes the fingerprint and refuses on any
# difference, before its first write. Each apply needs Jason's
# word (the brief: production data). A production dispatch runs in the
# production environment, which holds it for that environment's approval, as
# RR-1's workflow does.
#
# The repository is public, so this log is too. The script prints no free text
# and no raw person id: person ids print as an HMAC under
# PPBF_AUDIT_TEST_CLEANUP_REF_KEY (an environment secret; with none set, a
# random key for that run alone). The key is never printed.
#
# Do not dispatch while a migration of the same target runs. The first read
# holds read locks, for the seconds it lasts, on the tables it reads directly
# and, with a test gym or "hiit fit" in scope, on every table with an
# organization_id. A migration that needs one of them waits; a lock held
# elsewhere for more than 10 seconds fails the run (code 55P03). This workflow
# has a concurrency group of its own, outside the release lock.
#
# WHERE IT RUNS: on a single-use runner inside Azure when the repository
# variable PPBF_AZURE_DB_RUNNER is 'true' and the run is from main (the `launch`
# job at the end of this file, session-token-cleanup.yml's pattern; lane DBT,
# OD-2026-11-17-008: GitHub places some ubuntu-latest jobs on AWS machines,
# which the database firewall does not admit). Otherwise on GitHub's runner,
# as before. The runner stops an hour after its container starts
# (azure-runner.conf, REPLICA_TIMEOUT_SECONDS): its boot, a production run's
# approval and the report must all fit in that hour. RE-RUN WITH "Re-run all jobs", never "Re-run failed
# jobs": `cleanup` alone would wait for this attempt's runner, which is gone.
#
# Run order and how to read the report: docs/AUDIT_TEST_RECORD_CLEANUP_RUNBOOK.md.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database environment
        required: true
        type: choice
        options:
          - staging
          - production
      confirm_target:
        description: Retype the target exactly
        required: true
        type: string
      organization:
        description: An organization_id, or ALL_ORGANIZATIONS for every organization
        required: true
        type: string
      mode:
        description: Report the records (dry run), or act on the reviewed plan
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      kinds:
        description: The kinds to act on (apply) or to bind into the dry run's fingerprint, comma separated (classes, tvs, test-organizations, hiit-fit)
        required: false
        type: string
      confirm_delete:
        description: For apply mode, type DELETE AUDIT TEST RECORDS exactly
        required: false
        type: string
      expected_fingerprint:
        description: For apply mode, the plan_fingerprint (sha256:...) printed by the dry run you reviewed
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cleanup-audit-test-records-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  cleanup:
    needs: launch
    environment: ${{ inputs.target }}
    runs-on: ${{ fromJSON(needs.launch.outputs.runs-on) }}
    timeout-minutes: 30
    env:
      # RESOURCE_GROUP is resolved per target by the step below, never set
      # here: production reads secrets.AZURE_PRODUCTION_RESOURCE_GROUP with no
      # staging fallback (see workflowResourceGroupContract.test.ts).
      CONTAINER_APP_NAME: ${{ inputs.target == 'production' && 'app-ppbf-production' || 'app-ppbf-staging' }}
    steps:
      # Free text reaches the shell through the environment, never by
      # interpolation: `${{ ... }}` in a `run:` block is substituted before
      # bash parses the line, so a value with a quote and a semicolon becomes
      # commands.
      - name: Confirm Explicit Target
        id: guard
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          ORGANIZATION: ${{ inputs.organization }}
          MODE: ${{ inputs.mode }}
          KINDS: ${{ inputs.kinds }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
        run: |
          set -euo pipefail
          if [ "$TARGET" != "$CONFIRM_TARGET" ]; then
            echo "::error::confirm_target does not match target."
            exit 1
          fi
          if [ -z "$ORGANIZATION" ] || [[ "$ORGANIZATION" == -* ]]; then
            echo "::error::organization must be an organization_id or ALL_ORGANIZATIONS."
            exit 1
          fi
          # A line break would let the rest of the value start a line of the
          # public log (npm echoes its arguments), where GitHub reads it as a
          # workflow command.
          if [[ "$ORGANIZATION$KINDS$CONFIRM_DELETE$EXPECTED_FINGERPRINT" =~ [[:cntrl:]] ]]; then
            echo "::error::organization, kinds, confirm_delete and expected_fingerprint must be one line, with no control characters."
            exit 1
          fi
          if [ -n "$KINDS" ] && [[ ! "$KINDS" =~ ^[a-z-]+(,[a-z-]+)*$ ]]; then
            echo "::error::kinds must be classes, tvs, test-organizations or hiit-fit, comma separated, no spaces."
            exit 1
          fi
          if [ "$MODE" = "dry-run" ]; then
            if [ -n "$CONFIRM_DELETE$EXPECTED_FINGERPRINT" ]; then
              echo "::error::confirm_delete and expected_fingerprint are for apply mode only."
              exit 1
            fi
          elif [ "$MODE" = "apply" ]; then
            if [ -z "$KINDS" ]; then
              echo "::error::apply mode needs kinds: exactly the kinds of the dry run you reviewed."
              exit 1
            fi
            if [ "$CONFIRM_DELETE" != "DELETE AUDIT TEST RECORDS" ]; then
              echo "::error::apply mode needs confirm_delete set to DELETE AUDIT TEST RECORDS exactly."
              exit 1
            fi
            if [[ ! "$EXPECTED_FINGERPRINT" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::apply mode needs expected_fingerprint set to the plan_fingerprint printed by the dry run you reviewed."
              exit 1
            fi
          else
            echo "::error::mode must be dry-run or apply."
            exit 1
          fi

      # A wrong-resource-group lookup that happens to resolve is worse than one
      # that refuses, so an unset secret stops the run here -- before the Azure
      # login, and long before anything touches a database.
      - name: Resolve Target Resource Group
        env:
          TARGET: ${{ inputs.target }}
          PRODUCTION_RESOURCE_GROUP: ${{ secrets.AZURE_PRODUCTION_RESOURCE_GROUP }}
        run: |
          if [ "$TARGET" = "production" ]; then
            if [ -z "$PRODUCTION_RESOURCE_GROUP" ]; then
              echo "::error::secrets.AZURE_PRODUCTION_RESOURCE_GROUP is empty or unset. Refusing to fall back to the staging resource group for a production operation."
              exit 1
            fi
            echo "RESOURCE_GROUP=$PRODUCTION_RESOURCE_GROUP" >> "$GITHUB_ENV"
          else
            echo "RESOURCE_GROUP=rg-ppbf-enterprise-staging" >> "$GITHUB_ENV"
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      - name: Authenticate via Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Declared Database Target
        env:
          OVERRIDE_HOST: ${{ vars.PPBF_EXPECTED_POSTGRES_HOSTNAME }}
          OVERRIDE_DB: ${{ vars.PPBF_EXPECTED_POSTGRES_DATABASE }}
        run: |
          set -euo pipefail
          CONN="$(az containerapp secret show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-postgres-connection-string \
            --query value -o tsv)"
          test -n "$CONN"
          echo "::add-mask::$CONN"
          echo "AZURE_POSTGRES_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"

          DERIVED="$(CONN="$CONN" node -e '
            const u = new URL(process.env.CONN);
            const host = u.hostname.toLowerCase();
            const db = decodeURIComponent(u.pathname.replace(/^\/+/, ""));
            if (!host || !db) process.exit(2);
            process.stdout.write(host + "\n" + db);
          ')"
          HOST="$(printf '%s' "$DERIVED" | sed -n 1p)"
          DB="$(printf '%s' "$DERIVED" | sed -n 2p)"
          echo "PPBF_EXPECTED_POSTGRES_HOSTNAME=${OVERRIDE_HOST:-$HOST}" >> "$GITHUB_ENV"
          echo "PPBF_EXPECTED_POSTGRES_DATABASE=${OVERRIDE_DB:-$DB}" >> "$GITHUB_ENV"

      - name: Check The Database Is Reachable From This Runner
        uses: ./.github/actions/db-preflight

      # A dry run opens only read-only transactions and rolls each back. An
      # apply happens only when PPBF_AUDIT_TEST_CLEANUP_APPLY is exactly 'true'
      # (mode apply), with the kinds, the phrase and the reviewed fingerprint;
      # the script checks each again itself. Its
      # target guard compares the connection with PPBF_EXPECTED_POSTGRES_*: the
      # environment's vars when they are set, otherwise the host and database
      # of the same connection string, so then the target is fixed only by
      # CONTAINER_APP_NAME and RESOURCE_GROUP above, as in RR-1's workflow.
      # The organization reaches the command as a quoted variable, never by
      # interpolation. The reference key reaches the script through the
      # environment only; no run block names it.
      - name: Run The Audit Test Record Cleanup
        working-directory: apps/web
        env:
          ORGANIZATION: ${{ inputs.organization }}
          KINDS: ${{ inputs.kinds }}
          PPBF_AUDIT_TEST_CLEANUP_APPLY: ${{ inputs.mode == 'apply' }}
          PPBF_AUDIT_TEST_CLEANUP_CONFIRM: ${{ inputs.confirm_delete }}
          PPBF_AUDIT_TEST_CLEANUP_EXPECT_FINGERPRINT: ${{ inputs.expected_fingerprint }}
          PPBF_AUDIT_TEST_CLEANUP_REF_KEY: ${{ secrets.PPBF_AUDIT_TEST_CLEANUP_REF_KEY }}
        # `shell: bash` for pipefail; GitHub's default `bash -e {0}` lacks it
        # and `tee` would discard a refused run's exit code (actions/runner,
        # ScriptHandlerHelpers.cs: bash is `--noprofile --norc -e -o pipefail`).
        shell: bash
        run: |
          if [ "$ORGANIZATION" = "ALL_ORGANIZATIONS" ]; then
            ARGS=(--all-organizations)
          else
            ARGS=(--organization "$ORGANIZATION")
          fi
          if [ -n "$KINDS" ]; then
            ARGS+=(--kinds "$KINDS")
          fi
          npm run pilot:cleanup-audit-test-records -- "${ARGS[@]}" 2>&1 | tee -a "$RUNNER_TEMP/tool-output.txt"

      # The summary carries the run's settings and the tool's one-line result
      # (fingerprint, key kind, counts; or what an apply wrote), never the plan itself: the plan is in
      # the log above. It runs only once the guard has passed, so a value the
      # guard refused never reaches the summary.
      - name: Record The Report
        if: always() && steps.guard.outcome == 'success'
        env:
          TARGET: ${{ inputs.target }}
          ORGANIZATION: ${{ inputs.organization }}
          MODE: ${{ inputs.mode }}
          KINDS: ${{ inputs.kinds }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RESULT="$(grep -m1 -E '"event":"audit_test_cleanup.(dry-run|applied|nothing-to-apply)"' "$RUNNER_TEMP/tool-output.txt" 2>/dev/null || true)"
          REFUSED="$(grep -m1 -E '"event":"audit_test_cleanup.(refused|failed)"' "$RUNNER_TEMP/tool-output.txt" 2>/dev/null || true)"
          {
            echo "### Audit test record cleanup ($MODE)"
            echo ''
            echo "- target: \`$TARGET\`"
            echo "- organization: \`$ORGANIZATION\`"
            echo "- kinds: \`${KINDS:-none}\`"
            echo "- expected fingerprint: \`${EXPECTED_FINGERPRINT:-none}\`"
            echo "- result: \`$JOB_STATUS\`"
            echo ''
            if [ -n "$RESULT" ]; then
              echo 'The tool'"'"'s result line (fingerprint and counts; for an apply, what it wrote):'
              echo ''
              echo '```json'
              printf '%s\n' "$RESULT"
              echo '```'
            elif [ -n "$REFUSED" ]; then
              echo 'The tool refused or failed:'
              echo ''
              echo '```json'
              printf '%s\n' "$REFUSED"
              echo '```'
            else
              echo 'No result line was captured; read the job log.'
            fi
            echo ''
            if [ "$MODE" = "apply" ]; then
              echo 'Apply mode: the applied, nothing-to-apply or refused line above says what was written, if anything.'
            else
              echo 'The full plan (classes, TVs, test gyms, "hiit fit", the sweep) is in the'
              echo 'job log. It prints ids, counts and keyed references, never a record'"'"'s text.'
              echo 'Dry run: nothing was written.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Where `cleanup` runs (lane DBT, OD-2026-11-17-008), as session-token-cleanup.yml
  # does it. `cleanup` waits for this job through `needs`; it sits below
  # `cleanup` so that the resource-group guard still comes before the file's
  # first Azure login (workflowResourceGroupContract.test.ts). With the
  # repository variable PPBF_AZURE_DB_RUNNER set to 'true' and a run from main:
  # a single-use runner inside Azure, which the database firewall always
  # admits. Otherwise GitHub's runner, exactly as before. Runs from other
  # branches stay on GitHub, because the Azure runner's guard refuses them.
  # This job declares no environment: it reaches only GitHub, Azure Resource
  # Manager and Key Vault, never the database, and its Azure login trusts main.
  # The runner's guard admits `cleanup` only once the runner image carries the
  # infra/gh-runner/allowed-jobs.txt line for it (a rebuild and a roll).
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      runs-on: ${{ steps.azure.outputs.runs-on || '"ubuntu-latest"' }}
    steps:
      # One addition to session-token-cleanup.yml's route: a dispatch whose
      # retyped target does not match starts no runner (cleanup's guard refuses
      # it first thing, on GitHub's runner), so no runner waits for nothing.
      - name: Choose The Runner
        id: route
        env:
          SWITCH: ${{ vars.PPBF_AZURE_DB_RUNNER }}
          TARGET: ${{ inputs.target }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: |
          if [ "${SWITCH,,}" = "true" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$TARGET" = "$CONFIRM_TARGET" ]; then
            echo "azure=true" >> "$GITHUB_OUTPUT"
            echo "cleanup runs on a single-use runner in Azure."
          else
            echo "azure=false" >> "$GITHUB_OUTPUT"
            echo "cleanup runs on GitHub's runner (PPBF_AZURE_DB_RUNNER is not 'true', this run is not from main, or confirm_target does not match)."
          fi

      - name: Checkout Source Code
        if: steps.route.outputs.azure == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate via Azure OIDC
        if: steps.route.outputs.azure == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Launch A Runner In Azure
        id: azure
        if: steps.route.outputs.azure == 'true'
        uses: ./.github/actions/azure-runner-launch
        with:
          app-id: ${{ vars.PPBF_RUNNER_APP_ID }}
          installation-id: ${{ vars.PPBF_RUNNER_INSTALLATION_ID }}

      # Fail closed: a launch that reported success but named no runner must
      # not quietly send `cleanup` to GitHub's runner.
      - name: Check A Runner Was Named
        if: steps.route.outputs.azure == 'true'
        env:
          RUNS_ON: ${{ steps.azure.outputs.runs-on }}
        run: test -n "$RUNS_ON"
