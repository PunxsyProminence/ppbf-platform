# ─────────────────────────────────────────────────────────────────────────
# Read-only database diagnostics -- manual only.
#
# This is deliberately a SEPARATE workflow from apply-migrations.yml rather
# than another entry in that workflow's `migration:` dropdown. That workflow's
# whole design is about a schema mutation an operator then attests as
# `migrations_complete` -- its confirm-retype step, its job-summary language
# ("Safe to attest migrations_complete"), and its concurrency group all assume
# the run changes the database. A read-only check sharing that dropdown would
# either inherit warnings that do not apply to it or need every one of those
# steps special-cased to not lie about what just happened. Keeping this
# separate means anything added here is legible by construction: nothing in
# this file can mutate a row, so nothing here needs the ceremony that exists
# to make a mutation safe.
#
# Uses the same Azure OIDC identity and Container App secret lookup as
# apply-migrations.yml -- no new credential is introduced.
#
# CURRENT CHECKS
#   multiorg-orphans: whether any of the eight tables the multi-org
#   migration's foreign keys target hold an organization_id that does not
#   resolve to a real pilot.organizations row. Added because that migration's
#   FK-adding statements were never valid PostgreSQL (see #52/#53) and so have
#   never actually run against a real database -- meaning this is genuinely
#   unknown for any environment that predates the base schema inlining these
#   FKs, and finding out is a precondition for running the corrected migration
#   without it failing partway through.
#
#   orphan-chat-audit: whether pilot.athlete_chat_audit, board_chat_audit,
#   coach_chat_audit or individual_chat_audit exist -- four tables the 07-31
#   audit and the shared work queue both asserted were "in production with no
#   DDL anywhere", left behind by the DDL-over-HTTP route removed in #111.
#   Checked against production on 08-02 and all four are ABSENT, in pilot and
#   in every other schema; the only %chat_audit% table there is SHADOW's own
#   live pilot.shadow_chat_audit. So the claim was false for that database.
#   STAGING HAS NEVER BEEN CHECKED, and if it holds them that is a genuinely
#   different finding -- which is the reason this belongs here rather than
#   staying a command someone runs from a laptop pointed at production.
#
#   stranded-guardians: which non-athlete accounts sit on auth_provider
#   'ppbf_local' and therefore have no working login path (PIN login is
#   athlete-only, Microsoft login only matches provider 'microsoft', and any
#   session is revoked on first use). The pre-#46 intake path provisioned
#   every guardian this way; #46 fixed provisioning going forward but changed
#   no existing rows, so this reports the accounts still affected. Emails are
#   masked in the output; account_ids print verbatim as the remediation key.
# ─────────────────────────────────────────────────────────────────────────

name: check-database

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which environment's database to check
        required: true
        type: choice
        options:
          - staging
          - production
      check:
        description: Which read-only check to run
        required: true
        default: multiorg-orphans
        type: choice
        options:
          - multiorg-orphans
          - stranded-guardians
          - duplicate-guardians
          - orphan-chat-audit
          - seed-identity
          - library-scope
          - deletion-preflight

permissions:
  id-token: write
  contents: read

jobs:
  check:
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # RESOURCE_GROUP is deliberately NOT set here. The staging literal used
      # to sit at job level for BOTH targets, so a production dispatch looked
      # up app-ppbf-production inside the staging-named resource group. This
      # workflow is read-only, but the connection string it resolves is real:
      # it is resolved per target by the step below, and production requires
      # secrets.AZURE_PRODUCTION_RESOURCE_GROUP with no staging fallback,
      # mirroring deploy-production.yml.
      CONTAINER_APP_NAME: ${{ inputs.target == 'production' && 'app-ppbf-production' || 'app-ppbf-staging' }}

    steps:
      # A wrong-resource-group lookup that happens to resolve is worse than one
      # that refuses (deploy-production.yml records the same reasoning for its
      # own RESOURCE_GROUP), so an unset secret stops the run here -- before
      # the Azure login.
      - name: Resolve Target Resource Group
        env:
          TARGET: ${{ inputs.target }}
          PRODUCTION_RESOURCE_GROUP: ${{ secrets.AZURE_PRODUCTION_RESOURCE_GROUP }}
        run: |
          if [ "$TARGET" = "production" ]; then
            if [ -z "$PRODUCTION_RESOURCE_GROUP" ]; then
              echo "::error::secrets.AZURE_PRODUCTION_RESOURCE_GROUP is empty or unset. Refusing to fall back to the staging resource group for a production operation."
              exit 1
            fi
            echo "RESOURCE_GROUP=$PRODUCTION_RESOURCE_GROUP" >> "$GITHUB_ENV"
          else
            echo "RESOURCE_GROUP=rg-ppbf-enterprise-staging" >> "$GITHUB_ENV"
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      - name: Authenticate via Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Masked before it is written anywhere. It is scoped to this job, and the
      # job does nothing after the check step.
      - name: Resolve Database Connection
        run: |
          CONN="$(az containerapp secret show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-postgres-connection-string \
            --query value -o tsv)"
          test -n "$CONN"
          echo "::add-mask::$CONN"
          echo "AZURE_POSTGRES_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"

      - name: Run Check
        id: run_check
        env:
          CHECK: ${{ inputs.check }}
        run: |
          set -euo pipefail
          cd apps/web

          case "$CHECK" in
            multiorg-orphans)
              npm run pilot:check-multiorg-orphans | tee /tmp/check-output.txt
              ;;
            stranded-guardians)
              npm run pilot:check-stranded-guardians | tee /tmp/check-output.txt
              ;;
            duplicate-guardians)
              # Read-only. Finds guardians split across two pilot.parents rows -- the shape the
              # invite path used to create against a row the roster import had already written, which
              # left a family's other children unreachable with no error anywhere. Fails only when a
              # child is actually hidden; a split that hides nobody prints but passes.
              npm run pilot:check-duplicate-guardians | tee /tmp/check-output.txt
              ;;
            orphan-chat-audit)
              npm run pilot:check-orphan-chat-audit | tee /tmp/check-output.txt
              ;;
            library-scope)
              # Read-only. Answers where the SHADOW research corpus lives and how
              # much of it clears the retrieval gate -- the question the refused
              # staging baseline import raised, where a corpus source id already
              # existed under a gym organization.
              npm run pilot:check-library-scope | tee /tmp/check-output.txt
              ;;
            deletion-preflight)
              # Read-only. Answers whether anybody has ever actually been deleted, and
              # whether any deleted record still has access open -- the footprint the two
              # bugs fixed in #690 and #709 would leave behind. Counts and timestamps only;
              # no account ids, athlete ids, names or emails. Exits non-zero only when a
              # deleted record still has access, never merely because deletions exist.
              npm run pilot:check-deletion-preflight | tee /tmp/check-output.txt
              ;;
            seed-identity)
              # Read-only. Prints the organization ids and the PRIVILEGED account ids that the
              # seeding workflows ask an operator to type, so nobody has to read them out of a
              # production SQL client by eye. Athlete and parent accounts are never selected.
              npm run pilot:check-seed-identity | tee /tmp/check-output.txt
              ;;
            *)
              echo "::error::Unknown check '$CHECK'"
              exit 1
              ;;
          esac

      - name: Record Result
        if: always()
        env:
          CHECK: ${{ inputs.check }}
          TARGET: ${{ inputs.target }}
        run: |
          {
            echo ''
            echo "### Read-only check result"
            echo ''
            echo "- target: \`$TARGET\`"
            echo "- check: \`$CHECK\`"
            echo "- outcome: \`${{ job.status }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo ''
            echo '```'
            # `-s`: the file is created by the redirect before the tool
            # writes, so `cat` on an empty one exits 0 and skips the fallback.
            [ -s /tmp/check-output.txt ] && cat /tmp/check-output.txt || echo '(no output captured)'
            echo '```'
            echo ''
            echo 'This workflow only ran SELECT statements. Nothing in the target database was changed.'
          } >> "$GITHUB_STEP_SUMMARY"
