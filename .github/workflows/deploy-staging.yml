name: deploy-staging

on:
  workflow_dispatch:
    inputs:
      enable_shadow_gate:
        description: Run the SHADOW E2E gate after deploy
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
      ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io
      RESOURCE_GROUP: rg-ppbf-enterprise-staging
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate via Azure OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"

      - name: Load Azure Container Registry deploy credentials
        id: acr-credentials
        run: |
          ACR_USERNAME="$(az acr credential show --name "$ACR_NAME" --query username -o tsv)"
          ACR_PASSWORD="$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' -o tsv)"
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"
          echo "::add-mask::$ACR_USERNAME"
          echo "::add-mask::$ACR_PASSWORD"
          echo "username=$ACR_USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$ACR_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Build and Push Container Image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/ppbf-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ env.ACR_NAME }}
          acrUsername: ${{ steps.acr-credentials.outputs.username }}
          acrPassword: ${{ steps.acr-credentials.outputs.password }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: app-ppbf-staging
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/ppbf-frontend:${{ github.sha }}
          environmentVariables: >-
            PPBF_ONBOARDING_LIVE_SAVE=false
            PPBF_AUTH_PROVIDER_WIRED=false
            AZURE_POSTGRES_CONNECTION_STRING=secretref:azure-postgres-connection-string
            AZURE_STORAGE_CONNECTION_STRING=secretref:azure-storage-connection-string
            PPBF_PILOT_BOOTSTRAP_KEY=secretref:ppbf-pilot-bootstrap-key
            PPBF_PILOT_DEFAULT_ORG_ID=secretref:ppbf-pilot-default-org-id
            PPBF_PILOT_SHADOW_CONTAINER=secretref:ppbf-pilot-shadow-container

      - name: Resolve Staging API Base URL
        run: |
          FQDN="$(az containerapp show --name app-ppbf-staging --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          test -n "$FQDN"
          echo "PILOT_GATE_BASE_URL=https://$FQDN" >> "$GITHUB_ENV"

      - name: Install Web Dependencies For Gate
        run: |
          npm ci

      - name: Run SHADOW E2E Gate
        if: inputs.enable_shadow_gate
        env:
          # Sourced from a repository/environment secret, never a manual
          # workflow_dispatch text input -- dispatch inputs are visible in
          # the Actions run's trigger metadata to anyone with read access to
          # the repo, regardless of log masking.
          PPBF_PILOT_BOOTSTRAP_KEY: ${{ secrets.PPBF_PILOT_BOOTSTRAP_KEY }}
          PILOT_ADMIN_ACCOUNT_ID: org_admin_shadow
        run: |
          npm --prefix apps/web run gate:pilot:shadow-e2e
