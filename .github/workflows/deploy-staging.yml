name: deploy-staging

on:
  workflow_dispatch: # Forces manual trigger gate only

permissions:
  id-token: write    # Required for passwordless OIDC authentication
  contents: read     # Required to checkout the monorepo source code

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate via Azure OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name acrppbfstaging

      - name: Build and Push Container Image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: acrppbfstaging.azurecr.io/ppbf-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: acrppbfstaging
          resourceGroup: rg-ppbf-staging
          containerAppName: app-ppbf-staging
          imageToDeploy: acrppbfstaging.azurecr.io/ppbf-frontend:${{ github.sha }}
          environmentVariables: |
            PPBF_ONBOARDING_LIVE_SAVE=false
            PPBF_AUTH_PROVIDER_WIRED=false


