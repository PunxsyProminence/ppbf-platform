name: deploy-staging

on:
  workflow_dispatch: # Forces manual trigger gate only

permissions:
  id-token: write    # Required for passwordless OIDC authentication
  contents: read     # Required to checkout the monorepo source code

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate via Azure OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push Container Image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_CONTAINER_REGISTRY }} \
            --image ppbf-frontend:${{ github.sha }} \
            --file Dockerfile \
            .

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          resourceGroup: rg-ppbf-staging
          containerAppName: app-ppbf-staging
          imageToDeploy: ${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io/ppbf-frontend:${{ github.sha }}
          environmentVariables: |
            PPBF_ONBOARDING_LIVE_SAVE=false
            PPBF_AUTH_PROVIDER_WIRED=false


