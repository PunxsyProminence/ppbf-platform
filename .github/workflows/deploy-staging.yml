name: deploy-staging

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact tested commit SHA to deploy
        required: true
        type: string
      schema_migrations_complete:
        description: Confirm the required additive staging migrations succeeded
        required: true
        default: NOT_CONFIRMED
        type: choice
        options:
          - NOT_CONFIRMED
          - CONFIRMED
      enable_shadow_gate:
        description: Run the SHADOW E2E gate after deploy
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  # A CONSTANT, deliberately -- the OPPOSITE of the #736 / #739 fix, and for the
  # opposite reason. Those workflows moved to github.sha because GitHub holds at
  # most one PENDING run per group, so a third arrival evicts the queued second,
  # and `cancel-in-progress: false` does not prevent it -- it governs in-flight
  # runs, not the queue. There the evicted run WAS the required check, and 16 of
  # 30 pushes to main lost theirs.
  #
  # Here concurrency IS the safety property and eviction is the cheap outcome.
  # One job pushes ppbf-frontend to one ACR, repoints one Container App
  # (app-ppbf-staging), and -- when enable_shadow_gate is true -- mints an
  # ephemeral PIN for the single shared fixture account gate_shadow_athlete
  # (athlete GATE-SHADOW-ATH-1) in the staging database, then clears it from an
  # always() step. Two concurrent runs interleave all three: run B's provisioner
  # overwrites run A's PIN hash, so A's gate fails to authenticate against a
  # credential that was correct when it was minted; and whichever run reaches the
  # always() teardown first deactivates the account underneath the other. The
  # dangerous ordering is A tearing down before B's gate finishes, B
  # re-provisioning, and B's working 6-digit PIN being left live on what this
  # file's own annotation calls a publicly reachable staging login.
  #
  # That annotation cannot catch it: it keys on the deactivation step FAILING,
  # and in this race both deactivations succeed -- just against the wrong run's
  # state.
  #
  # The contended resources are named by literals, so no per-run key can make
  # this safe. An evicted PENDING run costs nothing: it never started a step, so
  # it holds no fixture, minted no PIN, pushed no image, left no residue. This
  # workflow is dispatch-only, so a human sees the cancellation and dispatches
  # again.
  #
  # cancel-in-progress stays false and is load-bearing: cancelling a RUNNING gate
  # is the one case the always() teardown may not survive.
  group: deploy-staging-app-ppbf-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment: staging
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
      ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io
      RESOURCE_GROUP: rg-ppbf-enterprise-staging
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Verify Exact Tested SHA And Schema Gate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SCHEMA_MIGRATIONS_COMPLETE: ${{ inputs.schema_migrations_complete }}
        run: |
          # Both checks below used to be bare `test`, so a failure produced
          # nothing but "exit code 1" and the operator had to read the step's
          # env block to learn which one tripped. Run 30668081838 lost real
          # time to exactly that: it was a RE-RUN, and GitHub does not
          # re-supply workflow_dispatch inputs on a re-run, so expected_sha
          # arrived empty and the gate refused a commit that was in fact
          # correct. The refusal was right; the silence was not.
          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ -z "$EXPECTED_SHA" ]; then
            echo "expected_sha was empty."
            echo "Re-running a previous run does NOT re-supply workflow_dispatch inputs."
            echo "Dispatch a fresh run instead, with expected_sha=$ACTUAL_SHA"
            exit 1
          fi

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refusing to deploy a commit other than the one you named."
            echo "  checked out: $ACTUAL_SHA"
            echo "  expected:    $EXPECTED_SHA"
            echo "Pass the FULL 40-character SHA -- an abbreviated one never matches."
            exit 1
          fi

          if [ "$SCHEMA_MIGRATIONS_COMPLETE" != "CONFIRMED" ]; then
            echo "schema_migrations_complete is '$SCHEMA_MIGRATIONS_COMPLETE', not CONFIRMED."
            echo "Apply this commit's migrations first (apply-migrations, target=staging),"
            echo "then dispatch again and attest CONFIRMED."
            exit 1
          fi

      - name: Authenticate via Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Checks the schema_migrations_complete attestation rather than trusting
      # it. See the equivalent step in deploy-production.yml for why: the
      # attestation is the one gate nothing verifies, and it has been given
      # ahead of the migration more than once. Read-only.
      - name: Set up Node For The Schema Check
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      - name: Verify Staging Schema Matches This Commit
        run: |
          CONN="$(az containerapp secret show \
            --name app-ppbf-staging \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-postgres-connection-string \
            --query value -o tsv)"
          test -n "$CONN"
          echo "::add-mask::$CONN"
          if ! AZURE_POSTGRES_CONNECTION_STRING="$CONN" node apps/web/scripts/pilot-verify-schema.mjs; then
            echo "::error::Staging is missing schema objects this commit expects. Run apply-migrations against staging first."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build and Push Container Image to ACR
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/ppbf-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture Staging Image Digest
        run: |
          DIGEST='${{ steps.build-image.outputs.digest }}'
          test -n "$DIGEST"
          printf '%s\n' "$DIGEST" > staging-image-digest.txt
          {
            echo '### Staging image digest'
            echo ''
            echo "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Staging Digest Artifact
        uses: actions/upload-artifact@v7
        with:
          name: staging-image-digest
          path: staging-image-digest.txt

      - name: Validate Staging AI Configuration
        env:
          AZURE_AI_ENDPOINT: ${{ vars.AZURE_AI_ENDPOINT }}
          AZURE_AI_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_DEPLOYMENT_NAME }}
          AZURE_AI_API_VERSION: ${{ vars.AZURE_AI_API_VERSION }}
        run: |
          test -n "$AZURE_AI_ENDPOINT"
          # Quick Round resolves its deployment from this variable, not from the
          # MODEL_REGISTRY in shadowRouter.ts. Both generations are accepted so the
          # variable can be rolled back to the previous model without editing this
          # workflow -- but an unrecognized value is still refused, because a typo
          # here silently sends every SHADOW turn to a deployment that does not exist.
          case "$AZURE_AI_DEPLOYMENT_NAME" in
            gpt-5.6-luna-shadow|gpt-5-mini-shadow) ;;
            *) echo "AZURE_AI_DEPLOYMENT_NAME '$AZURE_AI_DEPLOYMENT_NAME' is not a known SHADOW quick-tier deployment."; exit 1 ;;
          esac
          if [ "$AZURE_AI_API_VERSION" != "2024-12-01-preview" ]; then
            echo "AZURE_AI_API_VERSION is '$AZURE_AI_API_VERSION', expected '2024-12-01-preview'."
            exit 1
          fi
          case "$AZURE_AI_ENDPOINT" in
            https://shadow-ai.cognitiveservices.azure.com|https://shadow-ai.cognitiveservices.azure.com/) ;;
            *) echo "AZURE_AI_ENDPOINT '$AZURE_AI_ENDPOINT' is not the approved SHADOW endpoint."; exit 1 ;;
          esac

      # PPBF_SHADOW_MAX_COMPLETION_TOKENS was 1024, which is below what a reasoning
      # deployment spends on reasoning alone -- Azure counts reasoning against this
      # budget, and at 1024 it returned finish_reason "length" with reasoning_tokens
      # 1024 and NO content, so every SHADOW turn in staging degraded. It is now
      # 8192, the ceiling in the chat route: the quick tier measured 4110 completion
      # tokens on a representative prompt, so 4096 was close enough to truncate a
      # long answer. Both this and the timeout stay set explicitly rather than
      # deferring to the code default, because --set-env-vars cannot unset a stale
      # value already on the app.
      #
      # PPBF_SHADOW_PROVIDER_TIMEOUT_MS replaces a hardcoded 15s that no deployment
      # could meet -- the quick tier measured 33.3s (gpt-5.6-luna) and 58.0s
      # (gpt-5-mini), so every turn hit the timeout and returned the degraded
      # response. See shadowRouter.ts for the full latency table.
      # PPBF_SHADOW_WORKER_ENABLED starts the in-process SHADOW job worker
      # (instrumentation.ts): scout reports, board summaries, and opt-in
      # background Heavy Bag. Default OFF in code; enabled HERE FIRST so the
      # E2E gate and manual staging use exercise the drain loop before
      # production ever runs it.
      #
      # That staging-first condition has since been MET: run 30567888858
      # (2026-07-30) drove a full enqueue -> drain -> render cycle, and
      # production carries the flag with that evidence written beside it. For
      # what production runs today, read deploy-production.yml -- it is the
      # authority for its own values, and this file no longer keeps a copy.
      #
      # AZURE_AI_EMBEDDING_DEPLOYMENT_NAME names the embedding deployment for
      # semantic Library search (#102). Staging first, like every flag. The
      # value is a deployment NAME, not a secret (the hygiene test permits
      # *_NAME literals), and the owner creates the deployment with exactly
      # this name; until it exists, embedText fails closed and search stays
      # on the keyword path by design, so this line is safe to ship ahead of
      # the deployment.
      #
      # Production now sets this too. Unlike the worker, the content gate and
      # intake promotion, NEITHER workflow records evidence that the stated
      # condition -- "staging has proven semantic results through real use" --
      # was met before it was promoted. That is a gap in the record, not a
      # claim that the promotion was wrong, and it is left as a finding rather
      # than filled in with a reason nobody wrote down.
      #
      # PPBF_INTAKE_PROMOTION_ENABLED lets an approved intake case be promoted
      # to real athlete/guardian/domain records (review-action 'promote').
      # Default OFF in code. Enabled HERE FIRST, same rollout as the worker:
      # with the document security review built, the gate now drives
      # review -> approve -> promote end to end and needs the promotion arm
      # live in staging.
      #
      # That condition has since been MET and production carries the flag:
      # staging run 30820241108 (2026-08-03) walked the whole intake path
      # green, and it was turned on at the owner's explicit instruction the
      # same day. deploy-production.yml records that evidence and the
      # authorization limits promotion still enforces; read it there.
      #
      # AZURE_AI_VISION_DEPLOYMENT_NAME names the vision deployment for Film
      # Study (#103); owner-verified to exist on the shadow-ai resource
      # 2026-07-30. Setting it here powers the measurement diagnostic below,
      # and film_study jobs remain SHADOW_JOB_TYPE_UNAVAILABLE until the
      # executor ships on measured numbers. A deployment NAME, not a secret,
      # like the embedding line above.
      #
      # It is no longer staging-only: production sets it as well, because the
      # video content gate cannot run without a vision deployment. Those two
      # lines move together -- deploy-production.yml states that dependency
      # explicitly and is the authority for production's values.
      #
      # PPBF_FILM_STUDY_DIAGNOSTIC_ENABLED exposes the admin-only measurement
      # probe (synthesize test clip -> extract frames -> one timed vision
      # call) that gate step 15 records. It is #103's required
      # measured-facts source: in-container ffmpeg timing and real vision
      # latency/token spend. Staging only; production leaves it unset until
      # Film Study is a real feature.
      #
      # PPBF_VIDEO_CONTENT_SCAN turns on the video scan sweep's content gate
      # (#49) -- the thing that can finally move an upload off 'quarantined'.
      # Until this exists, uploaded videos are stranded: every reader requires
      # status 'ready' and nothing in the platform ever wrote it. Staging
      # first, like every flag.
      #
      # That condition has since been MET and production carries the gate:
      # staging promoted a real 17.3MB upload off 'quarantined' after deploy
      # run 30679936999, and it was enabled at the owner's explicit
      # instruction (2026-08-01) on the stated basis that no athlete footage
      # existed in production yet. deploy-production.yml holds that reasoning
      # and is the authority for what production runs.
      #
      # PPBF_VIDEO_MALWARE_SCAN is deliberately NOT set, here or in
      # production. It reads a verdict Microsoft Defender for Storage writes
      # onto the blob as an index tag; whether malware scanning is enabled on
      # the storage account is an Azure setting this repository cannot see or
      # turn on. Enabling the gate without the scanner behind it would leave
      # every upload retrying until it timed out into human review -- worse
      # than not enabling it, and it would put "malware scanned" in
      # scan_detail for videos nothing scanned. Set it to
      # defender_index_tags only after confirming Defender for Storage
      # malware scanning is on for the account behind
      # AZURE_STORAGE_CONNECTION_STRING.
      - name: Deploy to Azure Container App
        env:
          AZURE_AI_ENDPOINT: ${{ vars.AZURE_AI_ENDPOINT }}
          AZURE_AI_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_DEPLOYMENT_NAME }}
          AZURE_AI_API_VERSION: ${{ vars.AZURE_AI_API_VERSION }}
          RESEARCH_BRIDGE_EXPORT_AUDIENCE: ${{ vars.RESEARCH_BRIDGE_EXPORT_AUDIENCE }}
          RESEARCH_BRIDGE_EXPORT_ALLOWED_CLIENT_IDS: ${{ vars.RESEARCH_BRIDGE_EXPORT_ALLOWED_CLIENT_IDS }}
          RESEARCH_BRIDGE_EXPORT_ALLOWED_HOST: ${{ vars.RESEARCH_BRIDGE_EXPORT_ALLOWED_HOST }}
          # The origin magic-link sign-in emails are built against. Not a
          # secret -- it is the public address of this environment -- so it
          # is a var, checked below like the research bridge values.
          #
          # It is checked at DEPLOY time because it cannot be noticed at run
          # time. magicLinkStore.ts throws MISSING_PPBF_APP_ORIGIN, and the
          # request route swallows every issue failure on purpose so the
          # endpoint cannot be used to test whether an address belongs to a
          # family here. That silence is right for the roster, and it means
          # an unset origin looks exactly like a link that was sent: the
          # parent is told one is on the way and none ever arrives.
          PPBF_APP_ORIGIN: ${{ vars.PPBF_APP_ORIGIN }}
        run: |
          for name in RESEARCH_BRIDGE_EXPORT_AUDIENCE RESEARCH_BRIDGE_EXPORT_ALLOWED_CLIENT_IDS RESEARCH_BRIDGE_EXPORT_ALLOWED_HOST PPBF_APP_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "Required staging research bridge variable '$name' is not configured."
              exit 1
            fi
          done

          az containerapp update \
            --name app-ppbf-staging \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_LOGIN_SERVER}/ppbf-frontend@${{ steps.build-image.outputs.digest }}" \
            --set-env-vars \
              AZURE_POSTGRES_CONNECTION_STRING=secretref:azure-postgres-connection-string \
              AZURE_STORAGE_CONNECTION_STRING=secretref:azure-storage-connection-string \
              PPBF_MS_TENANT_ID=secretref:ppbf-ms-tenant-id \
              PPBF_MS_CLIENT_ID=secretref:ppbf-ms-client-id \
              PPBF_MS_CLIENT_SECRET=secretref:ppbf-ms-client-secret \
              PPBF_MS_REDIRECT_URI=secretref:ppbf-ms-redirect-uri \
              PPBF_MS_POST_LOGIN_PATH=secretref:ppbf-ms-post-login-path \
              PPBF_APP_ORIGIN="$PPBF_APP_ORIGIN" \
              AZURE_AI_ENDPOINT="$AZURE_AI_ENDPOINT" \
              AZURE_AI_DEPLOYMENT_NAME="$AZURE_AI_DEPLOYMENT_NAME" \
              AZURE_AI_API_VERSION="$AZURE_AI_API_VERSION" \
              AZURE_AI_KEY=secretref:azure-ai-key \
              PPBF_SHADOW_MAX_COMPLETION_TOKENS=8192 \
              PPBF_SHADOW_PROVIDER_TIMEOUT_MS=120000 \
              PPBF_SHADOW_WORKER_ENABLED=true \
              PPBF_INTAKE_PROMOTION_ENABLED=true \
              AZURE_AI_EMBEDDING_DEPLOYMENT_NAME=text-embedding-3-small \
              AZURE_AI_VISION_DEPLOYMENT_NAME=gpt-5-vision-shadow \
              PPBF_FILM_STUDY_DIAGNOSTIC_ENABLED=true \
              PPBF_VIDEO_CONTENT_SCAN=vision \
              PPBF_PILOT_BOOTSTRAP_KEY=secretref:ppbf-pilot-bootstrap-key \
              PPBF_PILOT_DEFAULT_ORG_ID=secretref:ppbf-pilot-default-org-id \
              PPBF_PILOT_SHADOW_CONTAINER=secretref:ppbf-pilot-shadow-container \
              PPBF_DURABLE_RATE_LIMIT=true \
              RESEARCH_BRIDGE_EXPORT_ENABLED=true \
              RESEARCH_BRIDGE_EXPORT_ENVIRONMENT=staging \
              RESEARCH_BRIDGE_EXPORT_ALLOWED_HOST="$RESEARCH_BRIDGE_EXPORT_ALLOWED_HOST" \
              RESEARCH_BRIDGE_EXPORT_AUDIENCE="$RESEARCH_BRIDGE_EXPORT_AUDIENCE" \
              RESEARCH_BRIDGE_EXPORT_ALLOWED_CLIENT_IDS="$RESEARCH_BRIDGE_EXPORT_ALLOWED_CLIENT_IDS" \
              RESEARCH_BRIDGE_ORGANIZATION_ID=secretref:ppbf-pilot-default-org-id \
              AZURE_TENANT_ID=secretref:ppbf-ms-tenant-id

      - name: Verify Staging AI Secret Reference
        run: |
          AI_KEY_REF="$(az containerapp show \
            --name app-ppbf-staging \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='AZURE_AI_KEY'].secretRef | [0]" \
            -o tsv)"
          if [ "$AI_KEY_REF" != "azure-ai-key" ]; then
            echo "AZURE_AI_KEY resolved to secretRef '$AI_KEY_REF', expected 'azure-ai-key'."
            echo "The deployed revision would read the wrong secret, so this run stops here."
            exit 1
          fi

      # `az containerapp update` returns when the new revision is CREATED, not
      # when it is serving. Run 30503641552 chatted with the app ~60s after the
      # update and reached the PREVIOUS revision -- the gate failed on behavior
      # the new image had already fixed. Everything after this step assumes it
      # is talking to the revision this run just deployed, so wait until the
      # latest revision is Running and holds 100% of traffic.
      - name: Wait For New Revision To Take Traffic
        run: |
          LATEST="$(az containerapp show --name app-ppbf-staging \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.latestRevisionName -o tsv)"
          echo "Waiting on revision $LATEST"
          for i in $(seq 1 60); do
            READ="$(az containerapp revision show --name app-ppbf-staging \
              --resource-group "$RESOURCE_GROUP" --revision "$LATEST" \
              --query "[properties.runningState, properties.trafficWeight]" -o tsv | tr '\n' ' ')"
            echo "  $i: $READ"
            case "$READ" in
              "Running 100"*) exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::Revision $LATEST did not reach Running/100% traffic within 5 minutes."
          exit 1

      - name: Resolve Staging API Base URL
        run: |
          FQDN="$(az containerapp show --name app-ppbf-staging --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          test -n "$FQDN"
          echo "PILOT_GATE_BASE_URL=https://$FQDN" >> "$GITHUB_ENV"

      - name: Install Web Dependencies For Gate
        run: |
          npm ci

      # The gate authenticates its administrator and guardian fixtures by
      # writing a short-lived row to pilot.session_tokens, because a PIN login
      # cannot produce a session for either role (PIN sessions are athlete-only)
      # and the bootstrap endpoint that used to create those accounts now
      # refuses every request. Reading this secret is not an escalation: this
      # job already holds the Azure rights that deploy the application.
      #
      # Resolved into the step's own env rather than GITHUB_ENV so the value is
      # scoped to the gate step instead of every step that follows it.
      - name: Resolve Staging Database Connection For Gate
        if: inputs.enable_shadow_gate
        run: |
          CONN="$(az containerapp secret show \
            --name app-ppbf-staging \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-postgres-connection-string \
            --query value -o tsv)"
          test -n "$CONN"
          echo "::add-mask::$CONN"
          echo "GATE_DB_CONNECTION=$CONN" >> "$GITHUB_ENV"

          # The fixture provisioner refuses to write to a database nobody named
          # (see apps/web/scripts/lib/postgres-write-target.mjs). Derive the
          # expected target from the string we just fetched from the
          # staging-NAMED app, so the assertion is a consistency check on a
          # target that is already pinned to staging by the lookup above --
          # this workflow reads app-ppbf-staging literally, never inputs.target.
          DERIVED="$(CONN="$CONN" node -e '
            const u = new URL(process.env.CONN);
            const host = u.hostname.toLowerCase();
            const db = decodeURIComponent(u.pathname.replace(/^\/+/, ""));
            if (!host || !db) { process.exit(2); }
            process.stdout.write(host + "\n" + db);
          ')"
          GATE_HOST="$(printf '%s' "$DERIVED" | sed -n 1p)"
          GATE_DB="$(printf '%s' "$DERIVED" | sed -n 2p)"
          test -n "$GATE_HOST"
          test -n "$GATE_DB"
          echo "GATE_EXPECTED_POSTGRES_HOSTNAME=$GATE_HOST" >> "$GITHUB_ENV"
          echo "GATE_EXPECTED_POSTGRES_DATABASE=$GATE_DB" >> "$GITHUB_ENV"

      # The org id lives in the app's secret store (it is what the app itself
      # runs with), so the gate tests against the same organization the app
      # serves rather than a workflow-hardcoded guess.
      - name: Resolve Staging Default Organization For Gate
        if: inputs.enable_shadow_gate
        run: |
          ORG_ID="$(az containerapp secret show \
            --name app-ppbf-staging \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name ppbf-pilot-default-org-id \
            --query value -o tsv)"
          test -n "$ORG_ID"
          echo "::add-mask::$ORG_ID"
          echo "GATE_DEFAULT_ORG_ID=$ORG_ID" >> "$GITHUB_ENV"

      # The gate deliberately provisions nothing (see gate-session.mjs), so the
      # administrator fixture it authenticates as must already exist. It did in
      # the old shared database, but staging PostgreSQL was recreated on
      # 2026-07-26 and the first wired gate run (30497491164) refused with
      # "Gate fixture account org_admin_shadow does not exist". This is the
      # explicit provisioning step: idempotent, visible in the run log, and
      # scoped to the administrator only -- the athlete and guardian fixtures
      # are created by the gate through the real intake-promotion API, which is
      # part of what the gate is testing.
      # The gate athlete's PIN is generated fresh for each run and never
      # committed. It previously sat in this file as a literal -- in a PUBLIC
      # repository, against a publicly reachable staging login, on an account
      # the provisioner writes as active with must_change_pin=false. That is a
      # working credential published in source (audit PPBF-SEC-002).
      #
      # A per-run random value beats a stored secret here: nothing to leak
      # between runs, nothing to rotate, and the account is deactivated in the
      # always() cleanup step after the gate regardless of outcome. The value
      # must satisfy the 6-digit PIN policy and must not be
      # DEFAULT_FIRST_LOGIN_PIN (123456), which a chosen PIN is refused.
      #
      # It must satisfy the WHOLE policy, which this step previously did not.
      # It excluded exactly one value, 123456, while pinPolicy.ts refuses a much
      # wider class -- and step 9b feeds this PIN to /admin/accounts/pin-reset,
      # which enforces it. Run 31574292951 drew 'palindrome' and died with
      # PIN_TRIVIALLY_GUESSABLE after a clean build and a clean deploy, failing
      # a staging run for a dice roll rather than for a defect.
      #
      # The predicate below mirrors isTriviallyGuessablePin in
      # src/server/pilot/pinPolicy.ts. Mirroring rather than importing follows
      # the convention already used by pilot-provision-gate-fixtures.mjs, whose
      # hashPin says the same thing -- these scripts run before any TypeScript
      # build exists. Retry rather than patch: substituting a hardcoded fallback
      # is what produced the single-value guard this replaces.
      - name: Mint Ephemeral Gate Athlete PIN
        if: inputs.enable_shadow_gate
        run: |
          PIN="$(python3 - <<'PY'
          import secrets

          ASCENDING = '01234567890123456789'
          DESCENDING = '98765432109876543210'
          DEFAULT_FIRST_LOGIN_PIN = '123456'
          LENGTH = 6

          def trivially_guessable(pin):
              if len(set(pin)) == 1:                                  # 000000, 111111
                  return True
              if pin in ASCENDING or pin in DESCENDING:               # 123456, 654321, 890123
                  return True
              for size in (1, 2, 3):                                  # 121212, 123123
                  if pin[:size] * (LENGTH // size) == pin:
                      return True
              if all(pin[i] == pin[i + 1] for i in (0, 2, 4)):        # 112233
                  return True
              if pin == pin[::-1]:                                    # 123321
                  return True
              return False

          for _ in range(10_000):
              candidate = f"{secrets.randbelow(900000) + 100000:06d}"
              if candidate != DEFAULT_FIRST_LOGIN_PIN and not trivially_guessable(candidate):
                  print(candidate)
                  break
          else:
              raise SystemExit('could not mint a policy-satisfying PIN')
          PY
          )"
          test -n "$PIN"
          echo "::add-mask::$PIN"
          echo "GATE_ATHLETE_PIN=$PIN" >> "$GITHUB_ENV"

      - name: Provision Gate Fixture Accounts
        if: inputs.enable_shadow_gate
        env:
          AZURE_POSTGRES_CONNECTION_STRING: ${{ env.GATE_DB_CONNECTION }}
          # Required by the provisioner's write-target guard; derived above from
          # the staging app's own connection string.
          PPBF_EXPECTED_POSTGRES_HOSTNAME: ${{ env.GATE_EXPECTED_POSTGRES_HOSTNAME }}
          PPBF_EXPECTED_POSTGRES_DATABASE: ${{ env.GATE_EXPECTED_POSTGRES_DATABASE }}
          PPBF_PILOT_DEFAULT_ORG_ID: ${{ env.GATE_DEFAULT_ORG_ID }}
          PILOT_ADMIN_ACCOUNT_ID: org_admin_shadow
          # Same identities the gate step passes below: the provisioner creates
          # the athlete directly (intake promotion cannot -- document approval
          # is unreachable until the review feature is built, see the gate's
          # known-gap branch), and when promotion works again both paths upsert
          # the same rows.
          PILOT_SHADOW_ATHLETE_ACCOUNT_ID: gate_shadow_athlete
          PILOT_SHADOW_ATHLETE_PIN: ${{ env.GATE_ATHLETE_PIN }}
          PILOT_SHADOW_ATHLETE_ID: GATE-SHADOW-ATH-1
          # Read-only probe fixtures for the runtime-verification step below.
          # The interesting probes are refusals -- an org-admin-gated route must
          # refuse a coach, and must refuse the platform owner too -- and a
          # refusal cannot be proven without a session of the role being
          # refused. Both are provisioned Microsoft-authenticated with no PIN
          # hash, so neither can ever authenticate through the login form.
          PILOT_PROBE_COACH_ACCOUNT_ID: gate_probe_coach
          PILOT_PROBE_PLATFORM_OWNER_ACCOUNT_ID: gate_probe_platform_owner
          # The split household: two guardians on one athlete, the second of
          # them also the emergency contact. The guardian-contact probe below
          # asserts a NEGATIVE about a real response body -- that one household
          # sees no trace of the other's phone, email or account_id -- and a
          # negative asserted against a table with one guardian in it passes
          # while proving nothing. Both are Microsoft-authenticated with no PIN
          # hash, so neither can ever authenticate through the login form.
          PILOT_PROBE_GUARDIAN_A_ACCOUNT_ID: gate_probe_guardian_a
          PILOT_PROBE_GUARDIAN_B_ACCOUNT_ID: gate_probe_guardian_b
        run: |
          npm --prefix apps/web run gate:pilot:fixtures

      # The first enabled run of this gate (30485899526, 2026-07-29) showed the
      # step was never fully wired: the script hard-requires the fixture
      # identities below and exits before doing anything without them. Every
      # earlier run had enable_shadow_gate=false, so the gap never surfaced.
      # The identities are gate-owned fixtures -- the intake promotion step
      # creates (or idempotently re-creates) them on each run; they are not
      # pre-existing accounts. The PIN must satisfy the 6-digit policy and must
      # not be DEFAULT_FIRST_LOGIN_PIN, which a chosen PIN is refused.
      - name: Run SHADOW E2E Gate
        if: inputs.enable_shadow_gate
        env:
          AZURE_POSTGRES_CONNECTION_STRING: ${{ env.GATE_DB_CONNECTION }}
          PILOT_ADMIN_ACCOUNT_ID: org_admin_shadow
          PPBF_PILOT_DEFAULT_ORG_ID: ${{ env.GATE_DEFAULT_ORG_ID }}
          PILOT_SHADOW_ATHLETE_ACCOUNT_ID: gate_shadow_athlete
          PILOT_SHADOW_ATHLETE_PIN: ${{ env.GATE_ATHLETE_PIN }}
          PILOT_SHADOW_ATHLETE_ID: GATE-SHADOW-ATH-1
          PILOT_SHADOW_GUARDIAN_ACCOUNT_ID: gate_shadow_guardian
          PILOT_SHADOW_GUARDIAN_PARENT_ID: gate_shadow_parent_1
        run: |
          npm --prefix apps/web run gate:pilot:shadow-e2e

      # THE SAFEGUARDING INVARIANT, ON THE REVISION THAT WAS JUST DEPLOYED.
      #
      # An athlete or a guardian must never receive another guardian's phone,
      # email or account_id through an intake/domain read, and authorized staff
      # must keep them. Unit tests prove the SQL string; the embedded-Postgres
      # suite proves the rows a database returns. Neither can tell you what the
      # image now serving traffic does -- a stale revision, a half-applied
      # deploy, or a route that never made it into the build passes every test
      # in the repository.
      #
      # This signs in against the deployed URL as Guardian A, as the athlete,
      # and as the organization admin, and reads the real response bodies. It
      # writes nothing but its own short-lived session rows and revokes every
      # one. It is deliberately NOT a pilot:runtime-verify probe: that engine
      # refuses any probe that sends a non-read-only method and treats 2xx as a
      # pass, and domain-get is a POST that reads -- expressing it there would
      # mean weakening a guard that is right.
      #
      # This GATES. A leak here is the disclosure the platform exists to
      # prevent, and a deploy that produces one must not be reported green.
      - name: Guardian Contact Runtime Probe
        if: inputs.enable_shadow_gate
        env:
          AZURE_POSTGRES_CONNECTION_STRING: ${{ env.GATE_DB_CONNECTION }}
          PILOT_ADMIN_ACCOUNT_ID: org_admin_shadow
          PILOT_SHADOW_ATHLETE_ACCOUNT_ID: gate_shadow_athlete
          PILOT_SHADOW_ATHLETE_ID: GATE-SHADOW-ATH-1
          PILOT_PROBE_GUARDIAN_A_ACCOUNT_ID: gate_probe_guardian_a
          PILOT_PROBE_GUARDIAN_B_ACCOUNT_ID: gate_probe_guardian_b
        run: |
          {
            echo ''
            echo '### Guardian contact runtime probe'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          npm --prefix apps/web run gate:pilot:guardian-contact \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '```'
            echo ''
            echo "Probe exit status: \`$status\`. Non-zero means a guardian's contact details"
            echo 'reached a reader who must not have them, or that staff lost fields they need.'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # Thirty-two queue rows reached PRODUCTION_DEPLOYED having skipped
      # RUNTIME_VERIFIED. Deploying is not verifying: what those rows attest is
      # that the code is running, not that any surface has been exercised. This
      # runs the declared probe set against the environment that was just
      # deployed and writes a ledger a gatekeeper can read.
      #
      # This GATES. It did not until run 32770638337 (2026-08-24, c7dee86d,
      # enable_shadow_gate=true), the first run against the migrated and seeded
      # staging database: tally PASS=72, sessions minted 3 / revoked 3, and zero
      # failed probes -- including the three that were the entire reason it did
      # not gate, PR-238x/drill-library-seeded, PR-238ac/disciplines-seeded and
      # PR-238aa/library-sources, all ok.
      #
      # The exemption this step used to carry was narrow and is now spent: two
      # probes were expected to FAIL until reference data was seeded, and a
      # brand-new check must not turn a successful deploy red for a condition
      # already known and already tracked. The reference data is seeded, so the
      # continue-on-error line that exemption bought was deleted. That was the
      # whole change the old note asked for, and this is it being made.
      #
      # The ledger also prints items that still need a human-authored
      # acceptance probe (16 on that run). Those are PROSE -- declared future
      # work the ledger reports about itself -- NOT probe failures. They do not
      # move the exit status and they must not be read as a red gate; only a
      # probe that FAILED or errored turns this step red.
      #
      # It never mints a session against production: the engine refuses that
      # without an explicit flag, which is not passed here and should not be.
      - name: Runtime Verification Ledger
        if: inputs.enable_shadow_gate
        env:
          AZURE_POSTGRES_CONNECTION_STRING: ${{ env.GATE_DB_CONNECTION }}
          PILOT_ADMIN_ACCOUNT_ID: org_admin_shadow
          PILOT_PROBE_COACH_ACCOUNT_ID: gate_probe_coach
          PILOT_PROBE_PLATFORM_OWNER_ACCOUNT_ID: gate_probe_platform_owner
        run: |
          {
            echo ''
            echo '### Runtime verification ledger'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # set +e, not pipefail: this shell runs with -e, so a failing probe
          # would abort the step before the status could be captured and the
          # summary would be left with an unterminated code fence and no verdict
          # -- the failure case is exactly the one whose output matters most.
          #
          # tee so the ledger lands in both the step summary and the run log:
          # the summary is what a gatekeeper reads, the log is what survives
          # being scrolled past.
          set +e
          npm --prefix apps/web run pilot:runtime-verify -- --target=staging \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '```'
            echo ''
            echo "Probe exit status: \`$status\` (non-zero means at least one probe FAILED or errored)."
            echo 'A non-zero status fails this step and the deploy: since run 32770638337'
            echo 'this ledger gates. A green ledger still does not clear RUNTIME_VERIFIED --'
            echo 'see the outstanding-probe list the ledger prints, which is declared future'
            echo 'work rather than probe failures, and is not what turns this step red.'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # always(): a gate that fails partway through is exactly the case where a
      # live athlete credential must not be left behind on a publicly reachable
      # staging login. Deactivating clears the PIN hash and sets active_flag
      # false, so the ephemeral PIN cannot authenticate after the run whatever
      # the outcome. Cleanup failure is reported, never fatal -- it must not
      # mask the gate's own result. The step below is what makes "reported"
      # true; the id exists for it to read.
      - name: Deactivate Gate Athlete Fixture
        id: deactivate-gate-athlete
        if: always() && inputs.enable_shadow_gate
        continue-on-error: true
        env:
          AZURE_POSTGRES_CONNECTION_STRING: ${{ env.GATE_DB_CONNECTION }}
          PPBF_EXPECTED_POSTGRES_HOSTNAME: ${{ env.GATE_EXPECTED_POSTGRES_HOSTNAME }}
          PPBF_EXPECTED_POSTGRES_DATABASE: ${{ env.GATE_EXPECTED_POSTGRES_DATABASE }}
          PPBF_PILOT_DEFAULT_ORG_ID: ${{ env.GATE_DEFAULT_ORG_ID }}
          PILOT_ADMIN_ACCOUNT_ID: org_admin_shadow
          PILOT_SHADOW_ATHLETE_ACCOUNT_ID: gate_shadow_athlete
          PILOT_SHADOW_ATHLETE_ID: GATE-SHADOW-ATH-1
          PILOT_SHADOW_ATHLETE_PIN: ${{ env.GATE_ATHLETE_PIN }}
        run: |
          npm --prefix apps/web run gate:pilot:fixtures -- --deactivate-athlete

      # "Reported, never fatal" was doing no reporting: continue-on-error turns
      # a failed cleanup into a grey step inside a green run, and the one thing
      # that failure means is that a working 6-digit PIN for gate_shadow_athlete
      # is still live on a login anyone on the internet can reach. This says so
      # where a gatekeeper is already looking.
      #
      # Still non-fatal, deliberately: it exits 0. Making cleanup fatal would
      # let a cleanup failure overwrite the gate's own verdict, which is the
      # reason the step above carries continue-on-error at all. An annotation is
      # loud without being able to change the result.
      #
      # Keyed on that step's own `outcome`, NOT failure(). failure() is wrong in
      # both directions here: the ledger above is a hard gate now, so failure()
      # is true whenever a probe failed and would cry credential-leak on a run
      # whose cleanup was fine; and a continue-on-error step's failure never
      # sets failure() anyway, so it would miss the case this exists for.
      # `outcome` is the only expression that reports this step and only this
      # step (it is 'failure' even when continue-on-error rewrote `conclusion`
      # to success, and 'skipped' when the gate never ran).
      #
      # The PIN is never printed. It is ::add-mask::ed at mint, and the account
      # id is what a responder actually needs to go clear it.
      - name: Report Gate Athlete Fixture Still Live
        if: always() && steps.deactivate-gate-athlete.outcome == 'failure'
        run: |
          echo "::error title=Gate athlete fixture may still be live::Deactivating gate_shadow_athlete (athlete GATE-SHADOW-ATH-1) FAILED. Its ephemeral PIN may still authenticate against the staging login. Clear it by hand before leaving this run."

          {
            echo ''
            echo '### Gate athlete fixture cleanup FAILED'
            echo ''
            echo 'Account `gate_shadow_athlete` (athlete `GATE-SHADOW-ATH-1`) may still carry a'
            echo 'working PIN on staging, which is publicly reachable. Clear it by hand:'
            echo 'dispatch this workflow again, or run'
            echo '`npm --prefix apps/web run gate:pilot:fixtures -- --deactivate-athlete`'
            echo 'against staging, or deactivate the account directly.'
          } >> "$GITHUB_STEP_SUMMARY"

          # Non-fatal by construction -- see the note above this step.
          exit 0

      # The digest, again, as the last thing this job says.
      #
      # It is already captured at step 11 and uploaded as an artifact, and both
      # are unreachable from an agent shell: artifact bodies live on Azure blob
      # storage, which the agent proxy refuses (403), and step 11 sits twenty
      # steps and a few thousand log lines above the end. deploy-production
      # requires the literal string as an input, so the value that gates the
      # promote was the one value nobody could read without a browser.
      #
      # always(), because a run whose gate failed still built and pushed an image,
      # and knowing which digest was rejected is worth as much as knowing which
      # one passed.
      - name: Report Release Digest Last
        if: always()
        run: |
          echo '--- release digest (for deploy-production release_digest) ---'
          echo '${{ steps.build-image.outputs.digest }}'
