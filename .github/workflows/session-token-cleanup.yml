# ─────────────────────────────────────────────────────────────────────────
# Nightly cleanup of expired and revoked sign-in session tokens.
#
# docs/DATA_RETENTION.md: "Session tokens | 30 days after expiration/revocation
# | Forensic window: debug session issues". The script that deletes them
# (apps/web/scripts/pilot-cleanup-sessions.ts, `npm run session:cleanup`)
# shipped with nothing to run it, so pilot.session_tokens kept every row it was
# ever given (audit B-02, issue #1482 item 3).
#
# WHAT THE SCRIPT DOES AND DOES NOT DO
#   * deletes pilot.session_tokens rows whose expires_at, or revoked_at, is
#     more than SESSION_TOKEN_RETENTION_DAYS (30) days old -- a live token,
#     and one inside the window, is never touched;
#   * refuses a database the caller did not name (POSTGRES_TARGET_MISMATCH);
#   * is a dry run unless PPBF_SESSION_CLEANUP_APPLY=true;
#   * prints one JSON line of counts: no token hashes, no account ids.
#
# DRY RUN FIRST. The scheduled run only REPORTS how many tokens are due until
# an operator sets the repository variable PPBF_SESSION_CLEANUP_SCHEDULED_APPLY
# to `true`, after reading a few nights of counts. A person can delete at any
# time by dispatching with apply=APPLY. Until the variable is set, nothing is
# deleted on a schedule.
#
# WHY THIS DECLARES NO `environment:`: the same reason backup.yml,
# retention-cleanup.yml and session-autoclose.yml do not -- a scheduled run
# against a protected environment waits for a human and is cancelled after
# thirty days.
# ─────────────────────────────────────────────────────────────────────────

name: session-token-cleanup

on:
  schedule:
    # 07:50 UTC daily -- after backup.yml (07:10) and retention-cleanup.yml
    # (07:40), so the night's backup exists before anything is deleted.
    - cron: '50 7 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Which environment's database to sweep
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      apply:
        description: Type APPLY to delete. Anything else is a dry run that only reports the count.
        required: true
        default: DRY_RUN
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: session-token-cleanup-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: ${{ inputs.target || 'production' }}
      # RESOURCE_GROUP is resolved per target below (see retention-cleanup.yml
      # for why a job-level staging literal was wrong for production).
      CONTAINER_APP_NAME: ${{ (inputs.target || 'production') == 'production' && 'app-ppbf-production' || 'app-ppbf-staging' }}

    steps:
      - name: Resolve Target Resource Group
        env:
          PRODUCTION_RESOURCE_GROUP: ${{ secrets.AZURE_PRODUCTION_RESOURCE_GROUP }}
        run: |
          if [ "$TARGET" = "production" ]; then
            if [ -z "$PRODUCTION_RESOURCE_GROUP" ]; then
              echo "::error::secrets.AZURE_PRODUCTION_RESOURCE_GROUP is empty or unset. Refusing to fall back to the staging resource group for a production operation."
              exit 1
            fi
            echo "RESOURCE_GROUP=$PRODUCTION_RESOURCE_GROUP" >> "$GITHUB_ENV"
          else
            echo "RESOURCE_GROUP=rg-ppbf-enterprise-staging" >> "$GITHUB_ENV"
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      - name: Authenticate via Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fetched from the target-NAMED Container App, so the fetch itself is the
      # strong target guard; the expected host/database are derived from the
      # same string and re-checked by the script (see retention-cleanup.yml).
      - name: Resolve Database Connection
        env:
          OVERRIDE_HOST: ${{ vars.PPBF_EXPECTED_POSTGRES_HOSTNAME }}
          OVERRIDE_DB: ${{ vars.PPBF_EXPECTED_POSTGRES_DATABASE }}
        run: |
          CONN="$(az containerapp secret show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-postgres-connection-string \
            --query value -o tsv)"
          test -n "$CONN"
          echo "::add-mask::$CONN"
          echo "AZURE_POSTGRES_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"

          DERIVED="$(CONN="$CONN" node -e '
            const u = new URL(process.env.CONN);
            const host = u.hostname.toLowerCase();
            const db = decodeURIComponent(u.pathname.replace(/^\/+/, ""));
            if (!host || !db) { process.exit(2); }
            process.stdout.write(host + "\n" + db);
          ')"
          HOST="$(printf '%s' "$DERIVED" | sed -n 1p)"
          DB="$(printf '%s' "$DERIVED" | sed -n 2p)"
          test -n "$HOST"
          test -n "$DB"

          echo "PPBF_EXPECTED_POSTGRES_HOSTNAME=${OVERRIDE_HOST:-$HOST}" >> "$GITHUB_ENV"
          echo "PPBF_EXPECTED_POSTGRES_DATABASE=${OVERRIDE_DB:-$DB}" >> "$GITHUB_ENV"

      # A scheduled run has no inputs. It deletes only when the repository
      # variable PPBF_SESSION_CLEANUP_SCHEDULED_APPLY is exactly 'true' (DRY RUN
      # FIRST, above); a dispatch deletes only when a person typed APPLY.
      - name: Delete Expired Session Tokens
        env:
          PPBF_SESSION_CLEANUP_APPLY: ${{ (github.event_name == 'schedule' && vars.PPBF_SESSION_CLEANUP_SCHEDULED_APPLY == 'true') || inputs.apply == 'APPLY' }}
        # `shell: bash` for pipefail, so a failed sweep is not hidden by `tee`.
        shell: bash
        run: |
          npm --prefix apps/web run session:cleanup | tee session-cleanup-result.json

      - name: Record What Ran
        if: always()
        env:
          # Free text reaches the shell through the environment, never by
          # interpolation (see retention-cleanup.yml).
          APPLY: ${{ (github.event_name == 'schedule' && vars.PPBF_SESSION_CLEANUP_SCHEDULED_APPLY == 'true') || inputs.apply == 'APPLY' }}
        run: |
          {
            echo "### Session token cleanup -- \`$TARGET\`"
            echo ''
            if [ "$APPLY" = "true" ]; then
              echo '- mode: **APPLY** (expired session tokens were deleted)'
            else
              echo '- mode: dry run (count only, nothing deleted)'
            fi
            echo "- outcome: \`${{ job.status }}\`"
            echo ''
            echo '```json'
            [ -s session-cleanup-result.json ] && cat session-cleanup-result.json || echo '{"event":"session.cleanup.no-output"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
