name: PPBF CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd apps/web && npm install && npm run build
      - run: cd apps/coach-review && npm install && npm run build
      - name: Run Governance Checks
        run: echo "Layer 0 governance checks would run here (promotion validation, safety gate tests)"
