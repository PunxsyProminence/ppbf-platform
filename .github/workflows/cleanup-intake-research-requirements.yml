name: cleanup-intake-research-requirements

# Deletes the pilot.shadow_research_requirements rows that athlete intake
# uploads wrote before PR #1122 (2026-10-03): every row tagged
# source_event_name SHADOW_UPLOAD_CLASSIFIED_AND_ROUTED and source_entity_type
# shadow_intake, in one organization or in all of them, and the research
# submissions linked to those rows. Their text can carry a child's file name and
# the table is listed on /research to every organization role.
#
# Jason ruled OD-2026-10-02-015 D4 (athlete intake files stay out of research)
# and OD-2026-10-03-002 section 1 ("Delete them all"): a read-only count first,
# then his word for the run. He approves the production run in GitHub: the job
# runs in the environment named by `target`, so a production dispatch is held by
# the production environment's protection rules, the same gate
# repair-research-baseline.yml uses.
#
# Dry run by default: it prints the requirement ids, the counts (open and
# resolved, per organization), the created_at range and a plan fingerprint, and
# rolls back. That dry run IS the read-only count. It never prints a row's text.
#
# Apply deletes only the plan that was reviewed: it needs expected_fingerprint
# set to the plan_fingerprint a dry run of the same target AND the same
# organization printed, and it refuses (PLAN_FINGERPRINT_MISMATCH, before its
# first delete) when the rows it finds give a different fingerprint.
#
# Run order and what Jason approves: docs/INTAKE_RESEARCH_REQUIREMENT_CLEANUP_RUNBOOK.md.
#
# Dispatch-only for the reason in scripts/lib/postgres-write-target.mjs: the
# alternative is an operator holding a production connection string on a laptop,
# which is how 361 orphaned rows got into production on 2026-07-18.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database environment
        required: true
        type: choice
        options:
          - staging
          - production
      confirm_target:
        description: Retype the target exactly
        required: true
        type: string
      organization:
        description: An organization_id, or ALL_ORGANIZATIONS for every organization
        required: true
        type: string
      mode:
        description: Report the rows (dry run), or delete them
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirm_delete:
        description: For apply mode, type DELETE INTAKE RESEARCH REQUIREMENTS exactly
        required: false
        type: string
      expected_fingerprint:
        description: For apply mode, the plan_fingerprint (sha256:...) printed by the dry run you reviewed
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cleanup-intake-research-requirements-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  cleanup:
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # RESOURCE_GROUP is resolved per target by the step below, never set
      # here: production reads secrets.AZURE_PRODUCTION_RESOURCE_GROUP with no
      # staging fallback (see workflowResourceGroupContract.test.ts).
      CONTAINER_APP_NAME: ${{ inputs.target == 'production' && 'app-ppbf-production' || 'app-ppbf-staging' }}
      PPBF_INTAKE_RR_CLEANUP_APPLY: ${{ inputs.mode == 'apply' }}
    steps:
      # Free text reaches the shell through the environment, never by
      # interpolation: `${{ ... }}` in a `run:` block is substituted before
      # bash parses the line, so a value with a quote and a semicolon becomes
      # commands.
      - name: Confirm Explicit Target And Apply Intent
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          ORGANIZATION: ${{ inputs.organization }}
          MODE: ${{ inputs.mode }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
        run: |
          set -euo pipefail
          if [ "$TARGET" != "$CONFIRM_TARGET" ]; then
            echo "::error::confirm_target does not match target."
            exit 1
          fi
          if [ -z "$ORGANIZATION" ] || [[ "$ORGANIZATION" == -* ]]; then
            echo "::error::organization must be an organization_id or ALL_ORGANIZATIONS."
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM_DELETE" != "DELETE INTAKE RESEARCH REQUIREMENTS" ]; then
            echo "::error::apply mode needs confirm_delete set to DELETE INTAKE RESEARCH REQUIREMENTS exactly."
            exit 1
          fi
          if [ "$MODE" = "apply" ] && [[ ! "$EXPECTED_FINGERPRINT" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::apply mode needs expected_fingerprint set to the plan_fingerprint printed by the dry run you reviewed."
            exit 1
          fi

      # A wrong-resource-group lookup that happens to resolve is worse than one
      # that refuses, so an unset secret stops the run here -- before the Azure
      # login, and long before anything touches a database.
      - name: Resolve Target Resource Group
        env:
          TARGET: ${{ inputs.target }}
          PRODUCTION_RESOURCE_GROUP: ${{ secrets.AZURE_PRODUCTION_RESOURCE_GROUP }}
        run: |
          if [ "$TARGET" = "production" ]; then
            if [ -z "$PRODUCTION_RESOURCE_GROUP" ]; then
              echo "::error::secrets.AZURE_PRODUCTION_RESOURCE_GROUP is empty or unset. Refusing to fall back to the staging resource group for a production operation."
              exit 1
            fi
            echo "RESOURCE_GROUP=$PRODUCTION_RESOURCE_GROUP" >> "$GITHUB_ENV"
          else
            echo "RESOURCE_GROUP=rg-ppbf-enterprise-staging" >> "$GITHUB_ENV"
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      # Not conditional on mode: the dry run reads the same database, so it needs
      # the same connection string, resolved the same way.
      - name: Authenticate via Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Declared Database Target
        env:
          OVERRIDE_HOST: ${{ vars.PPBF_EXPECTED_POSTGRES_HOSTNAME }}
          OVERRIDE_DB: ${{ vars.PPBF_EXPECTED_POSTGRES_DATABASE }}
        run: |
          set -euo pipefail
          CONN="$(az containerapp secret show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-postgres-connection-string \
            --query value -o tsv)"
          test -n "$CONN"
          echo "::add-mask::$CONN"
          echo "AZURE_POSTGRES_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"

          DERIVED="$(CONN="$CONN" node -e '
            const u = new URL(process.env.CONN);
            const host = u.hostname.toLowerCase();
            const db = decodeURIComponent(u.pathname.replace(/^\/+/, ""));
            if (!host || !db) process.exit(2);
            process.stdout.write(host + "\n" + db);
          ')"
          HOST="$(printf '%s' "$DERIVED" | sed -n 1p)"
          DB="$(printf '%s' "$DERIVED" | sed -n 2p)"
          echo "PPBF_EXPECTED_POSTGRES_HOSTNAME=${OVERRIDE_HOST:-$HOST}" >> "$GITHUB_ENV"
          echo "PPBF_EXPECTED_POSTGRES_DATABASE=${OVERRIDE_DB:-$DB}" >> "$GITHUB_ENV"

      # One command for both modes. The script is read-only unless
      # PPBF_INTAKE_RR_CLEANUP_APPLY is exactly 'true' AND
      # PPBF_INTAKE_RR_CLEANUP_CONFIRM is the phrase -- it checks the phrase and
      # the fingerprint itself too, so the dry run cannot write even if the guard
      # step above is later edited carelessly. The organization reaches the
      # command as a quoted variable, never by interpolation.
      - name: Clean Up Intake Research Requirements
        working-directory: apps/web
        env:
          ORGANIZATION: ${{ inputs.organization }}
          PPBF_INTAKE_RR_CLEANUP_CONFIRM: ${{ inputs.confirm_delete }}
          PPBF_INTAKE_RR_CLEANUP_EXPECT_FINGERPRINT: ${{ inputs.expected_fingerprint }}
        # `shell: bash` for pipefail; GitHub's default `bash -e {0}` lacks it
        # and `tee` would discard a failed run's exit code.
        shell: bash
        run: |
          if [ "$ORGANIZATION" = "ALL_ORGANIZATIONS" ]; then
            SCOPE=(--all-organizations)
          else
            SCOPE=(--organization "$ORGANIZATION")
          fi
          npm run pilot:cleanup-intake-research-requirements -- "${SCOPE[@]}" 2>&1 | tee -a /tmp/tool-output.txt

      - name: Record The Cleanup Run
        if: always()
        env:
          TARGET: ${{ inputs.target }}
          ORGANIZATION: ${{ inputs.organization }}
          MODE: ${{ inputs.mode }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # `-s`, not `tail ... ||`: tee creates the file before the tool
          # writes, so an empty file exits tail 0 and skips the fallback.
          echo '--- tool output (last lines, repeated) ---'
          [ -s /tmp/tool-output.txt ] && tail -n 12 /tmp/tool-output.txt || echo '(none captured)'
          {
            echo '### Intake research-requirement cleanup'
            echo ''
            echo "- target: \`$TARGET\`"
            echo "- organization: \`$ORGANIZATION\`"
            echo "- mode: \`$MODE\`"
            echo "- expected fingerprint: \`${EXPECTED_FINGERPRINT:-none}\`"
            echo "- result: \`$JOB_STATUS\`"
            echo ''
            echo 'The dry run prints the requirement ids, the open/resolved counts per'
            echo 'organization, the linked submissions and a plan fingerprint, never a'
            echo 'row text. Apply re-plans inside its own transaction with the rows'
            echo 'locked, refuses unless that plan has the expected fingerprint, checks'
            echo 'every delete count before committing, and records the run in'
            echo 'pilot.audit_events in each affected organization.'
          } >> "$GITHUB_STEP_SUMMARY"
