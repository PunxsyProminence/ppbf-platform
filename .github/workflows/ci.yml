name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run all fast regression tests
        run: npm test

      # Each .pg suite runs in its own Jest process (see the test:migrations:*
      # scripts). They spin up separate embedded Postgres instances and load
      # ESM-only modules through a native dynamic import; sharing one process
      # made a suite's import resolve after another suite's environment had been
      # torn down. --runInBand is therefore implicit -- each invocation runs a
      # single file -- so no extra flags are passed through here.
      - name: Run PostgreSQL migration suite
        run: npm run test:migrations

      - name: Install Playwright browsers
        run: npx --workspace web playwright install --with-deps chromium

      - name: Run board governance E2E
        run: npm --workspace web run test:e2e:board

      # The public entry points, and the design system's own laws on them. This
      # spec existed and ran nowhere, so nothing checked that the homepage stays
      # reachable signed-out, that no password field creeps onto it, or that
      # protected routes still redirect.
      #
      # It asserts computed styles rather than pixels, on purpose. Screenshot
      # baselines do not survive a browser revision change here — this runner
      # pins Chrome for Testing 149, shaping moves wrap points, and the prose
      # sections come out 23-38px taller than on the machine that recorded them.
      # Narrowing to the hero fixed the geometry and still differed by 5% of the
      # image, where a call-to-action changing colour is 4%: the noise and the
      # signal are the same size. Computed styles do not have that problem, and
      # every defect this branch found was a wrong token, a failing contrast
      # ratio or an undersized target — all visible without pixels.
      - name: Run public homepage E2E
        run: npm --workspace web run test:e2e:homepage

      - name: Build production application
        run: npm run build
