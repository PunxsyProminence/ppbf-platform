name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs only for pull requests. On main, every push's run
  # must complete: cancelling an in-flight main run when the next merge lands
  # leaves the earlier merge commit with a cancelled required check, and a
  # cancelled check reads as "never validated" -- the exact gap the branch
  # protection's required `validate` context exists to close.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify critical entrypoint contracts
        run: node scripts/verify-entrypoint-contracts.mjs

      - name: Test CI surface classifier
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { classifyPaths } from './scripts/ci-classify-paths.mjs';

          assert.deepEqual(classifyPaths(['docs/README.md', 'AGENT_KERNEL.md']), {
            docsOnly: true,
            migrations: false,
            boardE2e: false,
            homepageE2e: false,
            unknownCode: false,
          });

          assert.equal(classifyPaths(['README.md']).docsOnly, true);
          assert.equal(classifyPaths(['MASTER_INDEX.md']).docsOnly, true);

          assert.equal(
            classifyPaths(['apps/web/src/server/pilot/entities.ts']).migrations,
            true
          );

          assert.deepEqual(classifyPaths(['apps/web/components/roleSession.ts']), {
            docsOnly: false,
            migrations: false,
            boardE2e: true,
            homepageE2e: true,
            unknownCode: false,
          });

          assert.equal(
            classifyPaths(['apps/web/app/board/page.tsx']).boardE2e,
            true
          );

          assert.equal(
            classifyPaths(['design-system/ppbf.css']).homepageE2e,
            true
          );

          assert.equal(
            classifyPaths(['apps/web/components/SomeNewSurface.tsx']).unknownCode,
            true
          );

          assert.equal(classifyPaths([]).docsOnly, false);
          NODE

      - name: Classify changed surface
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base="$BASE_SHA"
          head="$HEAD_SHA"

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}^" 2>/dev/null || git rev-list --max-parents=0 "$head")"
          fi

          git diff --name-only "$base" "$head" > /tmp/changed-files.txt

          echo "Changed files:"
          cat /tmp/changed-files.txt

          node scripts/ci-classify-paths.mjs /tmp/changed-files.txt

      - name: Documentation-only fast path
        if: steps.changes.outputs.docs_only == 'true'
        run: |
          echo "Documentation-only change: entrypoint contracts passed; dependency, code, database, browser, and build gates are not applicable."

      - name: Install locked dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Type-check
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

      - name: Run all fast regression tests
        if: steps.changes.outputs.docs_only != 'true'
        run: npm test

      - name: Run PostgreSQL migration suite
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.migrations == 'true'
        run: npm run test:migrations

      - name: Install Playwright browsers
        if: steps.changes.outputs.docs_only != 'true' && (steps.changes.outputs.board_e2e == 'true' || steps.changes.outputs.homepage_e2e == 'true')
        run: npx --workspace web playwright install --with-deps chromium

      - name: Run board governance E2E
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.board_e2e == 'true'
        run: npm --workspace web run test:e2e:board

      - name: Run public homepage E2E
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.homepage_e2e == 'true'
        run: npm --workspace web run test:e2e:homepage

      - name: Build production application
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run build
