name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs group by PR number, so a new push supersedes the previous run for that
  # PR. Pushes to main group by COMMIT, so no main run can supersede another.
  #
  # WHY THE COMMIT AND NOT THE REF. cancel-in-progress below is already false
  # for pushes, and that is not sufficient. GitHub holds at most one PENDING
  # run per group: when a run is executing and a second is pending, a third
  # arrival cancels the pending one. Keying every main push to the shared
  # ref put all of them in one group, so merges landing faster than a run
  # takes evicted each other while still queued.
  #
  # Measured on 2026-08-27 over the last 30 pushes to main: 16 cancelled,
  # 13 success, 1 failure. Among the cancelled were the merge commits of
  # #716 and #718, whose combination left main red -- a state nothing
  # reported, because a cancelled check is not a failed one. It surfaced
  # later against an unrelated PR and reached a staging deploy first.
  #
  # A cancelled required check reads as "never validated", which is the exact
  # gap the branch protection's required `validate` context exists to close.
  # github.sha is unique per commit, so every main commit now gets a run that
  # nothing can evict.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify critical entrypoint contracts
        run: node scripts/verify-entrypoint-contracts.mjs

      # Unconditional, and above the classifier on purpose. The docs-only fast
      # path below skips install, tests and build, which is how commits kept
      # reporting green on main over an already-destroyed apps/web/package.json.
      # This step runs in well under a second and needs no node_modules --
      # package-integrity.yml runs the same script as its own workflow so a
      # cancelled `validate` run still leaves a verdict.
      - name: Verify package integrity
        run: node scripts/verify-package-integrity.mjs

      - name: Test CI surface classifier
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { classifyPaths } from './scripts/ci-classify-paths.mjs';

          assert.deepEqual(classifyPaths(['docs/README.md', 'AGENT_KERNEL.md']), {
            docsOnly: true,
            migrations: false,
            boardE2e: false,
            homepageE2e: false,
            coachE2e: false,
            athleteE2e: false,
            guardianE2e: false,
            goldenEraE2e: false,
            activationE2e: false,
            unknownCode: false,
            unclassifiedPaths: [],
          });

          assert.equal(classifyPaths(['README.md']).docsOnly, true);
          assert.equal(classifyPaths(['MASTER_INDEX.md']).docsOnly, true);

          assert.equal(
            classifyPaths(['apps/web/src/server/pilot/entities.ts']).migrations,
            true
          );

          assert.deepEqual(classifyPaths(['apps/web/components/roleSession.ts']), {
            docsOnly: false,
            migrations: false,
            boardE2e: true,
            homepageE2e: true,
            coachE2e: true,
            athleteE2e: true,
            guardianE2e: true,
            goldenEraE2e: true,
            // roleSession is not on the activation path: that journey is
            // unauthenticated from end to end, so the client role cache is
            // never consulted during it.
            activationE2e: false,
            unknownCode: false,
            unclassifiedPaths: [],
          });

          // The three journey surfaces added with the coach/athlete/guardian
          // specs. deepEqual above pins the SHAPE; these pin that each new flag
          // actually fires for its own surface -- a flag that is always false is
          // a spec that never runs, which is worse than no spec at all.
          assert.equal(classifyPaths(['apps/web/e2e/coach-journey.spec.ts']).coachE2e, true);
          assert.equal(classifyPaths(['apps/web/e2e/athlete-journey.spec.ts']).athleteE2e, true);
          assert.equal(classifyPaths(['apps/web/e2e/guardian-journey.spec.ts']).guardianE2e, true);
          assert.equal(classifyPaths(['apps/web/e2e/support/signIn.ts']).coachE2e, true);

          // THE ACTIVATION JOURNEY. Same rule as every predicate above: the
          // suite must fire for its own spec and for each surface it walks, or
          // it is a spec that never runs -- which reads as coverage while
          // providing none.
          assert.equal(classifyPaths(['apps/web/e2e/activation-journey.spec.ts']).activationE2e, true);
          assert.equal(classifyPaths(['apps/web/app/activate/page.tsx']).activationE2e, true);
          assert.equal(classifyPaths(['apps/web/app/api/pilot/auth/activate/route.ts']).activationE2e, true);
          assert.equal(classifyPaths(['apps/web/src/server/pilot/pinPolicy.ts']).activationE2e, true);

          // The door, and the reason this suite exists at all: /athlete/sign-in
          // is the only page linking to /activate, and before that link a new
          // athlete holding a code had a form that would refuse them and
          // nowhere to go. A change dropping it must run the suite that checks
          // it is there.
          assert.equal(classifyPaths(['apps/web/app/athlete/sign-in/page.tsx']).activationE2e, true);

          // ...and no wider. This journey never signs in, so the session gate,
          // the server auth module and the role routing table are not on its
          // path; matching them would run it on every session-layer change for
          // no coverage gained. Same restraint the homepage predicate states.
          assert.equal(classifyPaths(['apps/web/src/server/pilot/pageGuard.ts']).activationE2e, false);
          assert.equal(classifyPaths(['apps/web/components/RoleSessionGate.tsx']).activationE2e, false);

          // The homepage suite was the one journey whose own spec did not fire
          // its flag, so an edit to public-homepage.spec.ts could not run
          // itself -- exactly the "spec that never runs" this block exists to
          // catch, missed because the assertion above stopped at three.
          assert.equal(classifyPaths(['apps/web/e2e/public-homepage.spec.ts']).homepageE2e, true);

          // That spec opens /login and asserts on the sign-in methods it
          // offers, so the front door is a homepage surface. It reached only
          // the three SIGNED-IN predicates before, which do not run this one:
          // a change to SignInPanel went out with the homepage journey skipped.
          assert.equal(classifyPaths(['apps/web/components/SignInPanel.tsx']).homepageE2e, true);
          assert.equal(classifyPaths(['apps/web/app/login/page.tsx']).homepageE2e, true);

          // And the board suite, which was the remaining spec that could not
          // fire its own flag. Its three tests are unauthenticated redirect
          // checks that each assert on the 'The Bell' heading, so the sign-in
          // door is one of its surfaces too.
          assert.equal(classifyPaths(['apps/web/e2e/board-governance.spec.ts']).boardE2e, true);
          assert.equal(classifyPaths(['apps/web/components/SignInPanel.tsx']).boardE2e, true);
          assert.equal(classifyPaths(['apps/web/app/login/page.tsx']).boardE2e, true);

          // ...and still only that one. The rest of the signed-in plumbing is
          // not on an unauthenticated visitor's path, and widening this
          // predicate to all of it would run the homepage suite on every
          // session-layer change for no coverage gained.
          assert.equal(classifyPaths(['apps/web/src/server/pilot/pageGuard.ts']).homepageE2e, false);

          assert.equal(
            classifyPaths(['apps/web/app/board/page.tsx']).boardE2e,
            true
          );

          assert.equal(
            classifyPaths(['design-system/ppbf.css']).homepageE2e,
            true
          );

          // THE GOLDEN-ERA RESOLVED-STYLE PROOFS. The rule this suite exists
          // to enforce is that a change to the golden-era sheet runs EVERY
          // scope proof, not only the `.ge-bell` one that happens to live in
          // the homepage spec -- so this is the assertion that would have
          // caught the gap it was written for.
          assert.equal(
            classifyPaths(['design-system/current/ppbf-golden-era.css']).goldenEraE2e,
            true
          );

          // The alias file. app/globals.css declares --accent/--accent-strong
          // as :root aliases of the brass ramp, which is where one of the two
          // leaks the suite records comes from, so it is a surface of this
          // suite and not only of the homepage's.
          assert.equal(classifyPaths(['apps/web/app/globals.css']).goldenEraE2e, true);

          // Every route carrying a scope class, and the two workspace
          // components mounted inside two of them. A scope proof reads the
          // real page, so the page is its surface.
          for (const surface of [
            'apps/web/app/login/page.tsx',
            'apps/web/app/coach/environment/intake-router/page.tsx',
            'apps/web/app/coach/drills/page.tsx',
            'apps/web/app/coach/session-scripts/page.tsx',
            'apps/web/app/schedule/page.tsx',
            'apps/web/app/admin/people/page.tsx',
            'apps/web/app/admin/shadow/page.tsx',
            'apps/web/app/athlete/dashboard/page.tsx',
            'apps/web/components/CoachWorkspace.tsx',
            'apps/web/components/AthleteWorkspace.tsx',
          ]) {
            assert.equal(classifyPaths([surface]).goldenEraE2e, true, surface);
          }

          // ...and its own spec, which is the failure mode two of the older
          // predicates shipped with: a suite whose own edit cannot run it.
          assert.equal(
            classifyPaths(['apps/web/e2e/golden-era-scope-proofs.spec.ts']).goldenEraE2e,
            true
          );

          // Deliberately narrow at the other end. This suite never opens the
          // board, the parent hub or the review queue, and firing it on every
          // unrelated page would buy no coverage and cost a browser install.
          assert.equal(classifyPaths(['apps/web/app/board/page.tsx']).goldenEraE2e, false);
          assert.equal(classifyPaths(['apps/web/app/parent/page.tsx']).goldenEraE2e, false);

          assert.equal(
            classifyPaths(['apps/web/components/SomeNewSurface.tsx']).unknownCode,
            true
          );

          // THE UNKNOWN-CODE SIGNAL MUST NAME ITS FILES. The boolean above has
          // been emitted since this classifier was written and, until the
          // reporting step below, nothing read it. A boolean on its own cannot
          // be acted on either: widening a predicate requires the path that
          // missed it, so the annotation needs the list, not the flag.
          assert.deepEqual(
            classifyPaths(['apps/web/components/SomeNewSurface.tsx']).unclassifiedPaths,
            ['apps/web/components/SomeNewSurface.tsx']
          );

          // Documentation carried alongside unrecognised code is not itself
          // unrecognised code. Commit 814a5263 is exactly this shape -- 47
          // files under docs/capabilities/modules/ and one .test.ts -- and an
          // annotation naming all 48 is an annotation nobody reads.
          assert.deepEqual(
            classifyPaths([
              'docs/capabilities/modules/example.md',
              'apps/web/src/docs/capabilityEvidence.test.ts',
            ]).unclassifiedPaths,
            ['apps/web/src/docs/capabilityEvidence.test.ts']
          );

          // The other direction, and the one that keeps the channel worth
          // reading: a diff some predicate DID recognise names nothing. A list
          // that fills up when a suite already covers the change is noise, and
          // noise trains people to ignore the annotation.
          for (const covered of [
            ['apps/web/components/roleSession.ts'],
            ['apps/web/app/board/page.tsx'],
            ['apps/web/src/server/pilot/entities.ts'],
            ['docs/README.md'],
            [],
          ]) {
            assert.equal(classifyPaths(covered).unknownCode, false, covered.join());
            assert.deepEqual(classifyPaths(covered).unclassifiedPaths, [], covered.join());
          }

          // The invariant the reporting step stands on: when the boolean fires
          // the list is never empty, so the warning can never be raised with
          // nothing to name. It holds by construction -- unknownCode requires
          // !docsOnly, and docsOnly is false exactly when some file is not
          // documentation -- and is pinned because a step downstream assumes it.
          for (const missed of [
            ['apps/web/components/SomeNewSurface.tsx'],
            ['.github/workflows/backup.yml'],
            ['docs/capabilities/modules/example.md', 'apps/web/src/docs/capabilityEvidence.test.ts'],
          ]) {
            const missedResult = classifyPaths(missed);
            assert.equal(missedResult.unknownCode, true, missed.join());
            assert.ok(missedResult.unclassifiedPaths.length > 0, missed.join());
          }

          assert.equal(classifyPaths([]).docsOnly, false);
          NODE

      - name: Classify changed surface
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base="$BASE_SHA"
          head="$HEAD_SHA"

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}^" 2>/dev/null || git rev-list --max-parents=0 "$head")"
          fi

          # Diff from the MERGE BASE, not from the base tip.
          #
          # `git diff A B` reports every file that differs between two commits.
          # For a pull request branch that is behind its base, that includes
          # every file the BASE gained since the branch forked -- other lanes'
          # merged work, reported as this branch's changes. The classifier then
          # runs suites for surfaces the diff never touches, and they go green,
          # so a reviewer sees browser coverage attributed to a pull request
          # that cannot have affected it. The mirror case is worse and quieter:
          # a suite whose surface the branch DOES touch can be missed when the
          # base moved the other way.
          #
          # Measured on #842: two-dot classified 26 files where the branch
          # changed 8, turned guardian_e2e on off a route the branch never
          # touched, and the extra suites pushed the job past timeout-minutes,
          # so the required check came back `cancelled` -- which reads as never
          # validated rather than as a failure.
          #
          # On a push to main the two spellings agree, because `before` is an
          # ancestor of `sha` and is therefore its own merge base. This is a
          # correction to the pull-request path and a no-op on the push path.
          #
          # The merge base is computed explicitly rather than with `A...B` so
          # that an unrelated-history pair (no merge base, which `...` fails on)
          # falls back to the tip rather than failing the whole run.
          if merge_base="$(git merge-base "$base" "$head" 2>/dev/null)"; then
            base="$merge_base"
          fi

          echo "Diffing from $base to $head"
          git diff --name-only "$base" "$head" > /tmp/changed-files.txt

          echo "Changed files:"
          cat /tmp/changed-files.txt

          node scripts/ci-classify-paths.mjs /tmp/changed-files.txt

      # SURFACING, NOT GATING -- and that distinction is the whole design.
      #
      # `unknown_code` is this classifier's only signal for "the diff touched
      # code that matched no predicate at all". It has been emitted to
      # $GITHUB_OUTPUT since the classifier was written and, until this step,
      # nothing read it: a repository-wide grep for `unknown_code` returned
      # exactly one hit, the emitter. The one signal that would have announced
      # a predicate miss at the time was computed and thrown away, while the
      # classifier's own comments accumulated a history of predicates found too
      # narrow only after a miss.
      #
      # MEASURED BEFORE WIRING, because an annotation that fires on most
      # commits is noise, and noise is worse than silence -- it teaches people
      # to skip the channel. Replaying classifyPaths over each commit's own
      # diff for the last 100 commits of `main` (3b8a1bfe back to eb5f3dba;
      # linear, zero merge commits, so every diff is unambiguous) fires on 9.
      # At nine per cent a reader can still believe it, and the median firing
      # names two files.
      #
      # WHY IT MUST NOT FAIL THE BUILD. `unknown_code` is true for
      # legitimately unclassified code -- server modules, repository scripts,
      # other workflows -- as well as for a genuine miss, and nothing here can
      # tell those apart. Of the nine firings measured, six were the first kind
      # and two touched apps/web/app/api/pilot/coach-reviews/, which is coach
      # surface that isCoachE2ePath does not match. This repository's precedent
      # for a newly added guard is to make a miss VISIBLE first rather than
      # block on it, and blocking would turn the classifier's own conservatism
      # into a merge gate, which nobody decided.
      - name: Report unrecognised code surface
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.unknown_code == 'true'
        shell: bash
        env:
          # Through env, never interpolated into the script body: these are
          # paths taken from the diff, so an inline expression would let a
          # crafted filename on a pull request branch reach the shell as code.
          UNCLASSIFIED_PATHS: ${{ steps.changes.outputs.unclassified_paths }}
        run: |
          {
            echo "### Unrecognised code surface"
            echo
            echo "No E2E predicate in \`scripts/ci-classify-paths.mjs\` matched these changed files, so **no browser suite exercised them** in this run:"
            echo
            while IFS= read -r changed; do
              if [ -n "$changed" ]; then
                echo "- \`$changed\`"
              fi
            done <<< "$UNCLASSIFIED_PATHS"
            echo
            echo "This is a report, not a failure. Much of what appears here is legitimately unclassified: server modules, repository scripts, other workflows. But if any file above IS covered by a journey suite, the predicate that should have matched it is too narrow -- widen it in \`scripts/ci-classify-paths.mjs\`, whose header records how each predicate was chosen and which misses shaped it."
          } >> "$GITHUB_STEP_SUMMARY"

          # GitHub decodes %XX inside an annotation message, so % is escaped
          # first and the newlines that make the list readable are escaped
          # after. A literal newline would truncate the annotation at line one.
          encoded="${UNCLASSIFIED_PATHS//\%/%25}"
          encoded="${encoded//$'\r'/%0D}"
          encoded="${encoded//$'\n'/%0A}"
          echo "::warning title=Unrecognised code surface::This diff touched code that no E2E predicate recognises, so no browser suite exercised it:%0A${encoded}%0A%0AIf that is wrong, the predicate in scripts/ci-classify-paths.mjs should be widened -- the file's header explains how. This is a report, not a gate."

      - name: Documentation-only fast path
        if: steps.changes.outputs.docs_only == 'true'
        run: |
          echo "Documentation-only change: entrypoint contracts passed; dependency, code, database, browser, and build gates are not applicable."

      - name: Install locked dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Type-check
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

      # `npm test` passes --testPathIgnorePatterns=\.pg\.test\.ts$, so the
      # ~105 embedded-Postgres migration suites are excluded here on purpose --
      # they do not belong on every pull request. They run in the step below
      # when the diff touches migration surface, and against merged `main` in
      # .github/workflows/pre-release-migrations.yml before a release operator
      # dispatches apply-migrations.
      - name: Run all fast regression tests
        if: steps.changes.outputs.docs_only != 'true'
        run: npm test

      # Covers this PR's own diff. It is not a release gate: it never runs for
      # a diff the classifier does not flag, and `test:migrations` is
      # fail-fast, so it stops at the first failure. pre-release-migrations.yml
      # is the gate that runs every suite against merged `main` and reports all
      # failures.
      - name: Run PostgreSQL migration suite
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.migrations == 'true'
        run: npm run test:migrations

      - name: Install Playwright browsers
        if: steps.changes.outputs.docs_only != 'true' && (steps.changes.outputs.board_e2e == 'true' || steps.changes.outputs.homepage_e2e == 'true' || steps.changes.outputs.coach_e2e == 'true' || steps.changes.outputs.athlete_e2e == 'true' || steps.changes.outputs.guardian_e2e == 'true' || steps.changes.outputs.golden_era_e2e == 'true' || steps.changes.outputs.activation_e2e == 'true')
        run: npx --workspace web playwright install --with-deps chromium

      - name: Run board governance E2E
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.board_e2e == 'true'
        run: npm --workspace web run test:e2e:board

      - name: Run public homepage E2E
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.homepage_e2e == 'true'
        run: npm --workspace web run test:e2e:homepage

      # The three signed-in journeys. Conditional on the same classifier the
      # two suites above use, in the same shape: each runs when the surfaces
      # it covers move, not on every PR. They stub the pilot API at the
      # network boundary and need no database, so they add no service to this
      # job -- only the Chromium already installed above.
      - name: Run coach journey E2E
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.coach_e2e == 'true'
        run: npm --workspace web run test:e2e:coach

      - name: Run athlete journey E2E
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.athlete_e2e == 'true'
        run: npm --workspace web run test:e2e:athlete

      - name: Run guardian journey E2E
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.guardian_e2e == 'true'
        run: npm --workspace web run test:e2e:guardian

      - name: Run activation journey E2E
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.activation_e2e == 'true'
        run: npm --workspace web run test:e2e:activation

      # The golden-era resolved-style proofs. Same shape as the five suites
      # above and needing no database either -- but the reason it is its own
      # flag rather than a widening of homepage_e2e is worth stating: a change
      # to design-system/current/ppbf-golden-era.css must run EVERY scope
      # proof. That file declares the bronze ramp for eight scope classes, and
      # only one of them (`.ge-bell`) is proven by the homepage suite, so
      # before this step a regression on the other seven shipped with its proof
      # unexecuted.
      #
      # One of the eight, `.ge-locker` on /athlete/dashboard, is server-guarded
      # (requirePageRole -> Postgres) and skips itself with a stated reason
      # where no database is present, which includes this job. It is written to
      # run unchanged wherever one is.
      - name: Run golden-era scope proofs E2E
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.golden_era_e2e == 'true'
        run: npm --workspace web run test:e2e:golden-era

      - name: Build production application
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run build
