name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run all fast regression tests
        run: npm test

      # Each .pg suite runs in its own Jest process (see the test:migrations:*
      # scripts). They spin up separate embedded Postgres instances and load
      # ESM-only modules through a native dynamic import; sharing one process
      # made a suite's import resolve after another suite's environment had been
      # torn down. --runInBand is therefore implicit -- each invocation runs a
      # single file -- so no extra flags are passed through here.
      - name: Run PostgreSQL migration suite
        run: npm run test:migrations

      - name: Install Playwright browsers
        run: npx --workspace web playwright install --with-deps chromium

      - name: Run board governance E2E
        run: npm --workspace web run test:e2e:board

      # The public entry points, plus a pixel baseline on the masthead. This
      # spec existed and ran nowhere, so nothing checked that the homepage stays
      # reachable signed-out, that no password field creeps onto it, or that
      # protected routes still redirect.
      #
      # The baseline covers the hero rather than the full page on purpose. This
      # runner pins Chrome for Testing 149 and other environments pin other
      # revisions; shaping differences move wrap points, so the prose sections
      # come out 23-38px taller here and a fullPage baseline fails on image
      # DIMENSIONS before the pixel tolerance is ever consulted. The hero
      # measured identically in both, so it is the part that can actually be
      # asserted. Whole-page coverage needs one pinned browser revision for
      # recording and asserting alike, which is a container change.
      - name: Run public homepage E2E
        run: npm --workspace web run test:e2e:homepage

      - name: Build production application
        run: npm run build
