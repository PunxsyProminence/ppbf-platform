name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed surface
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base="$BASE_SHA"
          head="$HEAD_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}^" 2>/dev/null || git rev-list --max-parents=0 "$head")"
          fi

          git diff --name-only "$base" "$head" > /tmp/changed-files.txt
          echo "Changed files:"
          cat /tmp/changed-files.txt

          docs_only=true
          if grep -Ev '(^docs/|\.md$)' /tmp/changed-files.txt | grep -q .; then
            docs_only=false
          fi

          migrations=false
          if grep -Eq '^(infra/azure/|apps/web/src/server/pilot/|apps/web/scripts/pilot-|apps/web/package\.json$|package\.json$|\.github/workflows/apply-migrations\.yml$)' /tmp/changed-files.txt; then
            migrations=true
          fi

          board_e2e=false
          if grep -Eq '^(apps/web/app/board/|apps/web/app/api/pilot/board/|apps/web/components/[^/]*Board|apps/web/components/roleSession|apps/web/src/shared/pilotRoleRouting|apps/web/src/server/pilot/(auth|board))' /tmp/changed-files.txt; then
            board_e2e=true
          fi

          homepage_e2e=false
          if grep -Eq '^(apps/web/app/page\.|apps/web/app/globals\.css$|apps/web/components/[^/]*(Home|Landing|Public)|design-system/|apps/web/components/roleSession|apps/web/src/shared/pilotRoleRouting)' /tmp/changed-files.txt; then
            homepage_e2e=true
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "board_e2e=$board_e2e" >> "$GITHUB_OUTPUT"
          echo "homepage_e2e=$homepage_e2e" >> "$GITHUB_OUTPUT"

          {
            echo "### CI surface classification"
            echo "- docs only: $docs_only"
            echo "- PostgreSQL migration suite: $migrations"
            echo "- board E2E: $board_e2e"
            echo "- homepage E2E: $homepage_e2e"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Documentation-only fast path
        if: steps.changes.outputs.docs_only == 'true'
        run: |
          echo "Documentation-only change: code, database, browser, and build gates are not applicable."

      - name: Set up Node
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Type-check
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

      - name: Run all fast regression tests
        if: steps.changes.outputs.docs_only != 'true'
        run: npm test

      # Persistence/schema tests are expensive because each .pg suite starts an
      # isolated embedded Postgres process. Run them when the diff can affect the
      # pilot persistence surface, SQL, migration runners, or package wiring.
      # The release/deploy path still performs its independent schema checks.
      - name: Run PostgreSQL migration suite
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.migrations == 'true'
        run: npm run test:migrations

      - name: Install Playwright browsers
        if: steps.changes.outputs.docs_only != 'true' && (steps.changes.outputs.board_e2e == 'true' || steps.changes.outputs.homepage_e2e == 'true')
        run: npx --workspace web playwright install --with-deps chromium

      - name: Run board governance E2E
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.board_e2e == 'true'
        run: npm --workspace web run test:e2e:board

      - name: Run public homepage E2E
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.homepage_e2e == 'true'
        run: npm --workspace web run test:e2e:homepage

      - name: Build production application
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run build
