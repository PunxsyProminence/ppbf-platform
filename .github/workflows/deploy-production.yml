# ─────────────────────────────────────────────────────────────────────────
# Production deployment -- manual only, schema-before-code gated.
#
# This workflow deploys application code to the production Container App.
# It does NOT apply database migrations -- migrations are always a separate,
# manual step run against production before this workflow is ever dispatched.
#
# CORRECTED 2026-08-22. Step 1 below used to read: "Apply any pending schema
# migration(s) directly against production PostgreSQL (e.g.
# `npm run pilot:apply-multiorg`, then `npm run pilot:apply-session-expiry`)".
# That instruction was wrong twice over. It described the exact practice
# apply-migrations.yml exists to end -- its own header opens "applying a
# migration meant running `npm run pilot:apply-*` from someone's laptop with a
# production connection string in their shell" -- and the literal commands do
# not resolve at the repository root anyway: the ~98 `pilot:apply-*` scripts
# live in apps/web/package.json, and the migration workflow is what runs them.
#
# Safe rollout order (see PR #13 for the concrete session-expiry example):
#   1. Apply any pending schema migration(s) through
#      .github/workflows/apply-migrations.yml -- STAGING FIRST, then production,
#      and confirm each run's output. That workflow runs the same runner scripts
#      under the same Azure OIDC identity and reads the connection string from
#      the Container App secret, so no production connection string ever reaches
#      a laptop. It is dispatch-only, `confirm_target` must match the chosen
#      target exactly, and it declares `environment:` so the same production
#      protection rule that gates this deploy gates the schema change too.
#   2. Only once every migration the target commit depends on has been
#      applied and confirmed: dispatch this workflow, supplying the exact
#      commit SHA you intend to deploy and confirming migrations are done.
#   3. Deploying application code before its required migration is applied
#      is unsafe -- e.g. code that selects/filters on a column the schema
#      doesn't have yet will fail every request. This workflow cannot verify
#      your migration was actually applied; the `migrations_complete` input
#      is an attestation from the operator dispatching it, not a check
#      against the database. Do not type CONFIRMED unless it's true.
# ─────────────────────────────────────────────────────────────────────────

name: deploy-production

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Full commit SHA on main you intend to deploy (must exactly match the checked-out commit)"
        required: true
        type: string
      release_digest:
        description: "Immutable image digest captured from staging (sha256:...)"
        required: true
        type: string
      migrations_complete:
        description: "Type CONFIRMED to attest all database migrations this commit depends on are already applied to production"
        required: true
        type: string
      allow_rollback:
        description: "Deploying a commit OLDER than what production runs? Choose YES. Leave NO otherwise."
        required: false
        default: "NO"
        type: choice
        options:
          - "NO"
          - "YES"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production-main
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Verify running from main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow may only be dispatched from refs/heads/main (got '${{ github.ref }}')."
            exit 1
          fi

      - name: Verify supplied SHA matches the checked-out commit
        env:
          # Through the environment, never interpolated into the script.
          # confirm_sha, release_digest and migrations_complete are all
          # `type: string` -- free text, unconstrained -- and `${{ ... }}`
          # inside a `run:` block is substituted BEFORE the shell parses the
          # line, so a value containing a quote and a semicolon becomes
          # commands. This job runs before any validation, and the
          # build-and-deploy job below holds an Azure OIDC session and the
          # production connection string. Same reasoning as
          # migration-declaration.yml, which says it in full.
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
        run: |
          if [ -z "$CONFIRM_SHA" ]; then
            echo "::error::confirm_sha is empty. Re-running a previous run does not re-supply workflow_dispatch inputs -- dispatch a fresh run with confirm_sha=${{ github.sha }}."
            exit 1
          fi
          if [ "$CONFIRM_SHA" != "${{ github.sha }}" ]; then
            echo "::error::confirm_sha ('$CONFIRM_SHA') does not match the checked-out commit ('${{ github.sha }}'). Pass the full 40-character SHA. Refusing to deploy."
            exit 1
          fi

      - name: Verify migration confirmation
        env:
          MIGRATIONS_COMPLETE: ${{ inputs.migrations_complete }}
        run: |
          if [ "$MIGRATIONS_COMPLETE" != "CONFIRMED" ]; then
            echo "::error::migrations_complete must be exactly 'CONFIRMED'. Refusing to deploy."
            exit 1
          fi

      - name: Verify supplied release digest format
        env:
          RELEASE_DIGEST: ${{ inputs.release_digest }}
        run: |
          if ! printf '%s' "$RELEASE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::release_digest must be a sha256 digest captured from staging."
            exit 1
          fi

  build-and-deploy:
    needs: guard
    runs-on: ubuntu-latest
    # Binds this job to the GitHub `production` environment, so its protection
    # rules apply. apply-migrations.yml has always declared one (its target
    # name); this workflow did not, which meant a required-reviewer rule on
    # `production` gated schema changes while leaving the code deploy itself
    # ungated -- the asymmetry every audit pass flagged.
    #
    # OIDC note, learned the hard way: declaring an environment CHANGES the
    # token subject from `repo:<org>/<repo>:ref:refs/heads/main` to
    # `repo:<org>/<repo>:environment:production`. A federated credential for
    # that exact subject must exist on the app behind AZURE_CLIENT_ID or
    # login fails with AADSTS700213 (which is how the first production
    # apply-migrations run died on 2026-07-30). Verified present before this
    # change: the identity carries BOTH `github-main` (ref) and
    # `github-production-env` (environment) credentials, and both workflows
    # use the same AZURE_CLIENT_ID secret.
    environment: production
    env:
      ACR_NAME: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
      ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io
      # No fallback. This previously defaulted to the STAGING resource group,
      # so an unset secret pointed every production step -- the digest and SHA
      # guards, the image update, the post-deploy verification -- at staging,
      # and each one passed while reporting production. A wrong-environment
      # deploy that announces success is worse than one that refuses, so the
      # value is required and the job fails without it.
      RESOURCE_GROUP: ${{ secrets.AZURE_PRODUCTION_RESOURCE_GROUP }}
      CONTAINER_APP_NAME: app-ppbf-production
    steps:
      # Full history: the rollback guard below asks whether the commit being
      # deployed is an ANCESTOR of the one production already runs, and the
      # default shallow clone cannot answer that.
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same deliberate refusal as apply-migrations / seed-reference-data /
      # check-database (the #601 model). An empty RESOURCE_GROUP already fails
      # closed here -- every consumer is an az call that errors on an empty
      # `-g` -- but it fails late (after checkout, npm ci and the Azure login)
      # and with a generic az error instead of naming the missing secret. Say
      # it plainly, before spending anything.
      - name: Resolve Production Resource Group
        run: |
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::secrets.AZURE_PRODUCTION_RESOURCE_GROUP is not set. Refusing to guess a resource group for a production operation."
            exit 1
          fi
          echo "Production resource group is configured."

      - name: Authenticate via Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ─────────────────────────────────────────────────────────────────────
      # Check the attestation instead of trusting it.
      #
      # `migrations_complete` is the only gate here nothing verifies, and the
      # header of this file says so outright. It has now been attested ahead of
      # the migration twice in two days -- and on 2026-08-07 a production deploy
      # SUCCEEDED that way, shipping code whose audit constraint had not been
      # widened. Nothing broke only because the endpoint that needed it was
      # already failing for the same reason.
      #
      # This reads the schema objects the migrations in THIS commit create and
      # asserts each exists in production. It is read-only: no DDL, no rows, and
      # the output names schema objects only.
      #
      # Deliberately placed before the image checks, so a deploy that would have
      # landed on a stale schema stops as early as possible.
      # ─────────────────────────────────────────────────────────────────────
      - name: Set up Node For The Schema Check
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      - name: Verify Production Schema Matches This Commit
        run: |
          CONN="$(az containerapp secret show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-postgres-connection-string \
            --query value -o tsv)"
          test -n "$CONN"
          echo "::add-mask::$CONN"
          if ! AZURE_POSTGRES_CONNECTION_STRING="$CONN" node apps/web/scripts/pilot-verify-schema.mjs; then
            echo "::error::Production is missing schema objects this commit expects. Run apply-migrations against production first. migrations_complete=CONFIRMED was not true."
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────────
      # The digest must exist AND have been built from this commit.
      #
      # confirm_sha and release_digest arrive as two independent strings, and
      # until now nothing tied them together: the SHA gate proved confirm_sha
      # matched the checked-out commit, and this step proved the digest existed
      # somewhere in the repository. A transposed pair -- today's SHA with
      # yesterday's digest, or the reverse -- satisfied both and deployed the
      # wrong image under the right name. Worse, PPBF_RELEASE_SHA is stamped
      # onto the app from confirm_sha below, so the mismatch would be recorded
      # as fact and the rollback guard would trust it forever after.
      #
      # Nothing new has to be built to close this. deploy-staging already tags
      # every image it pushes `ppbf-frontend:<github.sha>`, so the mapping from
      # commit to digest is already in the registry. This asserts it: the
      # manifest at release_digest must carry a tag equal to confirm_sha.
      #
      # One operational note, so a future failure is not a mystery: this depends
      # on that tag still existing. If ACR retention is ever configured to purge
      # old tags, an otherwise-legitimate rollback to a purged commit will stop
      # here. That is the safe direction to fail, and the error says what to
      # check -- but the fix then is the retention policy, not this gate.
      # ─────────────────────────────────────────────────────────────────────
      - name: Verify release digest exists in ACR and was built from this commit
        env:
          RELEASE_DIGEST: ${{ inputs.release_digest }}
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
        run: |
          set -euo pipefail

          MANIFEST="$(az acr repository show-manifests \
            --name "$ACR_NAME" --repository ppbf-frontend \
            --query "[?digest=='${RELEASE_DIGEST}'] | [0]" -o json)"

          MANIFEST_DIGEST="$(printf '%s' "$MANIFEST" | jq -r '.digest // empty')"
          if [ "$MANIFEST_DIGEST" != "$RELEASE_DIGEST" ]; then
            echo "::error::release digest '$RELEASE_DIGEST' was not found in ACR for ppbf-frontend."
            exit 1
          fi

          if ! printf '%s' "$MANIFEST" | jq -e --arg sha "$CONFIRM_SHA" '(.tags // []) | index($sha)' >/dev/null; then
            echo "::error::PROVENANCE MISMATCH. The image at ${RELEASE_DIGEST} does not carry the tag ${CONFIRM_SHA}, so it was not built from the commit this run is deploying."
            echo "::error::Tags actually on that manifest: $(printf '%s' "$MANIFEST" | jq -rc '.tags // []')"
            echo "::error::Most likely the SHA and the digest came from different staging runs. Take both from the SAME deploy-staging run: confirm_sha is that run's head, release_digest is the value its 'Report Release Digest Last' step printed."
            exit 1
          fi

          echo "Digest ${RELEASE_DIGEST} carries tag ${CONFIRM_SHA} -- built from this commit."

      # ─────────────────────────────────────────────────────────────────────
      # Refuse a rollback nobody asked for.
      #
      # WHY THIS EXISTS. On 2026-08-03 two production promotions sat at the
      # approval gate at once: a fresh one carrying thirteen fixes, and a stale
      # one dispatched five hours earlier for an older commit. Both were
      # approved within two minutes of each other. The stale one ran FIRST and
      # repointed production at the older image; the newer one happened to land
      # ninety seconds later and won. Had the clicks landed the other way round,
      # production would have been serving a build from before every fix -- a
      # dead drill library, an open child-account boundary, DDL back on the
      # login path -- and NOTHING would have said so, because in the run list a
      # successful rollback is indistinguishable from a successful deploy.
      #
      # `confirm_sha` did not help and could not: it compares the input against
      # the commit this workflow checked out, so a stale run whose SHA is
      # internally consistent passes cleanly. Nothing compared what was being
      # deployed against what was already running.
      #
      # WHAT THIS CHECKS. Two independent questions, because either alone has a
      # blind spot:
      #
      #   1. Is the incoming commit an ANCESTOR of the one production runs?
      #      That is the precise definition of "older" for a linear history,
      #      and it is what catches the case above.
      #   2. Failing that -- if the app carries no recorded SHA yet, or the two
      #      commits are on unrelated branches -- is the incoming IMAGE the one
      #      already deployed? Then this is a harmless re-apply and says so.
      #
      # A deliberate rollback is a legitimate emergency action, so this refuses
      # rather than forbids: dispatch again with allow_rollback=YES.
      # ─────────────────────────────────────────────────────────────────────
      - name: Refuse a Rollback Nobody Asked For
        env:
          INCOMING_SHA: ${{ inputs.confirm_sha }}
          INCOMING_DIGEST: ${{ inputs.release_digest }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
        run: |
          set -euo pipefail

          RUNNING_IMAGE="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv)"
          RUNNING_DIGEST="${RUNNING_IMAGE##*@}"

          # Recorded by this workflow on every deploy (see --set-env-vars
          # below). Absent only on an app that has not been deployed since this
          # guard shipped.
          #
          # THE `|| true` THAT USED TO BE HERE DISARMED THIS GUARD. It turned
          # every az failure -- a throttled call, a transient 5xx, an expired
          # token, a wrong resource group -- into an empty RUNNING_SHA, which
          # falls into the `-z` branch below and exits 0 with a warning. So the
          # ancestry check that exists because of the 2026-08-03 double-approval
          # incident was contingent on one unrelated az call succeeding, and the
          # stale-run failure mode it was written to catch is exactly the one it
          # would have skipped.
          #
          # az distinguishes the two cases cleanly: a JMESPath that matches
          # nothing exits 0 with empty output, while a call that FAILS exits
          # non-zero. So "not recorded" stays a warning and "could not ask"
          # becomes a refusal.
          if ! RUNNING_SHA="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='PPBF_RELEASE_SHA'].value | [0]" \
            -o tsv 2>/dev/null)"; then
            echo "::error::Could not read PPBF_RELEASE_SHA from ${CONTAINER_APP_NAME}. The" \
                 "rollback guard cannot run without it, and skipping it silently is how a" \
                 "stale deploy gets promoted. Re-run; if it persists, check the Azure" \
                 "credentials and resource group before deploying."
            exit 1
          fi

          echo "running digest : ${RUNNING_DIGEST:-<none>}"
          echo "incoming digest: ${INCOMING_DIGEST}"
          echo "running commit : ${RUNNING_SHA:-<not recorded>}"
          echo "incoming commit: ${INCOMING_SHA}"

          if [ "$RUNNING_DIGEST" = "$INCOMING_DIGEST" ]; then
            echo "Same image already running. This is a re-apply, not a change."
            exit 0
          fi

          if [ -z "$RUNNING_SHA" ]; then
            echo "::warning::Production carries no PPBF_RELEASE_SHA, so this deploy cannot be" \
                 "checked for being older than what is running. It will be recorded from now on."
            exit 0
          fi

          if ! git cat-file -e "${RUNNING_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::The commit production runs (${RUNNING_SHA}) is not in this" \
                 "repository's history -- force-push, or an image built elsewhere. Ancestry" \
                 "cannot be checked; proceeding on the digest comparison alone."
            exit 0
          fi

          if [ "$RUNNING_SHA" = "$INCOMING_SHA" ]; then
            echo "Same commit, different image -- a rebuild of what is already live. Allowed."
            exit 0
          fi

          if git merge-base --is-ancestor "$INCOMING_SHA" "$RUNNING_SHA"; then
            if [ "$ALLOW_ROLLBACK" = "YES" ]; then
              echo "::warning::ROLLBACK: ${INCOMING_SHA} is an ancestor of the running" \
                   "${RUNNING_SHA}. Proceeding because allow_rollback=YES."
              exit 0
            fi
            echo "::error::REFUSING A SILENT ROLLBACK."
            echo "::error::Production runs ${RUNNING_SHA}. This run would deploy ${INCOMING_SHA}," \
                 "which is an ANCESTOR of it -- every change between the two would be reverted."
            echo "::error::If that is what you want, dispatch again with allow_rollback=YES."
            echo "::error::If it is not, this is probably a stale dispatch that has been sitting" \
                 "at the approval gate while newer work shipped. Cancel it."
            exit 1
          fi

          echo "Incoming commit is not an ancestor of what is running. Proceeding."

      # This deploy is digest-only: deploy-staging builds and pushes the image,
      # and this workflow just repoints the production Container App at an
      # already-tested digest. So it needs the ACR *control* plane only.
      #
      # It previously ran `az acr login` and azure/container-apps-deploy-action@v1,
      # and that action performs its own nested `docker login` against
      # <acr>.azurecr.io. For a digest-only deploy that data-plane login buys
      # nothing, and it is a real failure surface -- on 2026-07-29 it failed a
      # production deploy outright with:
      #   Error response from daemon: Get "https://<acr>.azurecr.io/v2/":
      #   dial tcp 20.62.128.7:443: connect: connection refused
      # while every `az` control-plane call in the very same run succeeded. The
      # registry has publicNetworkAccess=Enabled on the Basic SKU, which cannot
      # carry network rules at all, so that was tier throughput and not an
      # access rule -- retrying the same dispatch went green minutes later.
      #
      # The Container App holds its own ACR pull credentials
      # (properties.configuration.registries[].passwordSecretRef), so it pulls
      # the digest itself and the runner never touches the registry data plane.
      # deploy-staging.yml already updates its app this way.
      #
      # --set-env-vars updates the listed variables and leaves the rest in
      # place; it cannot unset a stale value already on the app.
      #
      # PPBF_SHADOW_MAX_COMPLETION_TOKENS was 4096 here while staging ran 8192,
      # and 4096 is below what a reasoning deployment actually spends on a
      # demanding prompt. Completion tokens measured 2026-07-29
      # (shadowRouter.ts:31-35): luna 4110, mini 5168, sol 5579, gpt-5 6352 --
      # every one of them above 4096. Azure counts reasoning tokens against this
      # budget and returns HTTP 200 with finish_reason "length" and NO content
      # when it runs out, which this app reads as failure and answers with
      # DEGRADED_RESPONSE ("temporarily unavailable ... try again later"). So a
      # permanent misconfiguration was being shown to users as a transient
      # outage, on exactly the long-form questions SHADOW exists to answer.
      # Short prompts (measured 964-2054 tokens) fit in 4096 and were fine,
      # which is why this read as intermittent rather than broken.
      #
      # 8192 is the value staging has been exercising, and is also
      # MAX_COMPLETION_TOKENS_CEILING in the chat route -- so this aligns the two
      # environments rather than inventing a third number. Headroom is not
      # billed: charges follow tokens produced, not the budget.
      #
      # PPBF_SHADOW_PROVIDER_TIMEOUT_MS matches staging's 120000, which is also
      # DEFAULT_PROVIDER_TIMEOUT_MS in the chat route. Declaring it changes
      # nothing on an app that has never carried the variable -- it exists so a
      # stale value already set on the production app cannot survive a deploy,
      # which is the same reason every other variable here is stated.
      #
      # PPBF_SHADOW_WORKER_ENABLED is stated explicitly (set-env-vars cannot
      # unset, so every variable is declared). It was deliberately false until
      # staging demonstrated a full enqueue -> drain -> render cycle through
      # the E2E gate; that condition was met by run 30567888858 (2026-07-30,
      # SHA 7cfde83): gate step 14 enqueued a background Heavy Bag, the
      # instrumentation worker drained job 324e7a76, and the answer read back
      # through the sessions API as message 1497ba24 with matching citations
      # and evidence tier. (The first attempt, run 30563595088, is why the
      # staging-first rule exists: the claim statement had an ambiguous
      # RETURNING column that killed every drain tick, fixed in #89 and pinned
      # by test:migrations:job-queue.) The worker carries no super-identity --
      # per-job authority is re-validated against the enqueuing actor at
      # execution time -- so enabling it grants no new access.
      #
      # PPBF_INTAKE_PROMOTION_ENABLED is now TRUE. The condition this line
      # carried -- "flips only after the staging gate has run the full intake
      # path green" -- was met on 2026-08-03 by deploy-staging run
      # 30820241108 against SHA 876cdb4, dispatched with enable_shadow_gate
      # specifically to test it rather than assumed from an older run.
      #
      # The gate did not merely touch intake, it walked the whole path and
      # reported GATE PASS: step 4 reviewed each document and approved the
      # case, step 5 promoted it to domain records + accounts + linkage,
      # step 9b activated the promoted athlete through the real admin flow,
      # and step 10 verified that athlete could then sign in and be read back.
      # That is the sequence an organization admin performs at the gym, end to
      # end, against a real staging database.
      #
      # Turned on at the owner's explicit instruction (2026-08-03), for the
      # pilot: without it, an approved intake case cannot become an athlete
      # record, and the waiver that promotion files alongside it never gets
      # written -- so consent arrives, if at all, as a separate act somebody
      # has to remember.
      #
      # What it does NOT loosen, all still enforced in
      # app/api/pilot/intake/review-action/route.ts:
      #   - automation_mode 'automatic' is refused outright; a person promotes
      #   - only organization_admin may promote, never Omega and never a coach
      #   - the case must already be 'approved'
      #   - the athlete account is provisioned with NO credential and inactive;
      #     the PIN is set afterwards through pin-reset mode 'activate'
      #   - athlete.pin and guardian.pin are both refused rather than silently
      #     discarded, which is how an admin used to believe a credential was
      #     set that never was
      #
      # PPBF_VIDEO_CONTENT_SCAN enables the video scan sweep's content gate
      # (#49) -- the only thing in the platform that moves an upload off
      # 'quarantined'. Without it, production video uploads succeed and then
      # sit in a state every reader refuses, which is precisely the dead end
      # #147 was written to close.
      #
      # Staging first, then here, same as every flag above. The staging
      # evidence is a real upload rather than a fixture: video session
      # ce5843d0-d619-45e6-8267-4fde9cf29cb0 ("Neeko fight", 17.3MB, uploaded
      # by an organization_admin) sat quarantined from 01:19:42Z with nothing
      # able to promote it, and after deploy run 30679936999 put the sweep in
      # front of it, event video.scan_settled recorded decision=promote,
      # reason=ALL_GATES_PASSED, gates_passed=["content"], status=ready at
      # 02:29:39Z -- roughly one minute after the revision took traffic.
      #
      # Enabled on the owner's explicit instruction (2026-08-01), on the
      # stated basis that no athlete footage reaches production until the
      # platform is in live use at the gym. So this turns the gate on BEFORE
      # any minor's video exists in production, rather than applying a new
      # automated decision to footage already sitting there. That ordering is
      # the whole reason it is defensible on a single staging observation.
      #
      # AZURE_AI_VISION_DEPLOYMENT_NAME above is what makes this gate real
      # here: with it unset the screen cannot run, returns no verdict, and
      # every upload stays quarantined. The two lines have to move together.
      #
      # PPBF_VIDEO_MALWARE_SCAN is deliberately NOT set, in either
      # environment. It reads a verdict Microsoft Defender for Storage writes
      # onto the blob as an index tag, and whether malware scanning is enabled
      # on the storage account is an Azure setting this repository cannot see.
      # Enabling the gate without the scanner behind it would strand every
      # upload in retry until it timed out into human review, and would record
      # "malware" among the gates for videos nothing scanned. Set it to
      # defender_index_tags only after confirming Defender for Storage malware
      # scanning is on for the account behind AZURE_STORAGE_CONNECTION_STRING.
      #
      # PPBF_APP_ORIGIN is the origin magic-link sign-in emails are built
      # against. Not a secret -- it is the public address of production -- so
      # it is a var, and the deploy refuses to run without it.
      #
      # It has to be caught here because it cannot be caught in production.
      # magicLinkStore.ts throws MISSING_PPBF_APP_ORIGIN, and the request
      # route swallows every issue failure deliberately, so that the endpoint
      # cannot be used to ask whether an address belongs to a family at this
      # gym. That silence is the right trade for a youth roster, and its cost
      # is exactly this: with the origin unset, every parent is told a link is
      # on the way and no link is ever sent. Guardian sign-in is the only way
      # a parent reaches the platform at all, so this fails the deploy rather
      # than shipping a login that is quietly one hundred percent broken.
      # ─────────────────────────────────────────────────────────────────────
      # Validate Production AI Configuration
      #
      # deploy-staging.yml has a "Validate Staging AI Configuration" step that
      # checks these same three names before every staging deploy; this
      # workflow sourced them as unvalidated secretrefs with no equivalent
      # check, so a bad value in the azure-ai-* secrets would sail straight
      # into production. This step closes that gap the same way "Verify
      # Production Schema Matches This Commit" above reads a secret before
      # trusting it: resolve the actual value from the Container App's secret
      # store and check it before it is ever handed to `az containerapp
      # update`.
      #
      # Endpoint and API version are asserted EXACTLY, same as staging: this
      # platform is verified against exactly one Azure OpenAI resource
      # (shadow-ai) and exactly one API version, and a wrong value here would
      # silently send every SHADOW turn in production to an endpoint or API
      # surface nobody tested.
      #
      # Deployment name is deliberately NOT checked against staging's
      # whitelist (gpt-5.6-luna-shadow, gpt-5-mini-shadow). Those are
      # staging's current quick-tier names (shadowRouter.ts MODEL_REGISTRY);
      # nothing in this tree -- no doc, no PRODUCTION_STATE.json entry, no
      # workflow log -- records what production's azure-ai-deployment-name
      # secret is actually set to, and it is read here as a secretref
      # specifically because this workflow has never been able to see it.
      # Guessing a whitelist for a production gate is worse than not having
      # one: a wrong guess would refuse a legitimate value on every future
      # deploy until someone diagnosed why. So this checks non-empty plus a
      # generic Azure-deployment-name shape only.
      #
      # KNOWN LIMITATION (see PR body): once an owner confirms production's
      # real allowed deployment name(s), replace the shape check below with
      # an exact whitelist, matching the staging step.
      # ─────────────────────────────────────────────────────────────────────
      - name: Validate Production AI Configuration
        run: |
          AI_ENDPOINT="$(az containerapp secret show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-ai-endpoint \
            --query value -o tsv)"
          AI_DEPLOYMENT_NAME="$(az containerapp secret show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-ai-deployment-name \
            --query value -o tsv)"
          AI_API_VERSION="$(az containerapp secret show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secret-name azure-ai-api-version \
            --query value -o tsv)"

          test -n "$AI_ENDPOINT"
          test -n "$AI_DEPLOYMENT_NAME"
          test -n "$AI_API_VERSION"

          case "$AI_ENDPOINT" in
            https://shadow-ai.cognitiveservices.azure.com|https://shadow-ai.cognitiveservices.azure.com/) ;;
            *) echo "azure-ai-endpoint '$AI_ENDPOINT' is not the approved SHADOW endpoint."; exit 1 ;;
          esac

          if [ "$AI_API_VERSION" != "2024-12-01-preview" ]; then
            echo "azure-ai-api-version is '$AI_API_VERSION', expected '2024-12-01-preview'."
            exit 1
          fi

          # Sane-format check only -- see the comment above this step for why
          # this is not an exact whitelist like staging's.
          if ! printf '%s' "$AI_DEPLOYMENT_NAME" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$'; then
            echo "azure-ai-deployment-name '$AI_DEPLOYMENT_NAME' does not look like a plausible Azure OpenAI deployment name."
            exit 1
          fi

      - name: Deploy Tested Digest to Azure Container App (Production)
        env:
          PPBF_APP_ORIGIN: ${{ vars.PPBF_APP_ORIGIN }}
          # Free-text dispatch inputs reach the shell through the environment,
          # never by interpolation. The guard job has already checked both by
          # the time this runs, so this is defence in depth -- but a guard that
          # is reordered, weakened or skipped must not silently re-open a
          # command-injection path into a step holding an Azure OIDC session.
          RELEASE_DIGEST: ${{ inputs.release_digest }}
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
        run: |
          if [ -z "$PPBF_APP_ORIGIN" ]; then
            echo "Required production variable 'PPBF_APP_ORIGIN' is not configured."
            echo "Magic-link sign-in silently sends nothing without it. Set the"
            echo "repository or environment variable and re-run."
            exit 1
          fi

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_LOGIN_SERVER}/ppbf-frontend@${RELEASE_DIGEST}" \
            --set-env-vars \
              PPBF_RELEASE_SHA="$CONFIRM_SHA" \
              AZURE_POSTGRES_CONNECTION_STRING=secretref:azure-postgres-connection-string \
              AZURE_STORAGE_CONNECTION_STRING=secretref:azure-storage-connection-string \
              PPBF_MS_TENANT_ID=secretref:ppbf-ms-tenant-id \
              PPBF_MS_CLIENT_ID=secretref:ppbf-ms-client-id \
              PPBF_MS_CLIENT_SECRET=secretref:ppbf-ms-client-secret \
              PPBF_MS_REDIRECT_URI=secretref:ppbf-ms-redirect-uri \
              PPBF_MS_POST_LOGIN_PATH=secretref:ppbf-ms-post-login-path \
              PPBF_APP_ORIGIN="$PPBF_APP_ORIGIN" \
              PPBF_PILOT_BOOTSTRAP_KEY=secretref:ppbf-pilot-bootstrap-key \
              PPBF_PILOT_DEFAULT_ORG_ID=secretref:ppbf-pilot-default-org-id \
              PPBF_PILOT_SHADOW_CONTAINER=secretref:ppbf-pilot-shadow-container \
              PPBF_PRIMARY_OWNER_EMAIL=secretref:ppbf-primary-owner-email \
              AZURE_AI_ENDPOINT=secretref:azure-ai-endpoint \
              AZURE_AI_DEPLOYMENT_NAME=secretref:azure-ai-deployment-name \
              AZURE_AI_API_VERSION=secretref:azure-ai-api-version \
              AZURE_AI_KEY=secretref:azure-ai-key \
              PPBF_SHADOW_MAX_COMPLETION_TOKENS=8192 \
              PPBF_SHADOW_PROVIDER_TIMEOUT_MS=120000 \
              PPBF_SHADOW_WORKER_ENABLED=true \
              PPBF_INTAKE_PROMOTION_ENABLED=true \
              AZURE_AI_EMBEDDING_DEPLOYMENT_NAME=text-embedding-3-small \
              AZURE_AI_VISION_DEPLOYMENT_NAME=gpt-5-vision-shadow \
              PPBF_VIDEO_CONTENT_SCAN=vision \
              PPBF_DURABLE_RATE_LIMIT=true

      # `az containerapp update` returns when the new revision is CREATED, not
      # when it is serving. Staging learned this on run 30503641552 (its checks
      # reached the PREVIOUS revision) and grew a wait step; production's smoke
      # checks below are revision-generic 400/200/401 probes, so without this
      # wait a new revision that never starts would leave the old one serving,
      # the probes would pass against it, and the run would report a deploy
      # that did not happen. Wait until the latest revision is Running with
      # 100% of traffic -- and first assert that revision actually carries the
      # digest this run promoted, so the thing being waited on is OUR deploy,
      # not whatever revision happens to be latest.
      - name: Wait For Promoted Revision To Take Traffic
        env:
          RELEASE_DIGEST: ${{ inputs.release_digest }}
        run: |
          LATEST="$(az containerapp show --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.latestRevisionName -o tsv)"
          test -n "$LATEST"
          REVISION_IMAGE="$(az containerapp revision show --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" --revision "$LATEST" \
            --query "properties.template.containers[0].image" -o tsv)"
          echo "Latest revision $LATEST runs image $REVISION_IMAGE"
          case "$REVISION_IMAGE" in
            *"@$RELEASE_DIGEST") ;;
            *)
              echo "::error::Latest revision $LATEST does not carry the promoted digest $RELEASE_DIGEST. The update did not produce the expected revision."
              exit 1
              ;;
          esac
          for i in $(seq 1 60); do
            READ="$(az containerapp revision show --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" --revision "$LATEST" \
              --query "[properties.runningState, properties.trafficWeight]" -o tsv | tr '\n' ' ')"
            echo "  $i: $READ"
            case "$READ" in
              "Running 100"*) exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::Revision $LATEST did not reach Running/100% traffic within 5 minutes."
          exit 1

      - name: Resolve Production Base URL
        run: |
          FQDN="$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          test -n "$FQDN"
          echo "PROD_BASE_URL=https://$FQDN" >> "$GITHUB_ENV"

      - name: Pilot API Smoke Checks
        run: |
          set -euo pipefail

          LOGIN_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$PROD_BASE_URL/api/pilot/auth/login" -H "Content-Type: application/json" -d '{}')"
          if [ "$LOGIN_STATUS" != "400" ]; then
            echo "Expected /api/pilot/auth/login to return 400 for empty payload, got $LOGIN_STATUS"
            exit 1
          fi

          SESSION_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$PROD_BASE_URL/api/pilot/auth/session" -H "Content-Type: application/json" -d '{}')"
          if [ "$SESSION_STATUS" != "200" ]; then
            echo "Expected /api/pilot/auth/session to return 200, got $SESSION_STATUS"
            exit 1
          fi

          SHADOW_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$PROD_BASE_URL/api/pilot/shadow/events" -H "Content-Type: application/json" -d '{}')"
          if [ "$SHADOW_STATUS" != "401" ]; then
            echo "Expected /api/pilot/shadow/events to return 401 without auth, got $SHADOW_STATUS"
            exit 1
          fi

          echo "Production smoke checks passed."
