<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPBF Platform - Coach Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">Coach Review Queue</h1>
        
        <div id="reviews" class="space-y-4"></div>
    </div>

    <script>
        let reviews = [
            {
                id: 1,
                athlete: "Marcus Thompson",
                date: "2026-06-24",
                intensity: 8,
                reflections: "Strong session on hooks and footwork today.",
                status: "pending",
                redFlags: []
            },
            {
                id: 2,
                athlete: "Jordan Lee",
                date: "2026-06-23",
                intensity: 9,
                reflections: "Heavy session. Left shoulder felt tight at the end.",
                status: "pending",
                redFlags: ["Shoulder discomfort"]
            }
        ];

        function render() {
            const container = document.getElementById('reviews');
            container.innerHTML = '';

            reviews.forEach(r => {
                const card = document.createElement('div');
                card.className = 'bg-white p-6 rounded-2xl border';
                
                let flagHTML = '';
                if (r.redFlags.length > 0) {
                    flagHTML = <div class="mt-3 text-sm text-red-600 font-medium">⚠️ Red Flags: </div>;
                }

                card.innerHTML = 
                    <div class="flex justify-between">
                        <div>
                            <div class="font-semibold text-xl"></div>
                            <div class="text-sm text-gray-500"> • Intensity: /10</div>
                        </div>
                        <div class="text-sm px-3 py-1 rounded-full ">
                            
                        </div>
                    </div>

                    <div class="mt-4">""</div>
                    

                    <div class="mt-6 flex gap-3">
                        <button onclick="decide(, 'approved')" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-semibold">Approve</button>
                        <button onclick="decide(, 'paused')" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-semibold">Pause / Escalate</button>
                    </div>
                ;
                container.appendChild(card);
            });
        }

        function decide(id, action) {
            const review = reviews.find(x => x.id === id);
            if (!review) return;

            if (review.redFlags.length > 0 && action === 'approved') {
                if (!confirm("This review has red flags. Approve anyway?")) return;
            }

            review.status = action;
            render();
        }

        render();
    </script>
</body>
</html>
