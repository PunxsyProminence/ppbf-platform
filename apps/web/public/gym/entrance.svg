<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 754" role="img" aria-label="Illustration of the gym entrance">
  <!-- Placeholder illustration, not a photograph. Drawn in the design system's
       own palette (ink / brass / bone) until somebody photographs the real
       front door at 220 N Jefferson St. Building only, no people. -->
  <rect width="1220" height="754" fill="#14100D"/>
  <!-- wall planks -->
  <g stroke="#2A1F18" stroke-width="3">
    <line x1="0" y1="94" x2="1220" y2="94"/><line x1="0" y1="188" x2="1220" y2="188"/>
    <line x1="0" y1="282" x2="1220" y2="282"/><line x1="0" y1="376" x2="1220" y2="376"/>
    <line x1="0" y1="470" x2="1220" y2="470"/><line x1="0" y1="564" x2="1220" y2="564"/>
  </g>
  <!-- stoop -->
  <rect x="380" y="640" width="460" height="22" fill="#1E1712" stroke="#3B2C21" stroke-width="3"/>
  <rect x="350" y="662" width="520" height="26" fill="#1E1712" stroke="#3B2C21" stroke-width="3"/>
  <!-- door frame -->
  <rect x="430" y="180" width="360" height="460" fill="#1E1712" stroke="#B8912F" stroke-width="5"/>
  <!-- transom -->
  <rect x="452" y="200" width="316" height="70" fill="#14100D" stroke="#6B4E12" stroke-width="3"/>
  <text x="610" y="246" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="40" letter-spacing="8" fill="#E8CE7A">PPBF</text>
  <!-- door leaf -->
  <rect x="452" y="286" width="316" height="354" fill="#2A1F18" stroke="#6B4E12" stroke-width="3"/>
  <rect x="478" y="310" width="264" height="140" fill="none" stroke="#4A3728" stroke-width="3"/>
  <rect x="478" y="472" width="264" height="140" fill="none" stroke="#4A3728" stroke-width="3"/>
  <circle cx="726" cy="460" r="9" fill="#B8912F"/>
  <!-- hanging sign -->
  <line x1="240" y1="120" x2="240" y2="170" stroke="#6B4E12" stroke-width="4"/>
  <line x1="360" y1="120" x2="360" y2="170" stroke="#6B4E12" stroke-width="4"/>
  <rect x="190" y="170" width="220" height="90" fill="#1E1712" stroke="#B8912F" stroke-width="4"/>
  <text x="300" y="208" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="24" letter-spacing="3" fill="#EFE6D0">BOXING</text>
  <text x="300" y="240" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="24" letter-spacing="3" fill="#EFE6D0">&amp; FITNESS</text>
  <!-- caged lamp over the door -->
  <line x1="610" y1="120" x2="610" y2="150" stroke="#46421F" stroke-width="4"/>
  <circle cx="610" cy="162" r="16" fill="#F2E2A8" opacity="0.85"/>
  <path d="M 594 162 a16 16 0 0 1 32 0 M 598 152 l 24 20 M 622 152 l -24 20" stroke="#46421F" stroke-width="2.5" fill="none"/>
  <!-- honest label -->
  <text x="1196" y="732" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#B5A688">PLACEHOLDER ILLUSTRATION</text>
</svg>
