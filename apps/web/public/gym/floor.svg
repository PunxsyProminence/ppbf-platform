<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 754" role="img" aria-label="Illustration of the training floor">
  <!-- Placeholder illustration, not a photograph. The main floor: boards in
       perspective, the ring standing in the back, caged lamps overhead.
       Building only, no people. -->
  <rect width="1220" height="754" fill="#14100D"/>
  <!-- back wall, brick courses -->
  <rect x="0" y="0" width="1220" height="420" fill="#1E1712"/>
  <g stroke="#2A1F18" stroke-width="2.5">
    <line x1="0" y1="60" x2="1220" y2="60"/><line x1="0" y1="120" x2="1220" y2="120"/>
    <line x1="0" y1="180" x2="1220" y2="180"/><line x1="0" y1="240" x2="1220" y2="240"/>
    <line x1="0" y1="300" x2="1220" y2="300"/><line x1="0" y1="360" x2="1220" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="60"/><line x1="360" y1="0" x2="360" y2="60"/><line x1="600" y1="0" x2="600" y2="60"/><line x1="840" y1="0" x2="840" y2="60"/><line x1="1080" y1="0" x2="1080" y2="60"/>
    <line x1="240" y1="60" x2="240" y2="120"/><line x1="480" y1="60" x2="480" y2="120"/><line x1="720" y1="60" x2="720" y2="120"/><line x1="960" y1="60" x2="960" y2="120"/>
    <line x1="120" y1="120" x2="120" y2="180"/><line x1="360" y1="120" x2="360" y2="180"/><line x1="600" y1="120" x2="600" y2="180"/><line x1="840" y1="120" x2="840" y2="180"/><line x1="1080" y1="120" x2="1080" y2="180"/>
    <line x1="240" y1="180" x2="240" y2="240"/><line x1="480" y1="180" x2="480" y2="240"/><line x1="720" y1="180" x2="720" y2="240"/><line x1="960" y1="180" x2="960" y2="240"/>
  </g>
  <!-- caged lamps -->
  <g>
    <line x1="300" y1="0" x2="300" y2="52" stroke="#46421F" stroke-width="4"/>
    <circle cx="300" cy="66" r="15" fill="#F2E2A8" opacity="0.8"/>
    <path d="M 285 66 a15 15 0 0 1 30 0 M 289 56 l 22 19 M 311 56 l -22 19" stroke="#46421F" stroke-width="2.5" fill="none"/>
    <line x1="920" y1="0" x2="920" y2="52" stroke="#46421F" stroke-width="4"/>
    <circle cx="920" cy="66" r="15" fill="#F2E2A8" opacity="0.8"/>
    <path d="M 905 66 a15 15 0 0 1 30 0 M 909 56 l 22 19 M 931 56 l -22 19" stroke="#46421F" stroke-width="2.5" fill="none"/>
  </g>
  <!-- the ring, at the back of the room -->
  <g>
    <rect x="700" y="330" width="420" height="16" fill="#2A1F18" stroke="#3B2C21" stroke-width="2"/>
    <line x1="710" y1="330" x2="710" y2="212" stroke="#B8912F" stroke-width="6"/>
    <line x1="1110" y1="330" x2="1110" y2="212" stroke="#B8912F" stroke-width="6"/>
    <line x1="710" y1="226" x2="1110" y2="226" stroke="#EFE6D0" stroke-width="3"/>
    <line x1="710" y1="262" x2="1110" y2="262" stroke="#EFE6D0" stroke-width="3"/>
    <line x1="710" y1="298" x2="1110" y2="298" stroke="#EFE6D0" stroke-width="3"/>
  </g>
  <!-- floorboards in perspective -->
  <g stroke="#3B2C21" stroke-width="3">
    <line x1="0" y1="420" x2="1220" y2="420"/>
    <line x1="0" y1="470" x2="1220" y2="470"/>
    <line x1="0" y1="540" x2="1220" y2="540"/>
    <line x1="0" y1="630" x2="1220" y2="630"/>
  </g>
  <g stroke="#2A1F18" stroke-width="3">
    <line x1="610" y1="420" x2="610" y2="754"/>
    <line x1="410" y1="420" x2="160" y2="754"/>
    <line x1="810" y1="420" x2="1060" y2="754"/>
    <line x1="210" y1="420" x2="-280" y2="754"/>
    <line x1="1010" y1="420" x2="1500" y2="754"/>
  </g>
  <!-- honest label -->
  <text x="1196" y="732" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#B5A688">PLACEHOLDER ILLUSTRATION</text>
