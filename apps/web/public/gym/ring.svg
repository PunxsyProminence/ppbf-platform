<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 754" role="img" aria-label="Illustration of the boxing ring">
  <!-- Placeholder illustration, not a photograph. The ring itself: posts,
       three ropes, turnbuckles, apron. Building only, no people. -->
  <rect width="1220" height="754" fill="#14100D"/>
  <g stroke="#1E1712" stroke-width="3">
    <line x1="0" y1="80" x2="1220" y2="80"/><line x1="0" y1="160" x2="1220" y2="160"/>
    <line x1="0" y1="240" x2="1220" y2="240"/>
  </g>
  <!-- apron / platform -->
  <rect x="120" y="560" width="980" height="60" fill="#1E1712" stroke="#3B2C21" stroke-width="3"/>
  <rect x="150" y="530" width="920" height="30" fill="#2A1F18" stroke="#3B2C21" stroke-width="3"/>
  <!-- canvas surface hint -->
  <rect x="150" y="522" width="920" height="10" fill="#DCCFB2" opacity="0.35"/>
  <!-- corner posts -->
  <line x1="190" y1="530" x2="190" y2="270" stroke="#B8912F" stroke-width="10"/>
  <line x1="1030" y1="530" x2="1030" y2="270" stroke="#B8912F" stroke-width="10"/>
  <circle cx="190" cy="264" r="10" fill="#E8CE7A"/>
  <circle cx="1030" cy="264" r="10" fill="#E8CE7A"/>
  <!-- ropes with sag -->
  <path d="M 196 306 Q 610 322 1024 306" stroke="#EFE6D0" stroke-width="5" fill="none"/>
  <path d="M 196 380 Q 610 396 1024 380" stroke="#EFE6D0" stroke-width="5" fill="none"/>
  <path d="M 196 454 Q 610 470 1024 454" stroke="#EFE6D0" stroke-width="5" fill="none"/>
  <!-- turnbuckle ties -->
  <g stroke="#6B4E12" stroke-width="4">
    <line x1="190" y1="300" x2="212" y2="308"/><line x1="190" y1="374" x2="212" y2="382"/><line x1="190" y1="448" x2="212" y2="456"/>
    <line x1="1030" y1="300" x2="1008" y2="308"/><line x1="1030" y1="374" x2="1008" y2="382"/><line x1="1030" y1="448" x2="1008" y2="456"/>
  </g>
  <!-- corner pads -->
  <rect x="176" y="290" width="28" height="180" rx="10" fill="#5C2A1C"/>
  <rect x="1016" y="290" width="28" height="180" rx="10" fill="#3B2C21"/>
  <!-- steps -->
  <rect x="70" y="620" width="120" height="18" fill="#1E1712" stroke="#3B2C21" stroke-width="3"/>
  <rect x="56" y="638" width="148" height="18" fill="#1E1712" stroke="#3B2C21" stroke-width="3"/>
  <!-- floor line -->
  <line x1="0" y1="688" x2="1220" y2="688" stroke="#2A1F18" stroke-width="4"/>
  <!-- honest label -->
  <text x="1196" y="732" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#B5A688">PLACEHOLDER ILLUSTRATION</text>
</svg>
