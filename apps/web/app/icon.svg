<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The seal, reduced to what survives 16px: the double ring, the stamp
       red, the slab monogram. The full roundel with curved rim text lives in
       ppbf.css (.seal); this is its favicon-scale reading. Ground is the ink
       leather so the tab reads as the platform in a row of white favicons. -->
  <rect width="64" height="64" rx="12" fill="#14100D"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#A81E22" stroke-width="3.5"/>
  <circle cx="32" cy="32" r="20.5" fill="none" stroke="#A81E22" stroke-width="2"/>
  <text x="32" y="41" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="24" letter-spacing="0.5" fill="#A81E22">P</text>
</svg>
