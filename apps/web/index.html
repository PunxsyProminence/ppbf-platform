<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPBF Unified Management Platform - Build v21.0</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- UNIFIED NAVIGATION TREE -->
        <nav>
            <h1>PPBF Unified Node</h1>
            <div class="stencil">PRODUCTION BUILD v21.0<br>204 PENNSYLVANIA AVE,<br>BIG RUN(PA), PA 15715</div>
            <div class="nav-links">
                <!-- ATHLETE ACCESSIBLE MAIN PORTS -->
                <button id="btn-athleteTerminal" class="nav-btn active" data-panel="sect-athleteTerminal">1. Athlete Floor Kiosk</button>
                <button id="btn-guardianPortal" class="nav-btn" data-panel="sect-guardianPortal">2. Guardian Verification</button>
                <button id="btn-publicOnboarding" class="nav-btn" data-panel="sect-publicOnboarding">3. Public Onboarding</button>
                
                <!-- PROTECTED STAFF DESKS (UNLOCKED VIA PASSCODE GATES ONLY) -->
                <button id="link-coachDesk" class="nav-btn admin-nav-item" data-panel="sect-coachDesk">🛠️ Coach Command Desk</button>
                <button id="link-grantAnalytics" class="nav-btn admin-nav-item" data-panel="sect-grantAnalytics">📊 Grant & Board Analytics</button>
                <button id="link-systemTutorial" class="nav-btn admin-nav-item" style="border-color: var(--gold-500); color: var(--gold-500);" data-panel="sect-systemTutorial">📖 Operational Tutorial</button>
                
                <!-- UNLOCK EXECUTIVE SECURITY GATEWAY TOOL -->
                <button id="gatekeeperToggleBtn" class="nav-btn" style="margin-top: 30px; border: 1px dashed #4a5568; color: #a0aec0; text-align: center;">🔐 Unlock Admin Command</button>
            </div>
        </nav>

        <main>
            <!-- Portals will be populated here -->
            <div id="sect-athleteTerminal" class="view-panel">
                <!-- Content from original -->
            </div>
            <!-- Other sections -->
        </main>
    </div>

    <script type="module">
        import { setupTabListeners, switchTab } from '../../packages/routing/index.js';
        import { RECONCILED_PIN_KEY, showAdminPinEntry, performAdminUnlock } from '../../packages/governance/index.js';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupTabListeners();
            
            const gateBtn = document.getElementById('gatekeeperToggleBtn');
            if (gateBtn) {
                gateBtn.addEventListener('click', showAdminPinEntry);
            }

            // Initial active
            const initPanel = document.getElementById('sect-athleteTerminal');
            if (initPanel) initPanel.classList.add('active');
            
            const initBtn = document.getElementById('btn-athleteTerminal');
            if (initBtn) initBtn.classList.add('active');

            console.log('PPBF Platform initialized with decoupled packages');
        });

        // Expose for compatibility
        window.switchTab = switchTab;
        window.RECONCILED_PIN_KEY = RECONCILED_PIN_KEY;
    </script>
</body>
</html>
