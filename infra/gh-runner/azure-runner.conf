# The Azure side of the PPBF self-hosted runner, in one place (lane DBT, OD-2026-11-17-008).
#
# Read by infra/gh-runner/resources.sh (Overwatch runs it to create the resources) and, from
# the next PR, by scripts/azure-runner-launch.mjs (every launch). Neither runs it as code: each line is
# KEY=value, the value limited to [A-Za-z0-9._:/@-]. Nothing here is secret.
#
# Rolling the image is a one-line change to IMAGE: always a DIGEST (@sha256:...), never a tag,
# because anything that can push to the registry can move a tag. The digest below is
# build-runner-image run 44281767850 (tag 2.338.2-7cd95e698d76, from main 7cd95e698).

RESOURCE_GROUP=rg-ppbf-enterprise-staging
LOCATION=eastus
ENVIRONMENT_NAME=cae-ppbf-enterprise-staging
WORKLOAD_PROFILE=Consumption
JOB_NAME=caj-ppbf-gh-runner
IDENTITY_NAME=id-ppbf-gh-runner
REGISTRY_NAME=acrppbfenterprise
REGISTRY_SERVER=acrppbfenterprise.azurecr.io
IMAGE=acrppbfenterprise.azurecr.io/ppbf-gh-runner@sha256:6f98595faf7b485a957f2ad0e245fd2d55aca5ad956a57d23aa94ec2e91903a4
CONTAINER_NAME=runner
CPU=2
MEMORY=4Gi
REPLICA_TIMEOUT_SECONDS=3600
KEY_VAULT_NAME=kv-ppbf-gh-runner
KEY_VAULT_SECRET_NAME=github-app-private-key
